<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Admin Panel</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/favicon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* Font defaults — overridden by Admin → Settings → Hero Title/Subtitle Font.
     CSS variables are read by .intro-title and .intro-sub. */
  :root{
    --hero-font: 'Instrument Serif';
    --sub-font:  'Geist';
  }

  :root{
    --bg-0:#08070b; --bg-1:#0b0a10; --bg-card:rgba(255,255,255,0.028);
    --ink:#fdf5ec; --ink-2:rgba(253,245,236,0.72); --ink-3:rgba(253,245,236,0.45);
    --line:rgba(255,255,255,0.06); --line-2:rgba(255,255,255,0.09); --line-3:rgba(255,255,255,0.18);
    --accent:#e64a52; --accent-dn:color-mix(in srgb, var(--accent) 82%, black); --accent-2:#f3c969; --accent-3:#ffb3c1;
    --good:#6fd19a; --danger:#ff5468; --glass:rgba(255,255,255,0.04);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:#08070b;color:var(--ink);font-family:'Geist',ui-sans-serif,system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden;max-width:100vw;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;color:inherit;background:none;border:0;cursor:pointer;}
  input,textarea,select{font-family:inherit;color:inherit;background:transparent;border:0;outline:0;}

  /* ═══════ SITE-WIDE BACKGROUND ═══════
     Plays a full-screen 16:9 video behind the entire admin. Falls back to a
     dark gradient if no video URL is configured or playback is blocked. */
  .site-bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:radial-gradient(circle at 50% 30%,rgba(40,20,30,0.6),transparent 60%),linear-gradient(180deg,#08070b 0%,#040406 100%);}
  .site-bg video{position:absolute;top:50%;left:50%;width:max(100%,calc(100vh * 16 / 9));height:max(100%,calc(100vw * 9 / 16));transform:translate(-50%,-50%);object-fit:cover;}
  .site-bg-overlay{position:fixed;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,rgba(0,0,0,0.30) 0%,rgba(0,0,0,0.10) 40%,rgba(0,0,0,0.55) 100%);transition:opacity 0.5s ease-out;}
  /* When on the home page, lighten the overlay so the hero video stays bright */
  body.on-home .site-bg-overlay{background:linear-gradient(180deg,rgba(0,0,0,0.08) 0%,rgba(0,0,0,0.04) 50%,rgba(0,0,0,0.25) 100%);}
  .grain{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.05;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)' opacity='0.6'/></svg>");}

  /* (rain removed — replaced by full-page video background) */

  /* ═══════ CINEMATIC HOME ═══════
     The home page is just decorative text — the video background is the
     site-wide one (.site-bg) so we don't render our own here. */
  .cinematic-intro{position:relative;width:100%;min-height:calc(100vh - 50px);display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left;padding:48px 44px;overflow:hidden;}
  /* soft crimson bloom behind the greeting (design) */
  .intro-glow{position:absolute;left:10%;top:34%;width:340px;height:200px;background:rgba(230,74,82,0.14);filter:blur(90px);border-radius:50%;pointer-events:none;animation:introDrift 18s ease-in-out infinite;}
  @keyframes introDrift{0%,100%{transform:translate(0,0);}50%{transform:translate(6%,-8%);}}
  .cinematic-intro .intro-content{position:relative;z-index:2;display:flex;flex-direction:column;align-items:flex-start;gap:14px;max-width:860px;animation:introIn 1.2s cubic-bezier(.22,.9,.3,1) both;}
  @keyframes introIn{from{opacity:0;transform:translateY(20px);}to{opacity:1;transform:translateY(0);}}
  .intro-pill{display:inline-flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(20,16,24,0.45);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,0.16);font-size:11px;color:rgba(255,255,255,0.85);font-family:'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;margin-bottom:12px;}
  .intro-pill .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2);}
  /* Design display type: big, tight, with a slow iridescent shimmer. Still
     honours the user's configurable hero font from Settings. */
  .intro-title{font-family:var(--hero-font, 'Instrument Serif'),serif;font-weight:700;
    font-size:clamp(42px,9vw,84px);line-height:.98;letter-spacing:-.04em;margin:0;max-width:1100px;text-wrap:balance;
    background:linear-gradient(100deg,#e64a52,#ffb3c1,#f3c969,#e64a52);background-size:200% 100%;
    -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;
    animation:introShimmer 7s linear infinite;text-shadow:none;}
  @keyframes introShimmer{to{background-position:200% center;}}
  .intro-sub{font-family:var(--sub-font, 'Geist'),sans-serif;font-size:13px;color:rgba(253,245,236,0.5);letter-spacing:.04em;max-width:640px;line-height:1.65;margin:0;}

  .shell{position:relative;z-index:3;display:grid;grid-template-columns:216px 1fr;min-height:100vh;transition:grid-template-columns .35s cubic-bezier(.22,.9,.3,1);}
  .shell.sidebar-closed{grid-template-columns:0 1fr;}
  .shell.sidebar-closed .sidebar{transform:translateX(-100%);opacity:0;pointer-events:none;}
  .sidebar{transition:transform .35s cubic-bezier(.22,.9,.3,1),opacity .25s ease-out;will-change:transform;}

  /* Liquid glass — applied to sidebar, topbar, and content cards */
  .liquid-glass{
    background:rgba(255,255,255,0.04);
    background-blend-mode:luminosity;
    backdrop-filter:blur(20px) saturate(1.4);
    -webkit-backdrop-filter:blur(20px) saturate(1.4);
    border:1px solid rgba(255,255,255,0.08);
    box-shadow:inset 0 1px 1px rgba(255,255,255,0.10), 0 12px 40px rgba(0,0,0,0.25);
    position:relative;
    overflow:hidden;
  }

  .sidebar{position:sticky;top:0;height:100vh;padding:0;display:flex;flex-direction:column;background:rgba(11,10,16,0.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-right:1px solid var(--line);}
  .sidebar::after{content:none;}
  .brand{display:flex;align-items:center;gap:9px;padding:16px 14px 14px;border-bottom:1px solid rgba(255,255,255,0.05);}
  .brand-mark{width:30px;height:30px;border-radius:8px;overflow:hidden;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--accent),#8f2830);font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:600;color:var(--ink);}
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-mark svg{width:16px;height:16px;color:var(--ink);}
  .brand-title{font-size:12.5px;font-weight:600;letter-spacing:-0.01em;color:var(--ink);white-space:nowrap;}
  .brand-sub{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.14em;color:var(--ink-3);text-transform:uppercase;margin-top:2px;}

  .nav{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:1px;padding:10px 8px;}
  .nav-item{position:relative;display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:rgba(253,245,236,0.58);font-size:12px;font-weight:500;transition:background .15s,transform .15s,color .15s;border:1px solid transparent;text-align:left;width:100%;}
  .nav-item:hover{color:var(--ink);background:rgba(255,255,255,0.05);transform:translateX(3px);}
  .nav-item .num{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:.06em;color:rgba(253,245,236,0.28);width:16px;flex:0 0 auto;}
  .nav-item .ic{width:16px;height:16px;flex:0 0 16px;opacity:.85;display:none;}
  .nav-item.active{color:var(--ink);background:rgba(230,74,82,0.1);border-color:rgba(230,74,82,0.28);transform:none;}
  .nav-item.active .num{color:var(--accent);}
  .nav-tail{margin-top:auto;padding:12px 14px;border-top:1px solid rgba(255,255,255,0.05);display:flex;align-items:center;justify-content:space-between;gap:8px;color:var(--ink-3);font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
  .nav-tail .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(111,209,154,0.7);margin-right:6px;vertical-align:middle;animation:navPulse 2.4s ease infinite;}
  @keyframes navPulse{0%,100%{opacity:.6;}50%{opacity:1;}}
  .nav-lock{font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.12em;color:rgba(253,245,236,0.3);cursor:pointer;background:none;border:0;padding:0;}
  .nav-lock:hover{color:var(--accent);}

  .menu-btn{display:inline-flex;}
  .scrim{display:none;}

  .topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;height:50px;padding:0 18px;border-bottom:1px solid var(--line);background:rgba(11,10,16,0.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);}
  .crumb{display:flex;align-items:center;gap:12px;font-size:13px;overflow:hidden;}
  .crumb .sec-num{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:var(--accent);text-shadow:0 0 12px rgba(230,74,82,0.8);flex:0 0 auto;}
  .crumb .here{color:var(--ink);font-weight:600;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .crumb-sep{display:none;}
  .top-actions{display:flex;align-items:center;gap:8px;margin-left:auto;position:relative;}
  .icon-btn{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:transparent;border:1px solid var(--line-2);color:var(--ink-2);position:relative;}
  /* Show only on mobile widths (used by the audio toggle) */
  .mobile-only{display:none;}
  @media (max-width:880px){
    .mobile-only{display:inline-flex;}
  }
  .icon-btn:hover{color:var(--ink);background:rgba(255,255,255,0.06);}
  .icon-btn.active{color:#fff;background:rgba(230,74,82,0.12);border-color:rgba(230,74,82,0.32);}
  .avatar-mini{width:36px;height:36px;border-radius:50%;background:conic-gradient(from 140deg,#b4d2ff,#ffffff,#b4d2ff,#b4d2ff);box-shadow:inset 0 0 0 2px #0c0608,0 0 0 1px var(--line-2);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .avatar-mini img{width:100%;height:100%;object-fit:cover;border-radius:50%;}

  .main{display:flex;flex-direction:column;min-width:0;}
  .content{padding:28px 32px 60px;display:flex;flex-direction:column;gap:24px;}
  .content-home{padding:0 !important;gap:0 !important;}
  .content-home .below-fold{padding:48px 32px 60px;display:flex;flex-direction:column;gap:24px;}
  .content > *:not(.section-view){animation:fadeUp .35s ease-out both;}
  .content-home > *{animation:none;}
  @keyframes fadeUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  .glass{position:relative;border-radius:14px;padding:18px 20px;background:var(--bg-card);border:1px solid rgba(255,255,255,0.07);}

  /* ── Presets grid ── */
  .preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px;}
  .preset-card{position:relative;border-radius:16px;overflow:hidden;background:var(--bg-card);border:1px solid rgba(255,255,255,0.07);transition:border-color .2s,transform .2s;display:flex;flex-direction:column;}
  .preset-card:hover{border-color:rgba(230,74,82,0.4);transform:translateY(-2px);}
  /* Swatch is a wide banner across the top of the card */
  .preset-swatch{height:88px;display:flex;align-items:flex-end;padding:8px 12px;position:relative;}
  .preset-swatch::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(4,3,6,0.75));pointer-events:none;}
  .preset-swatch-meta{position:relative;z-index:1;display:flex;justify-content:space-between;align-items:baseline;gap:8px;width:100%;font-family:'JetBrains Mono',monospace;font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(253,245,236,0.85);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .preset-card-body{padding:12px 14px 14px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .preset-name{font-size:13px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .preset-meta{font-family:'JetBrains Mono',monospace;font-size:8px;letter-spacing:.1em;text-transform:uppercase;color:rgba(253,245,236,0.35);margin-top:2px;}
  /* Actions spread evenly across the full card width */
  .preset-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:auto;}
  .preset-actions .btn{width:100%;justify-content:center;}
  .preset-actions .preset-apply{grid-column:1 / -1;}
  @media (max-width:880px){
    .preset-grid{grid-template-columns:1fr;gap:12px;}
  }
  .glass::before{content:none;}
  .glass::after{content:none;}

  .section-title{font-size:19px;font-weight:650;line-height:1.15;letter-spacing:-.02em;color:var(--ink);position:relative;}
  .section-meta{margin-top:4px;font-size:12px;color:rgba(253,245,236,0.5);position:relative;}
  /* Section header row: title/meta left, status + Reset + Publish right */
  .sec-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:12px;margin-bottom:18px;}
  .sec-head-actions{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,245,236,0.45);}

  /* ── Design layout primitives (shared by every section) ── */
  .sec-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:14px;align-items:start;}
  .sec-grid.wide{grid-template-columns:repeat(auto-fit,minmax(280px,1fr));}
  /* Masonry packing — cards flow into columns and stack tightly instead of
     leaving tall gaps when one column's card is much taller than its neighbour. */
  .sec-masonry{columns:340px auto;column-gap:14px;}
  .sec-masonry > *{break-inside:avoid;-webkit-column-break-inside:avoid;page-break-inside:avoid;margin:0 0 14px;display:block;width:100%;}
  .span-all{grid-column:1/-1;}
  /* Group card header: lettered marker + eyebrow */
  .grp-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .grp-letter{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);}
  .grp-title{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,245,236,0.45);}
  /* Small field label above an input */
  .lbl{font-size:11px;font-weight:500;color:rgba(253,245,236,0.7);margin-bottom:5px;}
  .lbl-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .lbl-count{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(253,245,236,0.35);}
  .fld-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;}
  /* A control row: label left, control right */
  .ctl-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .ctl-row > span:first-child{font-size:11.5px;color:rgba(253,245,236,0.75);}
  .ctl-stack{display:flex;flex-direction:column;gap:12px;}
  /* Slider with an inline value readout */
  .sld-head{display:flex;justify-content:space-between;font-size:11.5px;color:rgba(253,245,236,0.75);margin-bottom:4px;}
  .sld-val{font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--accent-2);}
  /* Repeatable rows (bio lines, socials, badges) */
  .row-list{display:flex;flex-direction:column;gap:8px;}
  .rep-row{display:flex;align-items:center;gap:8px;}
  .rep-grip{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(253,245,236,0.25);cursor:grab;user-select:none;flex:0 0 auto;}
  .rep-x{font-family:'JetBrains Mono',monospace;font-size:11px;color:rgba(253,245,236,0.3);cursor:pointer;padding:4px;background:none;border:0;flex:0 0 auto;}
  .rep-x:hover{color:var(--accent);}
  .add-row{margin-top:10px;padding:7px;border:1px dashed rgba(255,255,255,0.14);border-radius:8px;text-align:center;font-size:11.5px;color:rgba(253,245,236,0.5);cursor:pointer;background:none;width:100%;}
  .add-row:hover{border-color:rgba(230,74,82,0.5);color:var(--ink);}
  .add-row:disabled{opacity:.35;cursor:not-allowed;}
  /* Tag chips */
  .chip{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.08em;background:rgba(230,74,82,0.1);border:1px solid rgba(230,74,82,0.25);color:var(--accent-3);border-radius:5px;padding:3px 7px;width:64px;text-align:center;flex:0 0 auto;text-transform:uppercase;}
  .chip-gold{background:rgba(255,255,255,0.06);border-color:rgba(255,255,255,0.09);color:var(--accent-2);width:70px;}
  /* Analytics rows + bars */
  .stat-row{display:flex;align-items:center;gap:10px;}
  .stat-rank{font-family:'JetBrains Mono',monospace;font-size:9px;color:rgba(253,245,236,0.35);width:14px;flex:0 0 auto;}
  .stat-name{font-size:12px;font-weight:500;width:74px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .mini-bar{flex:1;height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;min-width:30px;}
  .mini-bar > span{display:block;height:100%;border-radius:2px;background:linear-gradient(90deg,var(--accent),var(--accent-3));transform-origin:left;animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both;}
  .mini-bar.gold > span{background:linear-gradient(90deg,var(--accent-2),var(--accent));}
  .mini-bar.plain > span{background:rgba(253,245,236,0.4);}
  .stat-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(253,245,236,0.6);width:42px;text-align:right;flex:0 0 auto;}
  .cc-chip{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:600;letter-spacing:.06em;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);border-radius:4px;padding:2px 5px;width:30px;text-align:center;flex:0 0 auto;color:var(--accent-2);}
  /* Live preview panel */
  .preview-box{border:1px solid rgba(255,255,255,0.08);border-radius:10px;background:radial-gradient(220px 120px at 50% 0%, rgba(230,74,82,0.08), transparent 70%), #060509;padding:16px 14px;text-align:center;position:relative;overflow:hidden;}
  .preview-tag{position:absolute;top:6px;left:10px;font-family:'JetBrains Mono',monospace;font-size:7.5px;letter-spacing:.14em;color:rgba(253,245,236,0.3);}
  @media (max-width:880px){ .sec-grid,.sec-grid.wide{grid-template-columns:1fr;} .sec-masonry{columns:1;} }

  .input{width:100%;padding:8px 10px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);color:var(--ink);font-size:12.5px;}
  .input:focus{border-color:var(--line-3);background:rgba(255,255,255,0.06);}
  .input:disabled{opacity:.5;cursor:not-allowed;}
  .textarea{width:100%;padding:9px 11px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);color:var(--ink);font-size:12.5px;font-family:'Geist',sans-serif;resize:vertical;min-height:100px;line-height:1.55;}
  .field{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-radius:12px;border:1px solid rgba(255,255,255,0.07);background:var(--bg-card);position:relative;}
  .field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;}
  .field-title{font-size:12px;font-weight:500;color:var(--ink);}
  .field-sub{font-size:10.5px;color:rgba(253,245,236,0.4);}

  .btn{display:inline-flex;align-items:center;gap:7px;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:500;color:var(--ink);border:1px solid rgba(255,255,255,0.12);background:transparent;transition:background .15s,filter .15s,transform .15s;white-space:nowrap;position:relative;}
  .btn::before{content:none;}
  .btn:hover:not(:disabled){background:rgba(255,255,255,0.05);}
  .btn:disabled{opacity:.5;cursor:not-allowed;}
  .btn:active:not(:disabled){transform:scale(0.96);}
  .btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-dn));border-color:transparent;color:#fff;font-weight:600;box-shadow:0 6px 18px rgba(230,74,82,0.25);}
  .btn-primary:hover:not(:disabled){background:linear-gradient(180deg,var(--accent),var(--accent-dn));filter:brightness(1.1);}
  .btn-danger{background:transparent;border-color:rgba(255,84,104,0.4);color:var(--danger);font-weight:600;}
  .btn-danger:hover:not(:disabled){background:rgba(255,84,104,0.1);}
  .btn-gold{background:transparent;border-color:rgba(243,201,105,0.4);color:var(--accent-2);font-weight:600;}
  .btn-gold:hover:not(:disabled){background:rgba(243,201,105,0.08);}
  .btn-tiny{padding:6px 13px;font-size:11px;}

  .status-pill{display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;border:1.4px solid var(--good);background:rgba(78,200,138,0.06);position:relative;}
  .status-pill.warn{border-color:var(--danger);background:rgba(255,80,90,0.06);}
  .status-pill .dot{width:10px;height:10px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good);}
  .status-pill.warn .dot{background:var(--danger);box-shadow:0 0 12px var(--danger);}
  .status-pill .ttl{font-size:14px;font-weight:600;color:var(--good);}
  .status-pill.warn .ttl{color:var(--danger);}
  .status-pill .sub{font-size:10.5px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;}
  .save-status{font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.08em;}
  .save-status.ok{color:var(--good);}
  .save-status.err{color:var(--danger);}

  .label-sub{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,245,236,0.6);margin:20px 0 10px 0;position:relative;}

  .hero-block{display:grid;grid-template-columns:1fr;gap:18px;}
  .hero-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px;}
  .hero-stats{position:relative;display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:18px;}
  .range-tabs{display:inline-flex;padding:2px;border-radius:9px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);gap:2px;}
  .range-tabs button{padding:5px 12px;border-radius:7px;font-size:10px;font-weight:500;color:rgba(253,245,236,0.45);letter-spacing:.08em;font-family:'JetBrains Mono',monospace;text-transform:uppercase;transition:color .15s,background .15s;}
  .range-tabs button:hover{color:var(--ink-2);}
  .range-tabs button.active{background:rgba(253,245,236,0.12);color:var(--ink);}
  .hero-card{position:relative;padding:20px 22px;border-radius:14px;overflow:hidden;background:var(--bg-card);border:1px solid rgba(255,255,255,0.07);}
  .hero-card::before{content:"";position:absolute;inset:0;border-radius:14px;pointer-events:none;background:radial-gradient(500px 220px at 12% 0%, rgba(230,74,82,0.1), transparent 65%);}
  .hero-card::after{content:none;}
  .hero-grid-lines{position:absolute;inset:0;opacity:.20;background-image:linear-gradient(rgba(255,255,255,0.18) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.18) 1px,transparent 1px);background-size:48px 48px;mask-image:radial-gradient(circle at 30% 40%,black,transparent 75%);}
  .hero-tag{position:relative;display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,0.06);border:1px solid var(--line-2);font-size:10.5px;color:var(--ink-2);font-family:'JetBrains Mono',monospace;letter-spacing:.18em;text-transform:uppercase;}
  .hero-tag .dot{width:6px;height:6px;border-radius:50%;background:var(--accent-2);box-shadow:0 0 10px var(--accent-2);}
  .hero-cta{position:relative;display:flex;gap:10px;margin-top:18px;flex-wrap:wrap;}
  .kpi-tile{padding:12px;border-radius:12px;background:rgba(255,255,255,0.03);border:1px solid var(--line-2);position:relative;overflow:hidden;}
  .kpi-tile .kl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-family:'JetBrains Mono',monospace;}
  .kpi-tile .kv{font-size:22px;font-weight:650;margin-top:4px;letter-spacing:-.01em;color:var(--ink);line-height:1.1;}
  .kpi-tile .kd{font-size:10px;font-family:'JetBrains Mono',monospace;margin-top:2px;}
  .kpi-tile .spark{height:30px;margin-top:6px;}
  .delta-up{color:var(--good);}
  .delta-dn{color:var(--danger);}
  .big-stat{font-size:clamp(30px,7vw,40px);font-weight:700;line-height:1;letter-spacing:-.03em;color:var(--ink);margin-top:6px;position:relative;}
  .big-stat-sub{font-size:11px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;margin-top:6px;position:relative;}
  .big-stat-foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-size:11px;position:relative;}
  .ref-list{display:flex;flex-direction:column;gap:7px;position:relative;}
  .ref-row{display:grid;grid-template-columns:32px 1.2fr 1.4fr 70px;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,0.025);border:1px solid var(--line);}
  .country-ref-row{grid-template-columns:32px 1.4fr 1.6fr 60px;}
  /* Country flag chip — real flag raster, sized for the compact analytics row.
     The Flag component falls back to a 2-letter tile if the image fails. */
  .flag{width:22px;height:15px;border-radius:3px;flex:0 0 auto;box-shadow:0 0 0 1px rgba(255,255,255,0.12);background:rgba(255,255,255,0.04);object-fit:cover;display:block;}
  .ref-favi{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(230,74,82,0.10);border:1px solid var(--line-2);color:#fff;font-family:'JetBrains Mono',monospace;font-size:12px;}
  .country-name{font-size:12.5px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  .country-bar{flex:1;height:5px;border-radius:5px;background:rgba(255,255,255,0.05);overflow:hidden;max-width:120px;margin-left:auto;}
  .country-bar > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent-2),var(--accent));border-radius:5px;}
  .country-val{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-2);width:42px;text-align:right;}
  .analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .card-head{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;position:relative;}
  .card-title{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,245,236,0.45);min-width:0;}
  .card-sub{font-size:10.5px;color:var(--ink-3);font-family:'JetBrains Mono',monospace;letter-spacing:.16em;text-transform:uppercase;}

  .interest-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;position:relative;}
  .interest-col{display:flex;flex-direction:column;gap:10px;padding:16px 14px;border-radius:14px;border:1px solid var(--line-2);background:rgba(255,255,255,0.03);}
  .interest-head{display:flex;flex-direction:column;align-items:flex-start;gap:8px;}
  .interest-mark{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:rgba(230,74,82,0.1);border:1px solid rgba(230,74,82,0.25);font-size:16px;}
  .interest-label{font-size:14px;font-weight:600;color:var(--ink);text-transform:capitalize;}
  .interest-desc{flex:1;min-height:120px;font-size:12.5px;font-family:'Geist',sans-serif;font-style:normal;line-height:1.55;resize:vertical;}

  .grid-2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;position:relative;}
  .grid-3{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;position:relative;}

  /* Section page wrapper — sections sit directly on the page background
     (the design has no outer card around a section's content). */
  .sec-page{max-width:1080px;}
  /* ── Compact + grouped layout (legacy scope, still used by a few blocks) ── */
  .compact-editor{padding:20px 22px;}
  .compact-editor .field{padding:9px 12px;gap:5px;border-radius:10px;}
  .compact-editor .field-title{font-size:12px;}
  .compact-editor .field-sub{font-size:10px;line-height:1.4;}
  .compact-editor .grid-2,.compact-editor .grid-3{gap:10px;}
  /* Each "· sub-section" header gets a divider above it so groups read clearly. */
  .compact-editor .label-sub{margin:14px 0 8px;padding-top:13px;border-top:1px solid var(--line-2);}
  .compact-editor .label-sub:first-of-type{border-top:none;padding-top:2px;margin-top:8px;}
  .compact-editor .input{padding:8px 10px;}
  .compact-editor .color-row{gap:8px;}
  .compact-editor .segmented button{padding:6px 9px;}

  .checkbox{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:12px;border:1px solid rgba(255,255,255,0.07);background:var(--bg-card);cursor:pointer;}
  .checkbox .cbox{width:18px;height:18px;border-radius:5px;border:1.4px solid var(--line-3);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;background:rgba(0,0,0,0.4);color:#06060a;}
  .checkbox.checked .cbox{background:var(--accent);border-color:var(--accent);}
  .checkbox .cb-l{font-size:12px;font-weight:500;}
  .checkbox .cb-s{font-size:10.5px;color:rgba(253,245,236,0.4);margin-top:2px;}

  .slider{-webkit-appearance:none;appearance:none;height:4px;border-radius:4px;background:rgba(255,255,255,0.12);width:100%;}
  .slider::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:15px;height:15px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(230,74,82,0.18);cursor:pointer;}
  .slider::-moz-range-thumb{width:15px;height:15px;border-radius:50%;background:var(--accent);border:0;box-shadow:0 0 0 4px rgba(230,74,82,0.18);cursor:pointer;}

  .segmented{display:flex;padding:2px;border-radius:8px;background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.08);gap:2px;}
  .segmented button{flex:1;padding:4px 10px;border-radius:6px;font-size:10.5px;font-weight:500;color:rgba(253,245,236,0.5);letter-spacing:.02em;white-space:nowrap;}
  .segmented button.active{background:rgba(253,245,236,0.12);color:var(--ink);font-weight:600;}
  @keyframes favNameFlow{0%{background-position:200% 50%;}100%{background-position:0% 50%;}}

  .swatch{width:34px;height:30px;border-radius:7px;border:1px solid var(--line-2);flex-shrink:0;cursor:pointer;padding:0;background:none;}
  .color-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;}
  .color-row .input{font-family:'JetBrains Mono',monospace;font-size:12px;flex:1;min-width:0;}
  .gradient-preview{height:46px;border-radius:9px;border:1px solid var(--line-2);}

  .badge-row{display:grid;grid-template-columns:48px 1fr 36px;gap:12px;align-items:center;padding:12px;border-radius:12px;background:rgba(255,255,255,0.025);border:1px solid var(--line);margin-bottom:10px;}
  .badge-thumb{width:48px;height:48px;border-radius:9px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.04);border:1px solid var(--line-2);overflow:hidden;color:var(--ink-3);}
  .badge-thumb img{width:100%;height:100%;object-fit:contain;}
  /* Banner cropper — preview matches the public banner's 120px-tall full-width ratio */
  .bnr-crop{position:relative;width:100%;max-width:600px;aspect-ratio:600 / 120;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:rgba(0,0,0,0.35);cursor:grab;touch-action:none;user-select:none;}
  .bnr-crop.dragging{cursor:grabbing;}
  .bnr-crop img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;}
  .bnr-crop-hint{position:absolute;left:10px;bottom:8px;z-index:2;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.45);padding:3px 8px;border-radius:6px;pointer-events:none;backdrop-filter:blur(6px);}
  .bnr-crop-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:11px;font-family:'JetBrains Mono',monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);}
  .bnr-zoom-row{display:flex;align-items:center;gap:12px;margin-top:12px;}
  .bnr-zoom-row .slider{flex:1;}
  /* Banner crop modal (Discord-style) */
  .bnrmodal-scrim{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,0.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;padding:24px;animation:scrimIn .2s ease-out both;}
  .bnrmodal{position:relative;width:100%;max-width:560px;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#160a0d,#0b0609);border:1px solid var(--line-2);box-shadow:0 40px 100px -30px rgba(0,0,0,0.8);animation:settingsContentIn .3s ease-out both;}
  .bnrmodal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line);}
  .bnrmodal-title{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:rgba(253,245,236,0.6);}
  .bnrmodal-stage{position:relative;width:100%;aspect-ratio:600 / 120;background:repeating-conic-gradient(rgba(255,255,255,0.03) 0% 25%, transparent 0% 50%) 50% / 22px 22px;overflow:hidden;cursor:grab;touch-action:none;user-select:none;border-bottom:1px solid var(--line);}
  .bnrmodal-stage.grabbing{cursor:grabbing;}
  .bnrmodal-stage img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none;}
  .bnrmodal-guide{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);}
  .bnrmodal-hint{position:absolute;left:10px;bottom:8px;z-index:2;font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,0.7);background:rgba(0,0,0,0.5);padding:3px 8px;border-radius:6px;pointer-events:none;backdrop-filter:blur(6px);}
  .bnrmodal-controls{padding:18px 20px;display:flex;flex-direction:column;gap:14px;}
  .bnrmodal-ctl{display:flex;flex-direction:column;gap:8px;}
  .bnrmodal-ctl-l{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-family:'JetBrains Mono',monospace;display:flex;justify-content:space-between;}
  .bnrmodal-ctl-l em{font-style:normal;color:var(--ink-2);}
  .bnrmodal-rotbtns{display:flex;align-items:center;gap:8px;}
  .bnrmodal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 20px;border-top:1px solid var(--line);}
  .social-row{display:grid;grid-template-columns:36px 1fr 1fr 1fr 36px;gap:10px;align-items:center;padding:10px 12px;border-radius:11px;background:rgba(255,255,255,0.025);border:1px solid var(--line);margin-bottom:8px;}

  .switch{position:relative;width:34px;height:19px;border-radius:10px;background:rgba(255,255,255,0.12);border:0;cursor:pointer;transition:background .2s;flex-shrink:0;}
  .switch .knob{position:absolute;top:2px;left:2px;width:15px;height:15px;border-radius:50%;background:var(--ink);transition:left .3s cubic-bezier(0.34,1.56,0.64,1);}
  .switch.on{background:var(--accent);}
  .switch.on .knob{left:17px;background:var(--ink);}

  /* NO backdrop-filter here: a full-viewport blur layer over the fixed
     background <video> composites to solid black in Chrome — that's what made
     opening Settings black out the whole screen. Plain translucent dim only. */
  .settings-scrim{position:fixed;inset:0;background:rgba(4,3,6,0.62);z-index:60;animation:scrimIn .28s ease-out both;}
  .settings-panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,94vw);z-index:61;background:#0d0c13;border-left:1px solid rgba(255,255,255,0.08);box-shadow:-30px 0 80px rgba(0,0,0,0.55);overflow-y:auto;animation:settingsIn .45s cubic-bezier(.22,1,.36,1) both;}
  /* Numbered section header rows inside the settings drawer */
  .set-sec{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .set-sec .n{font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--accent);}
  .set-sec .t{font-family:'JetBrains Mono',monospace;font-size:9.5px;letter-spacing:.16em;color:rgba(253,245,236,0.6);text-transform:uppercase;}
  .set-sec .s{font-size:10.5px;color:rgba(253,245,236,0.38);}
  .set-sec.danger .n,.set-sec.danger .t{color:var(--danger);}
  .settings-panel > * {animation:settingsContentIn .5s .12s ease-out both;}
  @keyframes scrimIn{from{opacity:0;}to{opacity:1;}}
  @keyframes enterPulse{0%,100%{opacity:.72;}50%{opacity:1;}}
  @keyframes settingsIn{from{transform:translateX(40px);opacity:0;}to{transform:translateX(0);opacity:1;}}
  @keyframes settingsContentIn{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:translateY(0);}}

  /* ── Section transition (design) ──
     A restrained "cinema" ease-in: the incoming section rises and settles with
     a long cubic-bezier(.16,1,.3,1), and its cards stagger in behind it. No
     perspective push, blur or light sweep — those were the old treatment. */
  .section-view{position:relative;animation:cinema .8s cubic-bezier(.16,1,.3,1) both;}
  /* The design's transition: the section wipes in sideways (left→right) via
     clip-path while sliding back from a 20px offset. */
  @keyframes cinema{
    0%{opacity:0;clip-path:inset(0 100% 0 0 round 14px);transform:translateX(20px);}
    40%{opacity:1;}
    100%{opacity:1;clip-path:inset(0 -2% 0 0 round 0px);transform:translateX(0);}
  }
  /* staggered reveal of the section's cards */
  .section-view > section > *,
  .section-view > .glass,
  .section-view .sec-grid > *{animation:fadeUpCard .8s cubic-bezier(.16,1,.3,1) both;}
  .section-view .sec-grid > *:nth-child(1){animation-delay:.08s;}
  .section-view .sec-grid > *:nth-child(2){animation-delay:.16s;}
  .section-view .sec-grid > *:nth-child(3){animation-delay:.24s;}
  .section-view .sec-grid > *:nth-child(4){animation-delay:.32s;}
  .section-view .sec-grid > *:nth-child(5){animation-delay:.40s;}
  .section-view .sec-grid > *:nth-child(6){animation-delay:.48s;}
  @keyframes fadeUpCard{from{opacity:0;transform:translateY(16px) scale(.99);}to{opacity:1;transform:translateY(0) scale(1);}}
  /* On the home/greeting screen the greeting owns its own entrance. */
  .content-home .section-view{animation:none;}
  .content-home .section-view > section > *,
  .content-home .section-view > .glass{animation:none;}
  @media (prefers-reduced-motion: reduce){
    .section-view{animation:none;}
    .section-view > section > *,.section-view > .glass,.section-view .sec-grid > *{animation:none;}
  }

  /* Visitor devices — stat strip + 3-column breakdowns (donut / browsers / OS) */
  .devices-stat-strip{display:grid;grid-template-columns:1fr;gap:10px;margin-bottom:16px;}
  .device-stat{padding:12px 14px;border-radius:11px;background:rgba(255,255,255,0.03);border:1px solid var(--line-2);}
  .device-stat .kl{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);font-family:'JetBrains Mono',monospace;}
  .device-stat-v{font-size:18px;font-weight:650;margin-top:3px;color:var(--ink);}
  .devices-grid{display:grid;grid-template-columns:1.1fr 1fr 1fr;gap:18px;align-items:start;}
  .devices-cell{display:flex;flex-direction:column;gap:14px;padding:16px;border-radius:13px;background:rgba(255,255,255,0.02);border:1px solid var(--line);}
  .devices-donut-cell{align-items:center;}
  .cell-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-3);font-family:'JetBrains Mono',monospace;align-self:flex-start;}
  .bar-list{display:flex;flex-direction:column;gap:9px;width:100%;}
  .bar-row{display:grid;grid-template-columns:64px 1fr 34px;align-items:center;gap:10px;}
  .bar-name{font-size:11.5px;color:rgba(253,245,236,0.75);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bar-track{height:4px;border-radius:2px;background:rgba(255,255,255,0.06);overflow:hidden;}
  .bar-track > span{display:block;height:100%;border-radius:2px;background:rgba(253,245,236,0.4);transform-origin:left;animation:barGrow .9s cubic-bezier(.2,.8,.2,1) both;}
  @keyframes barGrow{from{transform:scaleX(0);}}
  .bar-val{font-family:'JetBrains Mono',monospace;font-size:10px;color:rgba(253,245,236,0.55);text-align:right;}
  @media (max-width:880px){
    .devices-grid{grid-template-columns:1fr;}
    .devices-stat-strip{grid-template-columns:1fr;}
  }

  .login-screen{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;background:radial-gradient(900px 600px at 50% 18%, rgba(230,74,82,0.16), transparent 62%),radial-gradient(700px 500px at 82% 96%, rgba(243,201,105,0.07), transparent 60%),#08070b;overflow:hidden;}
  /* faint moving grid so the plain background isn't dead-flat */
  .login-screen::before{content:"";position:absolute;inset:-2px;pointer-events:none;opacity:.5;
    background-image:linear-gradient(rgba(255,255,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.025) 1px,transparent 1px);

/* ═══════════════ API ═══════════════ */
function getAdminKey() { return sessionStorage.getItem("admin_key_v3") || ""; }
function setAdminKey(k) { sessionStorage.setItem("admin_key_v3", k); }
function clearAdminKey() { sessionStorage.removeItem("admin_key_v3"); }

// Optimistic-concurrency baseline: the content revision this session last saw.
// Sent with every save so the server can 409 if another tab/session wrote in
// between (prevents silent clobbering). Kept current on every load + save.
let __contentBaseRev = 0;

async function apiGet() {
  // X-Admin-Key lets get-content include any admin-only fields.
  const res = await fetch("/.netlify/functions/get-content", { headers: { "Cache-Control": "no-cache", "X-Admin-Key": getAdminKey() } });
  if (!res.ok) throw new Error("Failed to load content (HTTP " + res.status + ")");
  const data = await res.json();
  if (typeof data.contentRev === "number") __contentBaseRev = data.contentRev;
  return data;
}

async function apiUpdate(payload) {
  const res = await fetch("/.netlify/functions/update-content", {
    method: "POST",
    headers: { "Content-Type": "application/json", "X-Admin-Key": getAdminKey() },
    body: JSON.stringify({ ...payload, baseRev: __contentBaseRev }),
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 409) {
    // Another session saved since we loaded — refuse rather than overwrite,
    // and pull the latest into the form so the owner can reapply intentionally.
    if (typeof data.currentRev === "number") __contentBaseRev = data.currentRev;
    if (typeof window.__adminReload === "function") { try { await window.__adminReload(); } catch {} }
    const err = new Error("Changed in another tab — reloaded the latest. Reapply your edit and save again.");
    err.status = 409;
    throw err;
  }
  if (!res.ok) {
    const err = new Error(data.error || ("HTTP " + res.status));
    err.status = res.status;
    throw err;
  }
  if (typeof data.contentRev === "number") __contentBaseRev = data.contentRev; // stay current for the next save
  return data;
}

function isHex(s) { return typeof s === "string" && /^#[0-9a-fA-F]{6}$/.test(s); }
function safeHex(s, fallback) { return isHex(s) ? s : fallback; }

/* ═══════════════ FONT PICKER ═══════════════ */
// Pull a family into the ADMIN page so the live previews render in it. A bare
// Google Fonts `family=` (no weight spec) is valid for every family, including
// single-weight ones, so any name the user types just works.
const HEAD_FONTS = /^(Instrument Serif|Geist|JetBrains Mono)$/i;
function ensureAdminFont(name) {
  if (typeof name !== "string") return;
  name = name.trim();
  if (!name || HEAD_FONTS.test(name)) return;   // already in the <head> link
  const id = "adminfont-" + name.toLowerCase().replace(/[^a-z0-9]+/g, "-");
  if (document.getElementById(id)) return;
  const link = document.createElement("link");
  link.id = id;
  link.rel = "stylesheet";
  link.href = "https://fonts.googleapis.com/css2?family=" + encodeURIComponent(name).replace(/%20/g, "+") + "&display=swap";
  document.head.appendChild(link);
}

// Family name + optional font-file URL. Typing a Google Fonts family name is
// enough on its own; the URL is only for self-hosted faces. The name is
// debounced before we try to fetch it, so we don't hit Google once per
// keystroke while it's half-typed.
function FontPicker({ name, url, onName, onUrl, hint }) {
  useEffect(() => {
    const n = (name || "").trim();
    if (n.length < 3 || url) return;            // too short to be real, or self-hosted
    const t = setTimeout(() => ensureAdminFont(n), 600);
    return () => clearTimeout(t);
  }, [name, url]);
  return (
    <div className="ctl-stack">
      <input className="input" value={name} onChange={(e) => onName(e.target.value)} placeholder="font family name — e.g. Orbitron" maxLength={60} />
      <input className="input" value={url} onChange={(e) => onUrl(e.target.value)} placeholder="https://…/font.woff2 (optional)" maxLength={500} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }} />
      <div className="field-sub">a Google Fonts family name works on its own; add a URL to self-host (.woff2/.woff/.otf/.ttf)</div>
      {hint ? <div className="field-sub">{hint}</div> : null}
    </div>
  );
}

function useSaveStatus() {
  const [status, setStatus] = useState({ msg: "", kind: "" });
  const timerRef = useRef(null);
  const show = useCallback((msg, kind = "ok") => {
    if (timerRef.current) clearTimeout(timerRef.current);
    setStatus({ msg, kind });
    timerRef.current = setTimeout(() => setStatus({ msg: "", kind: "" }), 2800);
  }, []);
  return [status, show];
}

/* ═══════════════ LOGIN ═══════════════ */
function Login({ onSuccess }) {
  const [key, setKey] = useState("");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);
  // Show the real profile picture on the lock screen; fall back to the site
  // favicon, then to the monogram if neither image loads.
  const avatarUrl = useDiscordAvatar();
  const identity = useSiteIdentity();
  const [markErr, setMarkErr] = useState(false);
  const markSrc = !markErr ? (avatarUrl || "/favicon.png") : null;

  const submit = async (e) => {
    if (e) e.preventDefault();
    const k = key.trim();
    if (!k) { setErr("Enter admin key"); return; }
    setBusy(true); setErr("");
    // Verify with a keyed, read-only request: get-content checks the key and
    // is never cached when one is sent, so nothing is written on login.
    // - 200 = valid key → continue
    // - 401/403 = wrong key → reject
    // - other errors (lockout, network, server) = surface them
    setAdminKey(k);
    try {
      const probe = await fetch("/.netlify/functions/get-content", {
        headers: { "Cache-Control": "no-cache", "X-Admin-Key": k },
      });
      if (probe.status === 401 || probe.status === 403) {
        clearAdminKey();
        setErr("invalid admin key");
        setBusy(false);
        return;
      }
      if (!probe.ok) {
        clearAdminKey();
        const errData = await probe.json().catch(() => ({}));
        setErr(errData.error || ("server error HTTP " + probe.status));
        setBusy(false);
        return;
      }
      // The unlock click counts as the user gesture that lets us autoplay
      // the hero video with audio. We persist this in sessionStorage so
      // page reloads (while authed) also get audio without a new click.
      window.__adminAudioUnlocked = true;
      try { sessionStorage.setItem("admin_audio_unlocked", "1"); } catch {}
      onSuccess();
    } catch (e) {
      clearAdminKey();
      setErr(e.message || "network error");
      setBusy(false);
    }
  };

  return (
    <div className="login-screen">
      <div className="login-bloom a" aria-hidden="true" />
      <div className="login-bloom b" aria-hidden="true" />
      <form className="login-card" onSubmit={submit}>
        <div className="login-brand">
          <div className="login-mark">
            {markSrc ? <img src={markSrc} alt="" onError={() => setMarkErr(true)} /> : initialsOf(identity.name || identity.discordName)}
          </div>
          <div>
            <h1 className="login-title">Admin Panel</h1>
            <div className="login-sub">{SITE_HOST}</div>
          </div>
        </div>
        <div className="login-field">
          <label>Admin key</label>
          <input type="password" className="login-input" value={key} onChange={(e) => setKey(e.target.value)} placeholder="••••••••••••" autoFocus disabled={busy} />
        </div>
        <button className="login-btn" type="submit" disabled={busy || !key.trim()}>
          {busy ? "Verifying…" : <><Ico.lock /> Unlock</>}
        </button>
        <div className="login-err">{err}</div>
        <div className="login-foot">Private · Single seat</div>
      </form>
    </div>
  );
}

/* ═══════════════ TOPBAR ═══════════════ */
/* Fetches the user's current Discord avatar via Lanyard. Polls every 5 min
   so the avatar auto-updates if you change it on Discord. Returns the CDN URL,
   or null if Lanyard can't be reached / user isn't tracked. */
// The site's host name, shown on the login card, the sidebar and in help text.
const SITE_HOST = location.hostname.replace(/^www\./, "");
document.title = "Admin Panel · " + SITE_HOST;

// Who the site belongs to: the Discord user ID (DISCORD_USER_ID env var) and
// the display handle, read once from the public get-content response — it's
// needed before login too, so it doesn't use the admin key.
let __siteIdentity = null;
function loadSiteIdentity() {
  if (!__siteIdentity) {
    __siteIdentity = fetch("/.netlify/functions/get-content")
      .then((r) => { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
      .then((d) => ({
        discordUserId: typeof d.discordUserId === "string" && /^\d{15,25}$/.test(d.discordUserId) ? d.discordUserId : "",
        name: d.handle && typeof d.handle.name === "string" ? d.handle.name.trim() : "",
      }))
      .catch(() => { __siteIdentity = null; return { discordUserId: "", name: "" }; });
  }
  return __siteIdentity;
}
// The owner's Discord user via Lanyard, shared by every hook that needs it and
// refreshed at most every few minutes.
let __discordUser = { at: 0, p: null };
function loadDiscordUser() {
  if (__discordUser.p && Date.now() - __discordUser.at < 4 * 60 * 1000) return __discordUser.p;
  __discordUser.at = Date.now();
  __discordUser.p = loadSiteIdentity()
    .then(async ({ discordUserId }) => {
      if (!discordUserId) return null;
      const res = await fetch("https://api.lanyard.rest/v1/users/" + discordUserId);
      if (!res.ok) throw new Error("HTTP " + res.status);
      const json = await res.json();
      const u = json && json.data && json.data.discord_user;
      return u && u.id ? u : null;
    })
    .catch(() => { __discordUser.p = null; return null; });
  return __discordUser.p;
}
function useSiteIdentity() {
  const [identity, setIdentity] = useState({ discordUserId: "", name: "", discordName: "" });
  useEffect(() => {
    let cancelled = false;
    loadSiteIdentity().then((v) => {
      if (cancelled) return;
      setIdentity((cur) => ({ ...cur, ...v }));
      loadDiscordUser().then((u) => {
        if (!cancelled && u) setIdentity((cur) => ({ ...cur, discordName: u.display_name || u.global_name || u.username || "" }));
      });
    });
    return () => { cancelled = true; };
  }, []);
  return identity;
}
// "Jane Doe" → "JD". Shown only when the avatar and the favicon both fail.
const initialsOf = (name) => (name || "").split(/\s+/).filter(Boolean).slice(0, 2).map((w) => Array.from(w)[0]).join("").toUpperCase();

function useDiscordAvatar() {
  const [url, setUrl] = useState(null);
  useEffect(() => {
    let cancelled = false;
    const fetchAvatar = async () => {
      try {
        const u = await loadDiscordUser();
        if (!u) return;
        // Build the CDN URL. Animated avatars start with 'a_' and support .gif
        const ext = (u.avatar || "").startsWith("a_") ? "gif" : "png";
        const src = u.avatar
          ? `https://cdn.discordapp.com/avatars/${u.id}/${u.avatar}.${ext}?size=128`
          : `https://cdn.discordapp.com/embed/avatars/${(parseInt(u.id) >> 22) % 6}.png`;
        if (!cancelled) setUrl(src);
      } catch { /* silent — falls back to gradient */ }
    };
    fetchAvatar();
    const id = setInterval(fetchAvatar, 5 * 60 * 1000); // refresh every 5 min
    return () => { cancelled = true; clearInterval(id); };
  }, []);
  return url;
}

function Topbar({ active, openSettings, settingsOpen, openMenu }) {
  const navAll = [{ id: "home", label: "Home" }, ...NAV];
  const hereIdx = navAll.findIndex((n) => n.id === active);
  const here = hereIdx >= 0 ? navAll[hereIdx].label : "Admin";
  const hereNum = String((hereIdx >= 0 ? hereIdx : 0) + 1).padStart(2, "0");

  // User-controlled audio mute (mobile-only button next to Settings).
  // The state lives on window so nav between sections doesn't reset it.
  const [userMuted, setUserMuted] = useState(() => !!window.__adminUserMuted);

  // Toggle handler. The tap IS a user gesture — that's specifically why
  // putting the unmute button in the topbar fixes mobile reloads: browsers
  // require a fresh gesture before allowing autoplay-with-sound, and
  // sessionStorage flags don't satisfy that. A real button tap does.
  //
  // iOS NOTE: Safari on iOS ignores programmatic `video.volume` changes —
  // volume is hardware-controlled by the device. The ONLY way to silence
  // audio on iOS is to flip `video.muted`. So we set `muted` AND animate
  // volume; iOS uses muted, desktop uses both (volume fade still looks nice).
  const toggleAudio = () => {
    const next = !userMuted;
    setUserMuted(next);
    window.__adminUserMuted = next;
    if (!next) {
      // Unmuting also confirms the audio-unlock state for the rest of the app
      window.__adminAudioUnlocked = true;
      try { sessionStorage.setItem("admin_audio_unlocked", "1"); } catch {}
    }
    const hero = window.__adminHeroVideo;
    if (!hero) return;

    // Cancel any in-flight fade so this new one has clean ownership.
    if (window.__adminAudioFadeRaf) cancelAnimationFrame(window.__adminAudioFadeRaf);

    if (next) {
      // Mute. On iOS this is the ONLY way to actually silence audio (the
      // volume property is read-only on mobile Safari). On desktop, muting
      // is instant — but we still animate volume for the visual smoothness
      // of any meter/visualizer, and to mask the abrupt mute switch.
      const startTime = performance.now();
      const startVol = hero.volume || 0;
      const step = (t) => {
        const p = Math.min(1, (t - startTime) / 2000);
        hero.volume = Math.max(0, Math.min(1, startVol * (1 - p)));
        if (p < 1) {
          window.__adminAudioFadeRaf = requestAnimationFrame(step);
        } else {
          // Fade complete — flip muted so iOS actually goes silent
          hero.muted = true;
        }
      };
      window.__adminAudioFadeRaf = requestAnimationFrame(step);
    } else {
      // Unmute: flip muted FIRST so iOS lets us play with sound, then ramp.
      hero.muted = false;
      hero.play().catch(() => {});
      if (active === "home") {
        const startTime = performance.now();
        const startVol = hero.volume || 0;
        const step = (t) => {
          const p = Math.min(1, (t - startTime) / 2000);
          hero.volume = Math.max(0, Math.min(1, startVol + (1 - startVol) * p));
          if (p < 1) window.__adminAudioFadeRaf = requestAnimationFrame(step);
        };
        window.__adminAudioFadeRaf = requestAnimationFrame(step);
      } else {
        // Not on home — leave it muted-but-unsilenced; section fade handles
        // volume when user returns to home.
        hero.volume = 0;
      }
    }
  };

  return (
    <header className="topbar">
      <button className="icon-btn menu-btn" onClick={openMenu} title="Menu"><Ico.menu /></button>
      <div className="crumb">
        <span className="sec-num">{hereNum}</span>
        <span className="here">{here}</span>
      </div>
      <div className="top-actions">
        <button
          className={"icon-btn mobile-only"}
          title={userMuted ? "Unmute audio" : "Mute audio"}
          aria-label={userMuted ? "Unmute audio" : "Mute audio"}
          onClick={toggleAudio}
        >
          {userMuted ? <Ico.volumeOff /> : <Ico.volumeOn />}
        </button>
        <button className={"icon-btn " + (settingsOpen ? "active" : "")} title="Settings" onClick={openSettings}><Ico.gear /></button>
      </div>
    </header>
  );
}

/* ═══════════════ SPARKLINE ═══════════════ */
/* Animated count-up number. Eases from 0 → `value` once on mount and again
   whenever `value` changes (e.g. switching the analytics range). Respects
   prefers-reduced-motion by snapping straight to the final value. */
function CountUp({ value, duration = 900 }) {
  const [n, setN] = useState(value);
  const rafRef = useRef(null);
  useEffect(() => {
    const target = Number(value) || 0;
    const reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce || target === 0) { setN(target); return; }
    const start = performance.now();
    const from = 0;
    const tick = (t) => {
      const p = Math.min(1, (t - start) / duration);
      const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
      setN(Math.round(from + (target - from) * e));
      if (p < 1) rafRef.current = requestAnimationFrame(tick);
    };
    rafRef.current = requestAnimationFrame(tick);
    return () => { if (rafRef.current) cancelAnimationFrame(rafRef.current); };
  }, [value, duration]);
  return <>{Number(n).toLocaleString()}</>;
}

function Spark({ data, color = "var(--accent)" }) {
  const w = 200, h = 36;
  const max = Math.max(...data), min = Math.min(...data);
  const pts = data.map((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - ((v - min) / (max - min || 1)) * h * 0.85 - 4;
    return [x, y];
  });
  const d = pts.map((p, i) => (i === 0 ? "M" : "L") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join(" ");
  const area = d + ` L${w},${h} L0,${h} Z`;
  const uid = useMemo(() => Math.random().toString(36).slice(2, 8), []);
  const gid = "sg-" + uid;        // vertical fill fade
  const lid = "sl-" + uid;        // horizontal stroke gradient (accent → accent-2)
  return (
    <svg viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ width: "100%", height: "100%" }}>
      <defs>
        <linearGradient id={lid} x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stopColor="var(--accent)" />
          <stop offset="100%" stopColor="var(--accent-2)" />
        </linearGradient>
        <linearGradient id={gid} x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stopColor="var(--accent)" stopOpacity=".34" />
          <stop offset="100%" stopColor="var(--accent-2)" stopOpacity="0" />
        </linearGradient>
      </defs>
      <path d={area} fill={`url(#${gid})`} />
      <path d={d} fill="none" stroke={`url(#${lid})`} strokeWidth="1.5" />
      <circle cx={pts[pts.length - 1][0]} cy={pts[pts.length - 1][1]} r="2.4" fill="var(--accent-2)" />
    </svg>
  );
}

function Flag({ id, code }) {
  // Real flag images from flagcdn.com — accurate for every country, no API
  // key, no rate limit. We request the 2x40px raster which is sharp at the
  // small size flags are shown. If the image fails (offline, CDN down, or an
  // unknown country code), we fall back to the 2-letter code on a neutral tile.
  const cc = (code || id || '').toLowerCase().slice(0, 2);
  const [failed, setFailed] = useState(false);

  // Re-arm the image if the country code changes
  useEffect(() => { setFailed(false); }, [cc]);

  // 'xx' is our sentinel for "unknown country" — skip the network request.
  if (!cc || cc === 'xx' || cc.length !== 2 || failed) {
    return (
      <div className="flag" style={{ background: 'rgba(255,255,255,0.08)', display: 'flex', alignItems: 'center', justifyContent: 'center', fontSize: 9, fontWeight: 700, color: 'var(--ink-2)', letterSpacing: '.08em', fontFamily: "'JetBrains Mono', monospace" }}>
        {(code || id || '??').toUpperCase().slice(0, 2)}
      </div>
    );
  }

  return (
    <img
      className="flag"
      src={`https://flagcdn.com/w40/${cc}.png`}
      srcSet={`https://flagcdn.com/w80/${cc}.png 2x`}
      alt={cc.toUpperCase()}
      loading="lazy"
      onError={() => setFailed(true)}
      style={{ objectFit: 'cover' }}
    />
  );
}

/* ═══════════════ OVERVIEW / ANALYTICS (real backend data) ═══════════════ */
const RANGES = [

// Fetches real analytics from /.netlify/functions/get-analytics for the given range.
// Returns { state: 'loading'|'ready'|'error', data, error }.
function useAnalytics(range) {
  const [state, setState] = useState({ state: "loading", data: null, error: null });
  useEffect(() => {
    let cancelled = false;
    setState({ state: "loading", data: null, error: null });
    (async () => {
      try {
        const res = await fetch("/.netlify/functions/get-analytics?range=" + encodeURIComponent(range), {
          headers: { "X-Admin-Key": getAdminKey() },
        });
        if (!res.ok) {
          const e = await res.json().catch(() => ({}));
          throw new Error(e.error || ("HTTP " + res.status));
        }
        const json = await res.json();
        if (!cancelled) setState({ state: "ready", data: json, error: null });
      } catch (e) {
        if (!cancelled) setState({ state: "error", data: null, error: e.message || "Failed to load analytics" });
      }
    })();
    return () => { cancelled = true; };
  }, [range]);
  return state;
}

/* ═══════════════ CINEMATIC HOME (front page) ═══════════════ */
// Home greetings: edited in Settings → Home Greetings (saved with the admin
// theme). One is picked at random on each page load. {name} becomes the
// display handle — or the Discord name when no handle is set — and with no
// name at all, ", {name}" is dropped.
const DEFAULT_GREETINGS = ["first message"];
const DEFAULT_GREETING_SUBTITLE = "☆ subtitle ☆";
const cleanGreetings = (list) => {
  const out = (Array.isArray(list) ? list : []).filter((g) => typeof g === "string" && g.trim()).map((g) => g.trim());
  return out.length ? out : DEFAULT_GREETINGS;
};
const fillName = (template, name) => name
  ? template.split("{name}").join(name)
  : template.replace(/,?\s*\{name\}/g, "").trim();
//
// The video background is shared across the entire admin and is configured
// via Settings → Background Video URL (saved to the `video-bg` blob).

function CinematicHome({ data }) {
  const at = readAdminTheme(data);
  const greetings = cleanGreetings(at.greetings);
  const subtitle = typeof at.greetingSubtitle === "string" ? at.greetingSubtitle : DEFAULT_GREETING_SUBTITLE;
  const identity = useSiteIdentity();
  // Pick once per page load — survives nav away+back, re-rolls only on full
  // reload (or when the picked message was edited away). Stored on window so
  // it's stable even when this component unmounts.
  const greeting = useMemo(() => {
    if (!window.__adminIntroGreeting || !greetings.includes(window.__adminIntroGreeting)) {
      window.__adminIntroGreeting = greetings[Math.floor(Math.random() * greetings.length)];
    }
    return window.__adminIntroGreeting;
  }, [greetings.join("\n")]);
  const handle = (data && data.handle && typeof data.handle.name === "string") ? data.handle.name.trim() : "";
  const title = fillName(greeting, handle || identity.discordName);
  return (
    <div className="cinematic-intro">
      <div className="intro-glow" aria-hidden="true" />
      <div className="intro-content">
        <h1 className="intro-title">{title}</h1>
        <p className="intro-sub">{subtitle}</p>
      </div>
    </div>
  );
}

/* ═══════════════ DEVICE DONUT (analytics) ═══════════════ */
// Hollow pie chart of Desktop / Mobile / Tablet shares for the current range.
// Hovering a slice — or any legend item — updates the center label.
// Pure SVG: stroke-dasharray on circles gives us arcs without a charting lib.
const DEVICE_COLORS = {
  pc:     "#e64a52",   // crimson (design: desktop)
  mobile: "#f3c969",   // gold (design: mobile)
  tablet: "#ffb3c1",   // pink (design: tablet)
};
const DEVICE_LABELS = { pc: "Desktop", mobile: "Mobile", tablet: "Tablet" };

function DeviceDonut({ devices }) {
  // Filter to just the three categories we display, then re-normalize so the
  // donut fills the full circle (Other / Unknown are intentionally hidden).
  const visible = (devices || []).filter((d) => ["pc", "mobile", "tablet"].includes(d.id));
  const totalVisible = visible.reduce((sum, d) => sum + d.views, 0);
  const [hovered, setHovered] = useState(null);

  if (totalVisible === 0) {
    return (
      <div style={{ textAlign: "center", padding: "40px 16px", color: "var(--ink-3)", fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5, letterSpacing: ".14em", textTransform: "uppercase" }}>
        no views recorded in this range yet
      </div>
    );
  }

  // Geometry. radius 60, circumference 2πr ≈ 377.
  const R = 60;
  const C = 2 * Math.PI * R;
  // We use a single circle per slice with stroke-dasharray to draw an arc.
  // Each slice gets its dash length = (share * C). Offsets place each arc
  // at the correct rotation around the ring.
  let offset = 0;
  const arcs = visible.map((d) => {
    const share = d.views / totalVisible;
    const dash = share * C;
    const arc = {
      id: d.id,
      label: DEVICE_LABELS[d.id],
      views: d.views,
      pct: +(share * 100).toFixed(1),
      color: DEVICE_COLORS[d.id],
      dashArray: `${dash} ${C - dash}`,
      dashOffset: -offset,
    };
    offset += dash;
    return arc;
  });

  const center = hovered
    ? arcs.find((a) => a.id === hovered)
    : { label: "All visitors", views: totalVisible, pct: 100 };

  return (
    <div style={{ display: "flex", alignItems: "center", gap: 18, flexWrap: "wrap" }}>
      <div style={{ position: "relative", width: 96, height: 96, flex: "0 0 auto" }}>
        <svg viewBox="0 0 160 160" width="96" height="96" style={{ transform: "rotate(-90deg)" }}>
          {/* Track ring under everything — faint */}
          <circle cx="80" cy="80" r={R} fill="none" stroke="rgba(255,255,255,0.06)" strokeWidth="26" />
          {arcs.map((arc) => (
            <circle
              key={arc.id}
              cx="80"
              cy="80"
              r={R}
              fill="none"
              stroke={arc.color}
              strokeWidth="26"
              strokeDasharray={arc.dashArray}
              strokeDashoffset={arc.dashOffset}
              strokeLinecap="butt"
              onMouseEnter={() => setHovered(arc.id)}
              onMouseLeave={() => setHovered(null)}
              style={{ cursor: "pointer", transition: "opacity .15s", opacity: (hovered && hovered !== arc.id) ? 0.45 : 1 }}
            />
          ))}
        </svg>
        {/* Center label — absolutely positioned over the SVG, NOT rotated */}
        <div style={{ position: "absolute", inset: 0, display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", pointerEvents: "none", textAlign: "center" }}>
          <span style={{ fontSize: 15, fontWeight: 650, color: "var(--ink)", lineHeight: 1 }}>{center.pct}%</span>
          <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 7.5, letterSpacing: ".12em", textTransform: "uppercase", color: "rgba(253,245,236,0.4)", marginTop: 2 }}>
            {hovered ? center.label : "All"}
          </span>
        </div>
      </div>
      {/* Legend — one row per device, doubles as a tap target on touch */}
      <div style={{ display: "flex", flexDirection: "column", gap: 8, flex: 1, minWidth: 130 }}>
        {arcs.map((arc) => (
          <div
            key={arc.id}
            onMouseEnter={() => setHovered(arc.id)}
            onMouseLeave={() => setHovered(null)}
            style={{ display: "flex", alignItems: "center", gap: 7, fontSize: 11.5, cursor: "pointer", color: "rgba(253,245,236,0.85)" }}
          >
            <span style={{ width: 8, height: 8, borderRadius: 2, background: arc.color, display: "inline-block", flex: "0 0 auto" }} />
            {arc.label}
            <span style={{ marginLeft: "auto", fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "rgba(253,245,236,0.55)" }}>{arc.pct}%</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════ BREAKDOWN BARS (browsers / OS) ═══════════════ */
// Horizontal percentage bars, scaled so the largest share fills the track.
// Used for the Browsers and Operating-systems cells in Visitor devices.
function BreakdownBars({ rows, emptyLabel }) {
  if (!rows || rows.length === 0) {
    return (
      <div style={{ textAlign: "center", padding: "20px 12px", color: "var(--ink-3)", fontFamily: "'JetBrains Mono', monospace", fontSize: 10.5, letterSpacing: ".14em", textTransform: "uppercase", width: "100%" }}>
        {emptyLabel || "no data in this range yet"}
      </div>
    );
  }
  const max = Math.max(...rows.map((r) => r.pct), 1);
  return (
    <div className="bar-list">
      {rows.map((r, i) => (
        <div key={r.id || r.name} className="bar-row">
          <div className="bar-name">{r.name}</div>
          <div className="bar-track">
            <span style={{ width: (r.pct / max * 100) + "%", animationDelay: (0.1 + i * 0.06) + "s" }} />
          </div>
          <div className="bar-val">{r.pct}%</div>
        </div>
      ))}
    </div>
  );
}

        <div style={{ display: "flex", justifyContent: "space-between", fontFamily: "'JetBrains Mono', monospace", fontSize: 8.5, letterSpacing: ".1em", color: "rgba(253,245,236,0.3)", marginTop: 6, position: "relative" }}>

      <div className="sec-grid wide" style={{ marginTop: 14 }}>

        {/* Most-clicked socials */}

          <div className="grp-title" style={{ marginBottom: 14 }}>Most-clicked socials</div>

            <div className="eyebrow" style={{ textAlign: "center", padding: "24px 8px" }}>no views in this range yet</div>
          ) : (
            <div className="ctl-stack" style={{ gap: 11 }}>
              {a.countries.map((c) => (

                  <Flag id={(c.code || "").toLowerCase()} code={c.code} />
