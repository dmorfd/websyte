/* ═══════════════ EDITOR HEAD ═══════════════ */
/* Section header — title/subtitle left; optional status + Reset + Publish right.
   Publish saves the section's staged changes; Reset restores the last-loaded
   server state. Sections without staged editing simply omit the handlers. */
function EditorHead({ title, meta, status, onReset, onPublish, busy }) {
  const hasActions = onReset || onPublish;
  return (
    <div className={hasActions ? "sec-head" : ""} style={hasActions ? undefined : { marginBottom: 8 }}>
      <div>
        <div className="section-title">{title}</div>
        <div className="section-meta">{meta}</div>
      </div>
      {hasActions && (
        <div className="sec-head-actions">
          {status ? <span className={"save-status " + (status.kind || "")}>{status.msg}</span> : null}
          {onReset && <button className="btn" onClick={onReset} disabled={busy}>Reset</button>}
          {onPublish && <button className="btn btn-primary" onClick={onPublish} disabled={busy}>{busy ? "Publishing…" : "Publish changes"}</button>}
        </div>
      )}
    </div>
  );
}

/* ═══════════════ CONTENT EDITOR ═══════════════ */
function ContentEditor({ data, reload }) {
  const [about, setAbout] = useState(data.about?.text || "");
  const [handle, setHandle] = useState(data.handle?.name || "");
  const [bioLines, setBioLines] = useState(Array.isArray(data.bioLines) ? data.bioLines : []);
  const [interests, setInterests] = useState(data.interests || { dragons: "", cats: "", music: "", space: "" });
  const DEFAULT_INTEREST_META = { space: { name: "First interest", kanji: "一" }, dragons: { name: "Second interest", kanji: "二" }, cats: { name: "Third interest", kanji: "三" }, music: { name: "Fourth interest", kanji: "四" } };
  const [interestMeta, setInterestMeta] = useState(data.interestMeta || DEFAULT_INTEREST_META);
  const [song, setSong] = useState(data.song || {});
  const [youtube, setYoutube] = useState(data.youtube?.url || "");
  const [siteVideo, setSiteVideo] = useState(data.videoBg?.url || "");
  const [favGame, setFavGame] = useState(data.favoriteGame || { name: "", coverUrl: "", blurb: "", url: "" });
  const [socials, setSocials] = useState(Array.isArray(data.socials) ? data.socials : []);
  const [typeSpeed, setTypeSpeed] = useState(data.theme?.typeSpeed ?? 55);
  const [delSpeed, setDelSpeed] = useState(data.theme?.deleteSpeed ?? 30);
  const [holdMs, setHoldMs] = useState(data.theme?.holdTime ?? 4500);
  const [starC1, setStarC1] = useState(data.theme?.starColor1 || "#d4a84b");
  const [starC2, setStarC2] = useState(data.theme?.starColor2 || "#c0392b");

  // Re-sync all fields from the last-loaded server data. Runs when App data
  // changes (after a save+reload) — and doubles as the header "Reset" button,
  // which restores everything to how it was before local edits.
  const syncFromData = useCallback(() => {
    setAbout(data.about?.text || "");
    setHandle(data.handle?.name || "");
    setBioLines(Array.isArray(data.bioLines) ? data.bioLines : []);
    setInterests(data.interests || { dragons: "", cats: "", music: "", space: "" });
    setInterestMeta(data.interestMeta || DEFAULT_INTEREST_META);
    setSong(data.song || {});
    setYoutube(data.youtube?.url || "");
    setSiteVideo(data.videoBg?.url || "");
    setFavGame(data.favoriteGame || { name: "", coverUrl: "", blurb: "", url: "" });
    setSocials(Array.isArray(data.socials) ? data.socials : []);
    setTypeSpeed(data.theme?.typeSpeed ?? 55);
    setDelSpeed(data.theme?.deleteSpeed ?? 30);
    setHoldMs(data.theme?.holdTime ?? 4500);
    setStarC1(data.theme?.starColor1 || "#d4a84b");
    setStarC2(data.theme?.starColor2 || "#c0392b");
  }, [data]);
  useEffect(() => { syncFromData(); }, [syncFromData]);

  // Wrap reload so each save refreshes App data afterwards.
  const afterSave = () => { if (typeof reload === "function") reload(); };

  // Per-field editing is staged locally; the header's Publish button pushes
  // every group at once (see publishAll below), matching the design's
  // "changes save on publish" model — so there are no per-card save buttons.
  const setFG = (k, v) => setFavGame((p) => ({ ...p, [k]: v }));

  // ── Header Publish / Reset ──
  // Publish pushes EVERYTHING in this section in one go; Reset restores every
  // field to the last-loaded server state (i.e. how things were).
  const [pubStatus, showPub] = useSaveStatus();
  const [pubBusy, setPubBusy] = useState(false);
  const publishAll = async () => {
    setPubBusy(true);
    try {
      await apiUpdate({ type: "about", text: about });
      await apiUpdate({ type: "handle", name: handle.trim() });   // blank = public site shows the Discord name
      const bioClean = bioLines.map((l) => (l || "").trim()).filter(Boolean);
      if (bioClean.length) await apiUpdate({ type: "bio", lines: bioClean });
      await apiUpdate({ type: "interests-bulk", interests });
      await apiUpdate({ type: "interest-meta", meta: interestMeta });
      await apiUpdate({ type: "song", ...song });
      await apiUpdate({ type: "theme", starColor1: starC1, starColor2: starC2, typeSpeed, deleteSpeed: delSpeed, holdTime: holdMs });
      await apiUpdate({ type: "youtube", url: youtube });
      await apiUpdate({ type: "video-bg", url: siteVideo });
      await apiUpdate({ type: "favorite-game", name: favGame.name || "", coverUrl: favGame.coverUrl || "", blurb: favGame.blurb || "", url: favGame.url || "" });
      const cleanSoc = socials.map((s) => ({ name: (s.name || "").trim(), description: (s.description || "").trim(), iconUrl: (s.iconUrl || "").trim(), linkUrl: (s.linkUrl || "").trim() })).filter((s) => s.name && s.linkUrl);
      await apiUpdate({ type: "socials", socials: cleanSoc });
      showPub("published ✓"); afterSave();
    } catch (e) { showPub(e.message, "err"); }
    setPubBusy(false);
  };
  const resetAll = () => { syncFromData(); showPub("changes reset"); };

  return (
    <div className="sec-page">
      <EditorHead title="Content Editor" meta="Everything the public site renders. Changes save on publish." status={pubStatus} onReset={resetAll} onPublish={publishAll} busy={pubBusy} />

      <div className="sec-grid">

        {/* A · IDENTITY */}
        <div className="glass span-all">
          <div className="grp-head"><span className="grp-letter">A</span><span className="grp-title">Identity</span></div>
          <div className="fld-grid" style={{ marginBottom: 12 }}>
            <div>
              <div className="lbl">Display handle</div>
              <input className="input" value={handle} onChange={(e) => setHandle(e.target.value)} maxLength={50} placeholder="blank = your Discord name" />
            </div>
          </div>
          <div className="lbl-row"><span className="lbl" style={{ margin: 0 }}>About me</span><span className="lbl-count">{about.length} / 1500</span></div>
          <textarea className="textarea" rows={4} maxLength={1500} value={about} onChange={(e) => setAbout(e.target.value)} />
        </div>

        {/* B · TYPEWRITER BIO LINES */}
        <div className="glass">
          <div className="grp-head"><span className="grp-letter">B</span><span className="grp-title">Typewriter bio lines</span></div>
          <div className="row-list">
            {bioLines.map((line, i) => (
              <div key={i} className="rep-row">
                <span className="rep-grip">⠿</span>
                <input className="input" value={line} maxLength={200} onChange={(e) => setBioLines(bioLines.map((l, idx) => idx === i ? e.target.value : l))} placeholder={"line " + (i + 1)} />
                <button className="rep-x" onClick={() => setBioLines(bioLines.filter((_, idx) => idx !== i))} title="remove">✕</button>
              </div>
            ))}
          </div>
          <button className="add-row" onClick={() => bioLines.length < 10 && setBioLines([...bioLines, ""])} disabled={bioLines.length >= 10}>+ Add line</button>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--line)" }}>
            <div className="grp-title" style={{ marginBottom: 10 }}>Typewriter speeds</div>
            <div className="ctl-stack">
              <div>
                <div className="sld-head"><span>Type speed</span><span className="sld-val">{typeSpeed} ms</span></div>
                <input className="slider" type="range" min="10" max="200" step="5" value={typeSpeed} onChange={(e) => setTypeSpeed(+e.target.value)} />
              </div>
              <div>
                <div className="sld-head"><span>Delete speed</span><span className="sld-val">{delSpeed} ms</span></div>
                <input className="slider" type="range" min="10" max="200" step="5" value={delSpeed} onChange={(e) => setDelSpeed(+e.target.value)} />
              </div>
              <div>
                <div className="sld-head"><span>Hold delay</span><span className="sld-val">{holdMs} ms</span></div>
                <input className="slider" type="range" min="500" max="15000" step="100" value={holdMs} onChange={(e) => setHoldMs(+e.target.value)} />
              </div>
            </div>
          </div>
        </div>

        {/* C · INTERESTS */}
        <div className="glass">
          <div className="grp-head"><span className="grp-letter">C</span><span className="grp-title">Interests</span></div>
          <div className="row-list">
            {/* Same order as the public site. The keys are just storage slots. */}

                  <div className="rep-row" style={{ marginBottom: 6 }}>

                    <input className="input" value={m.name || ""} onChange={(e) => setMeta("name", e.target.value)} maxLength={40} placeholder={fallback} aria-label={fallback + " name"} />
                    <input className="input" style={{ width: 74, flex: "0 0 auto" }} value={m.kanji || ""} onChange={(e) => setMeta("kanji", e.target.value)} maxLength={12} placeholder="漢字" aria-label={fallback + " kanji"} />
                  </div>
                  <textarea className="textarea" style={{ minHeight: 58 }} value={interests[k] || ""} onChange={(e) => setInterests({ ...interests, [k]: e.target.value })} maxLength={600} placeholder={"what " + (m.name || fallback).toLowerCase() + " means to you…"} />
                  <div className="lbl-count" style={{ textAlign: "right" }}>{(interests[k] || "").length} / 600</div>
                </div>

          </div>
          <div style={{ marginTop: 16, paddingTop: 14, borderTop: "1px solid var(--line)" }}>
            <div className="grp-title" style={{ marginBottom: 10 }}>Star colors</div>

/* ═══════════════ UI EDITOR ═══════════════ */
function UIEditor({ data, reload }) {
  const t = data.theme || {};
  const identity = useSiteIdentity();
  const [uiStyle, setUiStyle] = useState(t.uiStyle || "sakura");
  const [favC1, setFavC1] = useState(t.favGameColor1 || "#f0c96a");
  const [favC2, setFavC2] = useState(t.favGameColor2 || "#c0392b");
  const [favGrad, setFavGrad] = useState(t.favGameGradient !== false);
  const [favAnim, setFavAnim] = useState(t.favGameAnimate !== false);
  const SECTION_LABELS = { discord: "Discord Profile", about: "About Me", interests: "Interests", favgame: "Favorite Game", watch: "Watch", socials: "Find Me Here" };
  const DEFAULT_SECTIONS = ["discord", "about", "interests", "favgame", "watch", "socials"].map((id) => ({ id, enabled: true }));
  // Drop ids for sections that no longer exist (e.g. from an older saved order).
  const knownSections = (list) => (Array.isArray(list) ? list.filter((s) => s && SECTION_LABELS[s.id]) : []);
  const [sections, setSections] = useState(knownSections(data.sections).length ? knownSections(data.sections) : DEFAULT_SECTIONS);
  const [secStatus, showSecStatus] = useSaveStatus();
  useEffect(() => {
    if (knownSections(data.sections).length) setSections(knownSections(data.sections));
  }, [data.sections]);
  // Drag-to-reorder, FLIP-style: the array does NOT reorder during the drag.
  // Instead the grabbed row follows the cursor via transform while the other
  // rows animate out of the way; the reorder commits once on release. Window
  // listeners (not pointer capture) drive it, because reordering DOM nodes
  // releases pointer capture — the bug that made the old version move only
  // one slot at a time.
  const [drag, setDrag] = useState(null);   // {id, from, target, dy, rowH}
  const dragRef = useRef(null);
  const sectionListRef = useRef(null);
  const onGripDown = (e, id, index) => {
    e.preventDefault();
    const list = sectionListRef.current;
    if (!list) return;
    const rowEl = list.children[index];
    const rowH = rowEl ? rowEl.offsetHeight : 44;
    const count = sections.length;
    const start = { id, from: index, target: index, dy: 0, rowH, startY: e.clientY, count };
    dragRef.current = start;
    setDrag(start);
    const onMove = (ev) => {
      const d = dragRef.current;
      if (!d) return;
      const dy = ev.clientY - d.startY;
      let target = d.from + Math.round(dy / d.rowH);
      target = Math.min(d.count - 1, Math.max(0, target));
      const next = { ...d, dy, target };
      dragRef.current = next;
      setDrag(next);
    };
    const onUp = () => {
      window.removeEventListener("pointermove", onMove);
      window.removeEventListener("pointerup", onUp);
      window.removeEventListener("pointercancel", onUp);
      const d = dragRef.current;
      dragRef.current = null;
      setDrag(null);
      if (d && d.target !== d.from) {
        setSections((prev) => {
          const next = prev.slice();
          const [item] = next.splice(d.from, 1);
          next.splice(d.target, 0, item);
          return next;
        });
      }
    };
    window.addEventListener("pointermove", onMove);
    window.addEventListener("pointerup", onUp);
    window.addEventListener("pointercancel", onUp);
  };
  // Per-row transform while a drag is live: the grabbed row tracks the cursor;
  // rows between the origin and the hovered slot slide one row-height aside.
  const dragRowStyle = (i, id) => {
    if (!drag) return {};
    if (id === drag.id) {
      return {
        transform: `translateY(${drag.dy}px) scale(1.012)`,
        zIndex: 5, position: "relative",
        transition: "none",
        background: "rgba(230,74,82,0.12)",
        boxShadow: "0 8px 24px -8px rgba(0,0,0,0.6), inset 0 0 0 1px rgba(230,74,82,0.4)",
      };
    }
    let shift = 0;
    if (drag.from < drag.target && i > drag.from && i <= drag.target) shift = -drag.rowH;
    else if (drag.from > drag.target && i >= drag.target && i < drag.from) shift = drag.rowH;
    return { transform: `translateY(${shift}px)`, transition: "transform .18s cubic-bezier(.2,.8,.2,1)" };
  };
  const toggleSection = (i) => setSections((prev) => prev.map((s, k) => (k === i ? { ...s, enabled: s.enabled === false } : s)));
  const saveSections = async () => {
    try {
      await apiUpdate({ type: "sections", sections });
      showSecStatus("saved ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showSecStatus(e.message || "save failed", "err"); }
  };
  const [effect, setEffect] = useState(t.effect || "sakura");
  const [viewsLoc, setViewsLoc] = useState(t.viewsLocation || "hud");
  const [uiBlur, setUiBlur] = useState(typeof t.uiBlur === "number" ? t.uiBlur : -1);
  const [heroBlur, setHeroBlur] = useState(typeof t.heroBlur === "number" ? t.heroBlur : -1);
  const [glow, setGlow] = useState(typeof t.uiGlow === "number" ? t.uiGlow : 0);
  const [glowColor, setGlowColor] = useState(t.glowColor || "");
  const [siteAccent, setSiteAccent] = useState(safeHex(t.siteAccent, "#e7a6e0"));
  const [bg1, setBg1] = useState(safeHex(t.bgColor1, "#3d0a14"));

  // Header Reset — restore every field to the last-loaded server theme (how

    setBgStarColor(safeHex(tt.bgStarColor, "#b98cff"));
    setSections(knownSections(data.sections).length ? knownSections(data.sections) : DEFAULT_SECTIONS);
    showStatus("changes reset");

  // Header Publish — theme + section order in one go.

    await save();

                    backgroundImage: `linear-gradient(90deg, ${c1} 0%, ${c2} 50%, ${c1} 100%)`,
                    backgroundSize: "200% 100%",
                    WebkitBackgroundClip: "text", backgroundClip: "text",
                    color: "transparent", WebkitTextFillColor: "transparent",
                    animation: favAnim ? "favNameFlow 5s linear infinite" : "none",
                  } : { color: c1 }),
                }}>{(data.favoriteGame && data.favoriteGame.name) || "Favorite game"}</span>
              );
            })()}

                <input type="color" value={/^#[0-9a-fA-F]{6}$/.test(favC2) ? favC2 : "#c0392b"} onChange={(e) => setFavC2(e.target.value)} className="swatch" style={{ width: 26, height: 26 }} />

            </div>
            <div className="ctl-row" style={{ opacity: favGrad ? 1 : 0.45 }}>

              <div className={"switch " + (favAnim && favGrad ? "on" : "")} onClick={() => favGrad && setFavAnim(!favAnim)} role="switch" aria-checked={favAnim && favGrad}><div className="knob" /></div>
            </div>
          </div>
        </div>

      {/* SECTIONS */}
      <div className="glass">
          <div className="grp-head" style={{ justifyContent: "space-between" }}>
            <span className="grp-title">Sections · show, hide &amp; reorder</span>
            <span className={"save-status " + secStatus.kind}>{secStatus.msg}</span>

                borderBottom: i < sections.length - 1 ? "1px solid var(--line)" : "none",
                opacity: s.enabled === false && (!drag || drag.id !== s.id) ? 0.5 : 1,
                ...dragRowStyle(i, s.id),

                <div
                  onPointerDown={(e) => onGripDown(e, s.id, i)}

                >
                  <span style={{ width: 12, height: 1.5, borderRadius: 2, background: "var(--ink-3)", display: "block" }} />
                  <span style={{ width: 12, height: 1.5, borderRadius: 2, background: "var(--ink-3)", display: "block" }} />
                  <span style={{ width: 12, height: 1.5, borderRadius: 2, background: "var(--ink-3)", display: "block" }} />

  );
}

/* ═══════════════ BANNER CROPPER (Discord-style) ═══════════════ */
// Paste an R2 image/GIF URL, then drag to reposition + zoom. Saves
// {url, scale, posX, posY}; the public site applies them via CSS
// (object-position + transform:scale) so GIFs keep animating.
function BannerCropper({ data, reload }) {
  const b = data.discordBanner || {};
  const [url, setUrl] = useState(b.url || "");
  // Committed (saved) transform — what shows in the inline preview + on the site.
  const [tf, setTf] = useState(() => readTf(b));
  const [status, showStatus] = useSaveStatus();
  const [editing, setEditing] = useState(false);
  const [autoSync, setAutoSync] = useState(b.autoSync !== false);
  const [bgMode, setBgMode] = useState(b.bgMode === "custom" ? "custom" : "discord");
  const [bgColor, setBgColor] = useState(b.bgColor || "#5865F2");

  function readTf(src) {
    const s = src || {};
    let offX = (typeof s.offsetX === "number") ? s.offsetX : (typeof s.posX === "number") ? (50 - s.posX) / 100 : 0;
    let offY = (typeof s.offsetY === "number") ? s.offsetY : (typeof s.posY === "number") ? (50 - s.posY) / 100 : 0;
    return {
      scale: typeof s.scale === "number" ? s.scale : 1,
      offsetX: offX, offsetY: offY,
      rotation: typeof s.rotation === "number" ? s.rotation : 0,
    };
  }

  // Re-sync from App data after save+reload (stale-data fix).
  useEffect(() => {
    const bb = data.discordBanner || {};
    setUrl(bb.url || "");
    setTf(readTf(bb));
    setAutoSync(bb.autoSync !== false);
    setBgMode(bb.bgMode === "custom" ? "custom" : "discord");
    setBgColor(bb.bgColor || "#5865F2");
  }, [data.discordBanner]);

  const toggleAuto = async () => {
    const next = !autoSync;
    setAutoSync(next);
    try {
      await apiUpdate({ type: "discord-banner", url: (url || "").trim(), autoSync: next });
      showStatus(next ? "auto-sync on ✓" : "auto-sync off ✓");
      if (typeof reload === "function") reload();
    } catch (e) { setAutoSync(!next); showStatus(e.message || "save failed", "err"); }
  };

  // Empty-banner gradient source: Discord accent colour vs a custom colour.
  const saveBg = async (mode, color) => {
    setBgMode(mode); setBgColor(color);
    try {
      await apiUpdate({ type: "discord-banner", url: (url || "").trim(), bgMode: mode, bgColor: color });
      showStatus("saved ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message || "save failed", "err"); }
  };

  const persist = async (nextUrl, nextTf) => {
    try {
      await apiUpdate({
        type: "discord-banner",
        url: (nextUrl || "").trim(),
        scale: +nextTf.scale,
        offsetX: +nextTf.offsetX.toFixed(4),
        offsetY: +nextTf.offsetY.toFixed(4),
        rotation: Math.round(nextTf.rotation),
      });
      showStatus("saved ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message || "save failed", "err"); }
  };

  const onApply = (newTf) => { setTf(newTf); setEditing(false); persist(url, newTf); };
  const clearBanner = async () => {
    const reset = { scale: 1, offsetX: 0, offsetY: 0, rotation: 0 };
    setUrl(""); setTf(reset);
    try {
      await apiUpdate({ type: "discord-banner", url: "", scale: 1, offsetX: 0, offsetY: 0, rotation: 0 });
      showStatus("cleared ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message || "save failed", "err"); }
  };

  const previewTransform =
    "translate(" + (tf.offsetX * 100).toFixed(2) + "%, " + (tf.offsetY * 100).toFixed(2) + "%) " +
    "rotate(" + tf.rotation + "deg) scale(" + tf.scale + ")";

  return (
    <>
      <div className="glass" style={{ marginBottom: 14 }}>
        <div className="grp-title">· Profile banner</div>
        <div className="field-sub" style={{ marginTop: 3, marginBottom: 14 }}>5:1 · mirrors the site's profile card</div>
        <div className="ctl-stack">
          <div className="ctl-row">
            <div>
              <div style={{ fontSize: 12, fontWeight: 500 }}>Auto-sync from Discord</div>
              <div className="field-sub" style={{ marginTop: 2 }}>mirrors your live Discord banner · needs the bot token</div>
            </div>
            <div className={"switch " + (autoSync ? "on" : "")} onClick={toggleAuto} role="switch" aria-checked={autoSync}><div className="knob" /></div>
          </div>
          <div className="ctl-row" style={{ flexWrap: "wrap" }}>
            <div>
              <div style={{ fontSize: 12, fontWeight: 500 }}>Empty-banner colour</div>
              <div className="field-sub" style={{ marginTop: 2 }}>gradient shown when no image is set</div>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
              <div className="segmented">
                <button className={bgMode === "discord" ? "active" : ""} onClick={() => saveBg("discord", bgColor)}>Discord accent</button>
                <button className={bgMode === "custom" ? "active" : ""} onClick={() => saveBg("custom", bgColor)}>Custom colour</button>
              </div>
              {bgMode === "custom" && (
                <div className="color-row" style={{ flex: "0 0 auto" }}>
                  <input type="color" value={bgColor} onChange={(e) => setBgColor(e.target.value)} onBlur={() => saveBg("custom", bgColor)} className="swatch" aria-label="Custom banner colour" />
                  <span style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 10, color: "rgba(253,245,236,0.6)" }}>{(bgColor || "").toUpperCase()}</span>
                </div>
              )}
            </div>
          </div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", marginTop: 10 }}>
          <span className={"save-status " + status.kind}>{status.msg}</span>
        </div>
      </div>

    </>
  );
}

/* Discord-style modal cropper: smooth pixel-drag pan, zoom + rotate sliders.
   Stores pan as a fraction of the box so the result matches the site exactly,
   independent of the modal's on-screen size. */
function BannerCropModal({ url, initial, onCancel, onApply }) {
  const [scale, setScale] = useState(initial.scale);
  const [rotation, setRotation] = useState(initial.rotation);
  // Pan is tracked in fractions of box size (matches storage + site).
  const [offX, setOffX] = useState(initial.offsetX);
  const [offY, setOffY] = useState(initial.offsetY);
  const boxRef = useRef(null);
  const drag = useRef(null);

  // Smooth 1:1 pixel drag → convert delta to box fractions on the fly.
  const onDown = (e) => {
    const box = boxRef.current; if (!box) return;
    box.setPointerCapture?.(e.pointerId);
    drag.current = { x: e.clientX, y: e.clientY, ox: offX, oy: offY, w: box.clientWidth, h: box.clientHeight };
  };
  const onMove = (e) => {
    const d = drag.current; if (!d) return;
    setOffX(d.ox + (e.clientX - d.x) / d.w);
    setOffY(d.oy + (e.clientY - d.y) / d.h);
  };
  const onUp = (e) => { drag.current = null; boxRef.current?.releasePointerCapture?.(e.pointerId); };

  const rotate90 = (dir) => setRotation((r) => {
    let n = r + dir * 90;
    if (n > 180) n -= 360; if (n < -180) n += 360;
    return n;
  });
  const reset = () => { setScale(1); setRotation(0); setOffX(0); setOffY(0); };

  const transform =
    "translate(" + (offX * 100).toFixed(2) + "%, " + (offY * 100).toFixed(2) + "%) " +
    "rotate(" + rotation + "deg) scale(" + scale + ")";

  // Close on Escape
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onCancel(); };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onCancel]);

  return ReactDOM.createPortal(
    <div className="bnrmodal-scrim" onClick={onCancel}>
      <div className="bnrmodal" onClick={(e) => e.stopPropagation()}>
        <div className="bnrmodal-head">
          <div className="bnrmodal-title">Edit Banner</div>
          <button className="icon-btn" onClick={onCancel} title="Cancel"><Ico.x /></button>
        </div>

        <div
          ref={boxRef}
          className={"bnrmodal-stage " + (drag.current ? "grabbing" : "")}
          onPointerDown={onDown}
          onPointerMove={onMove}
          onPointerUp={onUp}
          onPointerCancel={onUp}
        >
          <img src={url} alt="" draggable={false} style={{ transformOrigin: "center center", transform }} />
          {/* frame guide showing the visible banner area */}
          <div className="bnrmodal-guide" />
          <div className="bnrmodal-hint">drag to move</div>
        </div>

        <div className="bnrmodal-controls">
          <div className="bnrmodal-ctl">
            <span className="bnrmodal-ctl-l">Zoom <em>{scale.toFixed(2)}×</em></span>
            <input className="slider" type="range" min="1" max="5" step="0.01" value={scale} onChange={(e) => setScale(+e.target.value)} />
          </div>
          <div className="bnrmodal-rotbtns">
            <span className="bnrmodal-ctl-l" style={{ flex: "none" }}>Rotate <em>{rotation}°</em></span>
            <button className="btn btn-tiny" onClick={() => rotate90(-1)} title="Rotate left 90°">⟲ 90°</button>
            <button className="btn btn-tiny" onClick={() => rotate90(1)} title="Rotate right 90°">⟳ 90°</button>
            <button className="btn btn-tiny" onClick={reset} style={{ marginLeft: "auto" }}>Reset</button>
          </div>
        </div>

        <div className="bnrmodal-foot">
          <button className="btn" onClick={onCancel}>cancel</button>
          <button className="btn btn-primary" onClick={() => onApply({ scale, rotation, offsetX: offX, offsetY: offY })}>apply</button>
        </div>
      </div>
    </div>,
    document.body
  );
}

function DiscordBadges({ data, reload }) {
  const [badges, setBadges] = useState(Array.isArray(data.customBadges) ? data.customBadges : []);
  const gt = data.guildTag || { enabled: false, text: "", iconUrl: "" };
  const [tagEnabled, setTagEnabled] = useState(gt.enabled === true);
  const [tagText, setTagText] = useState(gt.text || "");
  const [tagIcon, setTagIcon] = useState(gt.iconUrl || "");
  const [badgeStatus, showBadgeStatus] = useSaveStatus();
  const [tagStatus, showTagStatus] = useSaveStatus();

  // Re-sync from App data after save+reload — fixes the stale-data revert bug.
  useEffect(() => {
    setBadges(Array.isArray(data.customBadges) ? data.customBadges : []);
    const g = data.guildTag || { enabled: false, text: "", iconUrl: "" };
    setTagEnabled(g.enabled === true);
    setTagText(g.text || "");
    setTagIcon(g.iconUrl || "");
  }, [data.customBadges, data.guildTag]);

  const saveBadges = async () => {
    const clean = badges.map((b) => ({ name: (b.name || "").trim(), imageUrl: (b.imageUrl || "").trim() })).filter((b) => b.imageUrl);
    try {
      await apiUpdate({ type: "custom-badges", badges: clean });
      showBadgeStatus("saved ✓"); setBadges(clean);
      if (typeof reload === "function") reload();
    } catch (e) { showBadgeStatus(e.message, "err"); }
  };

  const saveTag = async () => {
    const t = tagText.trim();
    if (t.length > 8) { showTagStatus("tag text too long (max 8)", "err"); return; }
    try {
      await apiUpdate({ type: "guild-tag", enabled: tagEnabled, text: t, iconUrl: tagIcon.trim() });
      showTagStatus("saved ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showTagStatus(e.message, "err"); }
  };

  // Header Publish / Reset — tag + badges together; banner saves live as before.
  const [pubStatus, showPubStatus] = useSaveStatus();
  const publishAll = async () => {
    const t = tagText.trim();
    if (t.length > 8) { showPubStatus("tag text too long (max 8)", "err"); return; }
    try {
      await apiUpdate({ type: "guild-tag", enabled: tagEnabled, text: t, iconUrl: tagIcon.trim() });
      const clean = badges.map((b) => ({ name: (b.name || "").trim(), imageUrl: (b.imageUrl || "").trim() })).filter((b) => b.imageUrl);
      await apiUpdate({ type: "custom-badges", badges: clean });
      setBadges(clean);
      showPubStatus("published ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showPubStatus(e.message, "err"); }
  };
  const resetAll = () => {
    setBadges(Array.isArray(data.customBadges) ? data.customBadges : []);
    const g = data.guildTag || { enabled: false, text: "", iconUrl: "" };
    setTagEnabled(g.enabled === true); setTagText(g.text || ""); setTagIcon(g.iconUrl || "");
    showPubStatus("changes reset");
  };

  return (
    <div className="sec-page">
      <EditorHead title="Discord Badges" meta={"custom badges & guild tag · " + badges.length + "/10"} status={pubStatus} onReset={resetAll} onPublish={publishAll} />

      <div className="field" style={{ marginTop: 14, marginBottom: 14 }}>
        <div className="field-row">
          <div>
            <div className="eyebrow">· Guild tag</div>
            <div className="field-sub" style={{ marginTop: 3 }}>display the guild tag pill beside your username — the tag itself auto-syncs from Discord</div>
          </div>
          <div className={"switch " + (tagEnabled ? "on" : "")} onClick={() => setTagEnabled(!tagEnabled)} role="switch" aria-checked={tagEnabled}><div className="knob" /></div>
        </div>
        <div style={{ display: "flex", justifyContent: "flex-end", alignItems: "center", gap: 10 }}>
          <span className={"save-status " + tagStatus.kind}>{tagStatus.msg}</span>
          <button className="btn btn-tiny" onClick={saveTag}>Save</button>
        </div>
      </div>

      <BannerCropper data={data} reload={reload} />

      <div className="glass">
        <div className="grp-head" style={{ justifyContent: "space-between" }}>
          <span className="grp-title">· Custom badges</span>
          <span className={"save-status " + badgeStatus.kind}>{badgeStatus.msg}</span>
        </div>
        <div className="field-sub" style={{ marginBottom: 14 }}>
          upload PNG/WebP badge art to R2 and paste the URLs — nitro, server booster, etc. Lanyard doesn't expose these.
        </div>
        <div className="row-list">
          {badges.map((b, i) => (
            <div key={i} className="rep-row" style={{ flexWrap: "wrap" }}>
              <div style={{
                width: 34, height: 34, borderRadius: 8, flex: "0 0 auto",
                border: b.imageUrl ? "1px solid rgba(255,255,255,0.1)" : "1px dashed rgba(255,255,255,0.18)",
                backgroundColor: "rgba(255,255,255,0.03)",
                backgroundImage: b.imageUrl ? `url('${b.imageUrl}')` : "none",
                backgroundSize: "contain", backgroundPosition: "center", backgroundRepeat: "no-repeat",

              <input className="input" style={{ flex: "1 1 110px", minWidth: 100 }} placeholder="Badge title / hover text" value={b.name || ""} onChange={(e) => setBadges(badges.map((x, idx) => idx === i ? { ...x, name: e.target.value } : x))} maxLength={50} />
              <input className="input" style={{ flex: "1.6 1 140px", minWidth: 130, fontFamily: "'JetBrains Mono', monospace", fontSize: 11 }} placeholder="https://r2…/badge.webp" value={b.imageUrl || ""} onChange={(e) => setBadges(badges.map((x, idx) => idx === i ? { ...x, imageUrl: e.target.value } : x))} />
              <button className="rep-x" onClick={() => setBadges(badges.filter((_, idx) => idx !== i))} title="remove">✕</button>
            </div>
          ))}
        </div>
        <button className="add-row" onClick={() => badges.length < 10 && setBadges([...badges, { name: "", imageUrl: "" }])} disabled={badges.length >= 10}>+ Add badge · {badges.length}/10</button>
      </div>
    </div>
  );
}

/* ═══════════════ PRESETS ═══════════════ */
// Named snapshots of the public site's look: theme (UI Editor), background
// video, and song. Clicking a preset writes its values into the live blobs.
function Presets({ data, reload }) {
  const [presets, setPresets] = useState(Array.isArray(data.presets) ? data.presets : []);
  const [creating, setCreating] = useState(false);
  const [newName, setNewName] = useState("");
  const [status, showStatus] = useSaveStatus();
  const [busyId, setBusyId] = useState(null);

  // Keep local presets in sync with the App-level data. Without this, leaving
  // and re-entering the section remounts the component, which would re-read a
  // stale data.presets (the bug where saved presets "disappeared").
  useEffect(() => {
    setPresets(Array.isArray(data.presets) ? data.presets : []);
  }, [data.presets]);

  // POST to the presets endpoint. Returns the parsed JSON or throws.
  const callPresets = async (payload) => {
    const res = await fetch("/.netlify/functions/presets", {
      method: "POST",
      headers: { "Content-Type": "application/json", "X-Admin-Key": getAdminKey() },
      body: JSON.stringify(payload),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || ("HTTP " + res.status));
    return json;
  };

  // Capture the CURRENT live settings into a new preset.
  // IMPORTANT: we fetch fresh data from the server here rather than trusting
  // the `data` prop. The prop can be stale — e.g. you edited the song in
  // Content Editor and saved it, but the App-level data wasn't refreshed yet.
  // Snapshotting the prop would capture the OLD song.
  const createPreset = async () => {
    const name = newName.trim();
    if (!name) { showStatus("name required", "err"); return; }
    setBusyId("__new");
    try {
      const fresh = await apiGet();
      const json = await callPresets({
        action: "save",
        preset: {
          name,
          theme:   fresh.theme   || {},
          videoBg: fresh.videoBg || {},
          song:    fresh.song    || {},
          enterScreen: fresh.enterScreen || {},
        },
      });
      setPresets(json.presets || []);
      setCreating(false);
      setNewName("");
      showStatus("preset saved ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
    setBusyId(null);
  };

  // Apply a preset → writes its snapshot into the live theme/video-bg/song.
  const applyPreset = async (id) => {
    setBusyId(id);
    try {
      await callPresets({ action: "apply", id });
      showStatus("preset applied ✓ — site updated");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
    setBusyId(null);
  };

  // Re-snapshot an existing preset with the current live settings.
  // Like createPreset, fetches fresh server data so a just-saved song/theme
  // is captured correctly (the `data` prop may be stale).
  const updatePreset = async (p) => {
    if (!confirm(`Overwrite "${p.name}" with your current live settings?`)) return;
    setBusyId(p.id);
    try {
      const fresh = await apiGet();
      const json = await callPresets({
        action: "save",
        preset: { id: p.id, name: p.name, theme: fresh.theme || {}, videoBg: fresh.videoBg || {}, song: fresh.song || {}, enterScreen: fresh.enterScreen || {} },
      });
      setPresets(json.presets || []);
      showStatus("preset updated ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
    setBusyId(null);
  };

  const deletePreset = async (p) => {
    if (!confirm(`Delete preset "${p.name}"? This can't be undone.`)) return;
    setBusyId(p.id);
    try {
      const json = await callPresets({ action: "delete", id: p.id });
      setPresets(json.presets || []);
      showStatus("preset deleted");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
    setBusyId(null);
  };

  const renamePreset = async (p) => {
    const name = prompt("Rename preset:", p.name);
    if (name === null) return;
    if (!name.trim()) { showStatus("name can't be empty", "err"); return; }
    setBusyId(p.id);
    try {
      const json = await callPresets({ action: "rename", id: p.id, name: name.trim() });
      setPresets(json.presets || []);
      showStatus("renamed ✓");
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
    setBusyId(null);
  };

  // Build a little gradient swatch from a preset's stored theme colors
  const swatchStyle = (p) => {
    const t = p.theme || {};
    const c1 = t.bgColor1 || "#2a1a2e";
    const c2 = t.bgColor2 || "#0a0608";
    return { background: `linear-gradient(135deg, ${c1}, ${c2})` };
  };

  return (
    <section className="sec-page">
      <div className="sec-head">
        <div>
          <div className="section-title">Presets</div>
          <div className="label-sub" style={{ marginTop: 4 }}>· background · style · effects · video · song</div>
        </div>
        <div className="sec-head-actions">
          <span className={"save-status " + status.kind}>{status.msg}</span>
          <button className="btn btn-primary" onClick={() => setCreating(true)}>＋ Create new preset</button>
        </div>
      </div>

      {/* New preset inline form */}
      {creating && (
        <div className="glass" style={{ marginBottom: 16 }}>
          <div className="field-title" style={{ marginBottom: 8 }}>New preset from current live settings</div>
          <div className="field-sub" style={{ marginBottom: 10 }}>
            captures your site's current UI theme, background video, and song as a named snapshot
          </div>
          <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
            <input
              className="input"
              style={{ flex: 1, minWidth: 200 }}
              placeholder="preset name (e.g. Midnight Blue)"
              value={newName}
              maxLength={40}
              autoFocus
              onChange={(e) => setNewName(e.target.value)}
              onKeyDown={(e) => { if (e.key === "Enter") createPreset(); }}
            />
            <button className="btn btn-primary btn-tiny" onClick={createPreset} disabled={busyId === "__new"}>
              {busyId === "__new" ? "saving…" : "save"}
            </button>
            <button className="btn btn-tiny" onClick={() => { setCreating(false); setNewName(""); }}>cancel</button>
          </div>
        </div>
      )}

      {/* Preset grid */}
      {presets.length === 0 ? (
        <div style={{ padding: "60px 20px", textAlign: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 9.5, letterSpacing: ".16em", textTransform: "uppercase", color: "rgba(253,245,236,0.35)", border: "1px dashed rgba(255,255,255,0.1)", borderRadius: 14, lineHeight: 1.8 }}>
          no presets yet — click “＋ create new preset” to snapshot your current look
        </div>
      ) : (
        <div className="preset-grid">
          {presets.map((p) => (
            <div key={p.id} className="preset-card">
              <div className="preset-swatch" style={swatchStyle(p)}>
                <div className="preset-swatch-meta">
                  <span style={{ overflow: "hidden", textOverflow: "ellipsis" }}>{p.song && p.song.title ? "♪ " + p.song.title + (p.song.artist ? " — " + p.song.artist : "") : "no song"}</span>
                  <span style={{ opacity: .65 }}>{p.videoBg && p.videoBg.url ? "· video bg" : "· static bg"}</span>
                </div>
              </div>
              <div className="preset-card-body">
                <div className="preset-name" title={p.name}>{p.name}</div>
                <div className="preset-actions">
                  <button className="btn btn-primary btn-tiny preset-apply" onClick={() => applyPreset(p.id)} disabled={busyId === p.id}>
                    {busyId === p.id ? "Applying…" : "Apply preset"}
                  </button>
                  <button className="btn btn-tiny" onClick={() => updatePreset(p)} disabled={busyId === p.id} title="Overwrite with current settings">Update</button>
                  <button className="btn btn-tiny" onClick={() => renamePreset(p)} disabled={busyId === p.id}>Rename</button>
                  <button className="btn btn-tiny btn-danger" style={{ gridColumn: "1 / -1" }} onClick={() => deletePreset(p)} disabled={busyId === p.id}>Delete preset</button>
                </div>
              </div>
            </div>
          ))}
        </div>
      )}
    </section>
  );
}

/* ═══════════════ ENTER SCREEN ═══════════════ */
function EnterScreen({ data, reload }) {
  const es = data.enterScreen || {};
  const [enabled, setEnabled] = useState(es.enabled !== false);
  // Which intro the site uses. 'classic' = the original gradient
  // click-to-enter; 'modern' = the cinematic loading screen.
  const [style, setStyle] = useState(es.style === "modern" ? "modern" : "classic");
  const [text, setText] = useState(es.text || "click to enter");
  const [c1, setC1] = useState(safeHex(es.gradColor1, "#3c0a1e"));
  const [c2, setC2] = useState(safeHex(es.gradColor2, "#000000"));
  const [angle, setAngle] = useState(typeof es.gradAngle === "number" ? es.gradAngle : 135);
  const [accent, setAccent] = useState(safeHex(es.loaderAccent, "#a97bff"));
  // Cinematic loader only: the "Welcome" wordmark's typeface...
  const [ldFont, setLdFont] = useState(es.loaderFont || "");
  const [ldFontUrl, setLdFontUrl] = useState(es.loaderFontUrl || "");
  // ...and its ambient loop.
  const [sfxOn, setSfxOn] = useState(es.sfxEnabled === true);
  const [sfxVol, setSfxVol] = useState(typeof es.sfxVolume === "number" ? es.sfxVolume : 60);
  const [sfxAmb, setSfxAmb] = useState(es.sfxAmbientUrl || "");
  const [status, showStatus] = useSaveStatus();
  const modern = style === "modern";

  // Audition a cue without leaving the panel.
  const previewSound = (url) => {
    if (!url || !/^https?:\/\//i.test(url)) { showStatus("add a valid https URL first", "err"); return; }
    try {
      const a = new Audio(url);
      a.volume = Math.max(0, Math.min(1, sfxVol / 100));
      a.play().catch(() => showStatus("couldn't play — check the URL / CORS", "err"));
    } catch (e) { showStatus("couldn't play that URL", "err"); }
  };

  // Re-sync local fields whenever the App-level data changes (e.g. after a
  // reload following a save). Without this, leaving + re-entering the section
  // remounts the component and reads stale data — the bug where the enter
  // text reverted to the purple default.
  useEffect(() => {
    const e = data.enterScreen || {};
    setEnabled(e.enabled !== false);
    setText(e.text || "click to enter");
    setC1(safeHex(e.gradColor1, "#3c0a1e"));
    setC2(safeHex(e.gradColor2, "#000000"));
    setAngle(typeof e.gradAngle === "number" ? e.gradAngle : 135);
    setStyle(e.style === "modern" ? "modern" : "classic");
    setAccent(safeHex(e.loaderAccent, "#a97bff"));
    setLdFont(e.loaderFont || "");
    setLdFontUrl(e.loaderFontUrl || "");
    setSfxOn(e.sfxEnabled === true);
    setSfxVol(typeof e.sfxVolume === "number" ? e.sfxVolume : 60);
    setSfxAmb(e.sfxAmbientUrl || "");
  }, [data.enterScreen]);

  const save = async () => {
    if (!text.trim()) { showStatus("text cannot be empty", "err"); return; }
    if (text.length > 100) { showStatus("text too long (max 100)", "err"); return; }
    if (!isHex(c1) || !isHex(c2)) { showStatus("invalid gradient color hex", "err"); return; }
    if (!isHex(accent)) { showStatus("invalid loader accent hex", "err"); return; }
    if (ldFont.trim() && !/^[A-Za-z0-9 \-_]+$/.test(ldFont.trim())) { showStatus("font name: letters, numbers, spaces, - and _ only", "err"); return; }
    try {
      await apiUpdate({
        type: "enter-screen", enabled, style, loaderAccent: accent,
        text: text.trim(), gradColor1: c1, gradColor2: c2, gradAngle: angle,
        loaderFont: ldFont.trim(), loaderFontUrl: ldFontUrl.trim(),
        sfxEnabled: sfxOn, sfxVolume: sfxVol,
        sfxAmbientUrl: sfxAmb.trim(),
      });
      showStatus("saved ✓");
      // Refresh App data so leaving + re-entering keeps the saved values
      if (typeof reload === "function") reload();
    } catch (e) { showStatus(e.message, "err"); }
  };

  const resetToSaved = () => {
    const e = data.enterScreen || {};
    setEnabled(e.enabled !== false);
    setText(e.text || "click to enter");
    setC1(safeHex(e.gradColor1, "#3c0a1e"));
    setC2(safeHex(e.gradColor2, "#000000"));
    setAngle(typeof e.gradAngle === "number" ? e.gradAngle : 135);
    setStyle(e.style === "modern" ? "modern" : "classic");
    setAccent(safeHex(e.loaderAccent, "#a97bff"));
    setLdFont(e.loaderFont || "");
    setLdFontUrl(e.loaderFontUrl || "");
    setSfxOn(e.sfxEnabled === true);
    setSfxVol(typeof e.sfxVolume === "number" ? e.sfxVolume : 60);
    setSfxAmb(e.sfxAmbientUrl || "");
    showStatus("changes reset");
  };

  return (
    <div className="sec-page">
      <EditorHead title="Enter Screen" meta="The click-to-enter gate." status={status} onReset={resetToSaved} onPublish={save} />

      <div className="sec-grid">

        {/* Intro gate controls */}
        <div className="glass">
          <div className="grp-head" style={{ justifyContent: "space-between" }}>
            <span className="grp-title">Intro gate</span>
            <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 11, color: "rgba(253,245,236,0.6)" }}>Enabled</span>
              <div className={"switch " + (enabled ? "on" : "")} onClick={() => setEnabled(!enabled)} role="switch" aria-checked={enabled}><div className="knob" /></div>
            </div>
          </div>
          <div className="field-sub" style={{ marginBottom: 14 }}>
            Shown before the site loads — visitors enter from here. This unlocks audio autoplay and helps with iOS Low Power Mode video blocking. If off, the site loads directly.
          </div>

          {/* Which intro to use — the settings below follow this choice. */}
          <div className="ctl-row" style={{ marginBottom: 14 }}>
            <span>Style</span>
            <div className="segmented" style={{ flex: "0 0 auto" }}>
              <button className={!modern ? "active" : ""} onClick={() => setStyle("classic")}>Classic</button>
              <button className={modern ? "active" : ""} onClick={() => setStyle("modern")}>Cinematic</button>
            </div>
          </div>
          <div className="field-sub" style={{ marginBottom: 14 }}>
            {modern
              ? "Cinematic loader — fills to 100% as the site actually loads, then invites the click."
              : "Classic — a gradient overlay with your text, clickable straight away."}
          </div>

          {modern ? (
            <div className="ctl-stack">
              <div className="ctl-row">
                <span>Accent colour <span className="field-sub">drives every coloured element</span></span>
                <div className="color-row" style={{ flex: "0 0 auto" }}>
                  <input type="color" value={isHex(accent) ? accent : "#a97bff"} onChange={(e) => setAccent(e.target.value)} className="swatch" />
                  <input className="input" style={{ width: 92, fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }} value={accent} onChange={(e) => setAccent(e.target.value)} maxLength={7} />
                </div>
              </div>
              <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                {["#a97bff", "#5b8cff", "#2fd6c3", "#ff5c7a", "#ffffff"].map((p) => (
                  <button key={p} title={p} onClick={() => setAccent(p)}
                    style={{ width: 26, height: 26, borderRadius: 7, background: p, cursor: "pointer",
                      border: accent.toLowerCase() === p ? "2px solid #fff" : "1px solid rgba(255,255,255,0.14)" }} />
                ))}
              </div>
              <div className="field-sub">The “Welcome” wordmark always stays white — the accent colours the frame, loading lines, glow, stars and compass.</div>
              <div>
                <div className="lbl">“Welcome” font</div>
                <FontPicker
                  name={ldFont} url={ldFontUrl} onName={setLdFont} onUrl={setLdFontUrl}
                  hint="applies to the wordmark only — the counter, labels and compass stay monospaced. Leave blank for the default, Michroma."
                />
              </div>
            </div>
          ) : (
            <div className="ctl-stack">
              <div>
                <div className="lbl-row"><span className="lbl" style={{ margin: 0 }}>Enter text</span><span className="lbl-count">{text.length} / 100</span></div>
                <input className="input" value={text} onChange={(e) => setText(e.target.value)} maxLength={100} placeholder="click to enter" />
              </div>
              <div className="ctl-row">
                <span>Gradient colors</span>
                <div style={{ display: "flex", gap: 6, flex: "0 0 auto" }}>
                  <input type="color" value={c1} onChange={(e) => setC1(e.target.value)} className="swatch" style={{ width: 26, height: 26 }} />
                  <input type="color" value={c2} onChange={(e) => setC2(e.target.value)} className="swatch" style={{ width: 26, height: 26 }} />
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <input className="input" value={c1} onChange={(e) => setC1(e.target.value)} maxLength={7} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }} />
                <input className="input" value={c2} onChange={(e) => setC2(e.target.value)} maxLength={7} style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }} />
              </div>
              <div>
                <div className="sld-head"><span>Gradient angle</span><span className="sld-val">{angle}°</span></div>
                <input className="slider" type="range" min="0" max="360" step="5" value={angle} onChange={(e) => setAngle(+e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Ambient loop — cinematic loader only */}
        {modern && (
          <div className="glass">
            <div className="grp-head" style={{ justifyContent: "space-between" }}>
              <span className="grp-title">Ambient sound</span>
              <div style={{ display: "flex", alignItems: "center", gap: 8 }}>
                <span style={{ fontSize: 11, color: "rgba(253,245,236,0.6)" }}>Enabled</span>
                <div className={"switch " + (sfxOn ? "on" : "")} onClick={() => setSfxOn(!sfxOn)} role="switch" aria-checked={sfxOn}><div className="knob" /></div>
              </div>
            </div>
            <div className="field-sub" style={{ marginBottom: 14 }}>
              A loop that plays under the loading animation and fades out when the visitor enters. Upload to R2 and paste the URL.
            </div>
            <div className="ctl-stack" style={{ opacity: sfxOn ? 1 : 0.45, pointerEvents: sfxOn ? "auto" : "none" }}>
              <div>
                <div className="lbl">Loop URL</div>
                <div style={{ display: "flex", gap: 8 }}>
                  <input className="input" style={{ fontFamily: "'JetBrains Mono', monospace", fontSize: 11.5 }}
                    value={sfxAmb} maxLength={500} placeholder="https://…r2.dev/hum-loop.mp3" onChange={(e) => setSfxAmb(e.target.value)} />
                  <button className="btn btn-tiny" style={{ flex: "0 0 auto" }} onClick={() => previewSound(sfxAmb)}>Test</button>
                </div>
                <div className="field-sub">loops quietly while the bar fills</div>
              </div>
              <div>
                <div className="sld-head"><span>Volume</span><span className="sld-val">{sfxVol}%</span></div>
                <input className="slider" type="range" min="0" max="100" step="5" value={sfxVol} onChange={(e) => setSfxVol(+e.target.value)} />
              </div>
              <div className="field-sub">
                Heads up: browsers block audio until the visitor interacts with the page, so this is best-effort — if it's blocked, it starts on their first tap/click instead. (With the Turnstile gate on, solving the challenge counts, so it'll play reliably there.)
              </div>
            </div>
          </div>
        )}

        {/* Live preview — mirrors whichever style is selected */}
        <div>
          <div className="grp-title" style={{ marginBottom: 10 }}>Live preview</div>
          <div style={{ border: "1px solid rgba(255,255,255,0.09)", borderRadius: 16, background: modern ? "#050506" : "#050408", minHeight: 240, display: "flex", alignItems: "center", justifyContent: "center", position: "relative", overflow: "hidden" }}>
            {modern ? (
              <>
                <div style={{ position: "absolute", inset: 0, background: `radial-gradient(420px 220px at 50% 78%, ${isHex(accent) ? accent : "#a97bff"}22, transparent 70%)` }} />
                {/* corner brackets — two borders each, so they read as L-shapes */}
                {(() => {
                  const A = isHex(accent) ? accent : "#a97bff";
                  const rule = `1.5px solid ${A}`;
                  const glow = `drop-shadow(0 0 5px ${A})`;
                  const corners = [
                    { top: 14, left: 14, borderTop: rule, borderLeft: rule, borderRadius: "6px 0 0 0" },
                    { top: 14, right: 14, borderTop: rule, borderRight: rule, borderRadius: "0 6px 0 0" },
                    { bottom: 14, left: 14, borderBottom: rule, borderLeft: rule, borderRadius: "0 0 0 6px" },
                    { bottom: 14, right: 14, borderBottom: rule, borderRight: rule, borderRadius: "0 0 6px 0" },
                  ];
                  return corners.map((c, i) => (
                    <div key={i} style={{ position: "absolute", width: 26, height: 26, filter: glow, ...c }} />
                  ));
                })()}
                <div style={{ position: "relative", textAlign: "center" }}>
                  <div style={{ fontFamily: (ldFont.trim() ? `'${ldFont.trim()}', ` : "") + "'Michroma', sans-serif", fontSize: 20, letterSpacing: "0.12em", color: "#fff", textShadow: "0 0 14px rgba(255,255,255,0.35)" }}>Welcome</div>
                </div>
                <div style={{ position: "absolute", left: "8%", right: "8%", bottom: 54, height: 1,
                  background: `linear-gradient(90deg, transparent, ${isHex(accent) ? accent : "#a97bff"} 20%, #fff 50%, ${isHex(accent) ? accent : "#a97bff"} 80%, transparent)`,
                  boxShadow: `0 0 12px ${isHex(accent) ? accent : "#a97bff"}` }} />
                <div style={{ position: "absolute", left: "8%", bottom: 64, fontFamily: "'JetBrains Mono', monospace", fontSize: 8, letterSpacing: "0.3em", color: "rgba(255,255,255,0.55)" }}>LOADING</div>
                <div style={{ position: "absolute", right: "8%", bottom: 64, fontFamily: "'JetBrains Mono', monospace", fontSize: 8, letterSpacing: "0.3em", color: "#fff" }}>100.00%</div>
                <div style={{ position: "absolute", left: 0, right: 0, bottom: 28, textAlign: "center", fontFamily: "'JetBrains Mono', monospace", fontSize: 9, letterSpacing: "0.45em", color: "#fff", animation: "enterPulse 3s ease infinite" }}>CLICK TO ENTER</div>
              </>
            ) : (
              <>
                <div style={{ position: "absolute", inset: 0, background: "radial-gradient(360px 200px at 50% 60%, rgba(230,74,82,0.1), transparent 65%)" }} />
                <div style={{
                  fontSize: 22, fontWeight: 650, letterSpacing: "0.04em", position: "relative",
                  backgroundImage: `linear-gradient(${angle}deg, ${c1}, ${c2})`,
                  WebkitBackgroundClip: "text", backgroundClip: "text",
                  color: "transparent", WebkitTextFillColor: "transparent",
                  animation: "enterPulse 3s ease infinite",
                }}>{text || "click to enter"}</div>
              </>
            )}
          </div>
        </div>

      </div>
    </div>
  );
}

/* ═══════════════ ADMIN THEME (per-device, localStorage) ═══════════════ */
// Admin theme is now persisted on the backend (in the `admin-theme` blob)
// so it syncs across devices. We still read it once on App mount via apiGet().
const DEFAULT_ADMIN_THEME = {
  accent:    "#e64a52",
  accent2:   "#f3c969",
  bg:        "",
  uiBlur:    24,
  heroFont:  "Instrument Serif",
  heroFontUrl: "",
  subFont:   "Geist",
  subFontUrl: "",
};

// Parse the admin theme from a fresh /get-content response.
// Always returns a complete object (missing fields filled with defaults).
function readAdminTheme(data) {
  const t = (data && data.adminTheme && typeof data.adminTheme === "object") ? data.adminTheme : {};
  return { ...DEFAULT_ADMIN_THEME, ...t };
}

// Detect format hint from a font URL's extension (woff2/woff/otf/ttf).
// Browsers can usually figure this out without the hint, but adding it
// silences a Chrome console warning.
function fontFormatFromUrl(url) {
  const u = (url || "").toLowerCase().split(/[?#]/)[0];
  if (u.endsWith(".woff2")) return "woff2";
  if (u.endsWith(".woff")) return "woff";
  if (u.endsWith(".otf")) return "opentype";
  if (u.endsWith(".ttf")) return "truetype";
  return "";  // empty = let browser sniff
}

function applyAdminTheme(t) {
  let el = document.getElementById("adminThemeStyle");
  if (!el) { el = document.createElement("style"); el.id = "adminThemeStyle"; document.head.appendChild(el); }
  const acc = isHex(t.accent) ? t.accent : DEFAULT_ADMIN_THEME.accent;
  const acc2 = isHex(t.accent2) ? t.accent2 : DEFAULT_ADMIN_THEME.accent2;
  const blur = Math.max(0, Math.min(60, typeof t.uiBlur === "number" ? t.uiBlur : DEFAULT_ADMIN_THEME.uiBlur));
  // Cache the accent pair so the login screen (which renders before data
  // loads) can show the saved gradient instead of the defaults.
  try { localStorage.setItem("admin_accent_cache", JSON.stringify({ accent: acc, accent2: acc2 })); } catch {}

  // Build @font-face for any user-supplied font URLs.
  // ALSO load via FontFace API and log success/failure so the user has
  // visibility when something goes wrong (CORS, 404, wrong format, etc).
  let fontFaces = "";
  const loadFontViaApi = (name, url) => {
    if (!window.FontFace || !name || !url) return;
    try {
      const face = new FontFace(name, `url(${JSON.stringify(url)})`);
      face.load()
        .then((loaded) => {
          document.fonts.add(loaded);
          console.log(`[admin font] ✓ loaded "${name}" from ${url}`);
        })
        .catch((err) => {
          console.warn(`[admin font] ✗ failed to load "${name}" from ${url}`);
          console.warn(`  reason: ${err.message || err}`);
          console.warn(`  most common cause: R2 CORS not configured. The font file must allow cross-origin access.`);
          console.warn(`  fix: in your Cloudflare R2 bucket → Settings → CORS Policy, add a rule allowing your admin domain (or "*").`);
        });
    } catch (err) {
      console.warn(`[admin font] FontFace API error for "${name}":`, err);
    }
  };
  if (t.heroFontUrl && t.heroFont) {
    const fmt = fontFormatFromUrl(t.heroFontUrl);
    fontFaces += `@font-face{font-family:'${t.heroFont}';src:url('${t.heroFontUrl}')${fmt ? ` format('${fmt}')` : ""};font-display:swap;}`;
    loadFontViaApi(t.heroFont, t.heroFontUrl);
  }
  // No URL means it's a Google Fonts family name — inject the <link> or the
  // title just falls back to whatever the <head> stylesheet already loaded.
  if (!t.heroFontUrl) ensureAdminFont(t.heroFont);
  if (!t.subFontUrl) ensureAdminFont(t.subFont);
  if (t.subFontUrl && t.subFont) {
    const fmt = fontFormatFromUrl(t.subFontUrl);
    fontFaces += `@font-face{font-family:'${t.subFont}';src:url('${t.subFontUrl}')${fmt ? ` format('${fmt}')` : ""};font-display:swap;}`;
    loadFontViaApi(t.subFont, t.subFontUrl);
  }

  let bgCss = "";
  if (isHex(t.bg)) {
    bgCss = `html,body{background:${t.bg} !important;}`;
  }

  // Sidebar / topbar / glass cards: apply user-chosen blur via !important
  // so the CSS variable is honored on iOS Safari too.
  const blurCss = `
    .sidebar{backdrop-filter:blur(${blur}px) saturate(1.6) !important;-webkit-backdrop-filter:blur(${blur}px) saturate(1.6) !important;}
    .topbar{backdrop-filter:blur(${blur}px) saturate(1.6) !important;-webkit-backdrop-filter:blur(${blur}px) saturate(1.6) !important;}
    .glass{backdrop-filter:blur(${Math.max(0, blur - 4)}px) saturate(1.5) !important;-webkit-backdrop-filter:blur(${Math.max(0, blur - 4)}px) saturate(1.5) !important;}
  `;

  el.textContent = `
    ${fontFaces}
    ${bgCss}
    :root{
      --accent:${acc} !important;
      --accent-2:${acc2} !important;
      --hero-font: ${JSON.stringify(t.heroFont || "Instrument Serif")};
      --sub-font:  ${JSON.stringify(t.subFont  || "Geist")};
    }
    /* nav-item active visuals are driven by base CSS (blue/black) — accent only used for icons buttons */
    .intro-title{font-family:var(--hero-font),serif !important;font-weight:400 !important;}
    .intro-sub{font-family:var(--sub-font),sans-serif !important;}
    ${blurCss}
  `;
}

  const [resetStatus, showResetStatus] = useSaveStatus();
  const [resetBusy, setResetBusy] = useState(false);
  // Two-step arm→confirm state for the destructive analytics reset. MUST be

  const [resetArmed, setResetArmed] = useState(false);

  const saveAdminBgVideo = async () => {

  const saveHeroVideo = async () => {

/* ═══════════════ SITE-WIDE VIDEO BACKGROUND ═══════════════ */
// Two videos coexist in the .site-bg layer:
//   - main: the admin background video (always muted)
//   - hero: the overview video (has audio)
//
// AUDIO RULES (simple):
//   - On home/overview        → fade volume to 1 over 2s
//   - Anywhere else           → fade volume to 0 over 2s
//   - Element stays unmuted   → once unlocked at login, we never re-mute it,
//                               so the browser keeps the audio pipeline alive
//                               and there's no "won't resume" weirdness.

const AUDIO_FADE_MS = 2000;

// Main video visibility. With a Hero video set: Hero on Home, Main on every
// other section. Without one, Main plays on Home only — whatever plays on Home
// always fades out when you leave it.
const mainVisible = (onHome, hasHero) => (hasHero ? !onHome : onHome);

function SiteVideoBackground({ url, heroUrl, isHero }) {
  const mainRef = useRef(null);
  const heroRef = useRef(null);
  const fadeRef = useRef(null);

  // Mount the videos once. Re-run only when URLs change.
  useEffect(() => {
    const host = document.getElementById("siteBg");
    if (!host) return;
    host.querySelectorAll("video").forEach((v) => v.remove());

    const makeVideo = (src, isHeroVideo) => {
      if (!src) return null;
      const v = document.createElement("video");
      v.src = src;
      v.autoplay = true;
      v.loop = true;
      v.playsInline = true;
      v.setAttribute("playsinline", "");
      v.style.transition = "opacity 0.6s ease-out";
      // Main video stays muted forever. Hero starts at volume 0 (silent) but
      // UNMUTED if the user already gave us a gesture (via login click).
      // Starting silent-but-unmuted is the magic that prevents the
      // "won't resume audio" bug — the audio track is always live, we just
      // animate volume.
      if (isHeroVideo) {
        v.muted = !window.__adminAudioUnlocked;
        v.volume = 0;
      } else {
        v.muted = true;
      }
      host.appendChild(v);
      v.play().catch((err) => {
        // Browser blocked autoplay-with-sound → fall back to muted
        if (!v.muted) {
          v.muted = true;
          v.play().catch(() => {});
        }
      });
      return v;
    };

    // The main video only exists for the other sections when it differs from
    // the Home video; on its own it's Home's video, and leaves with it.
    mainRef.current = makeVideo(url === heroUrl ? "" : url, false);
    heroRef.current = makeVideo(heroUrl, true);

    // Expose the hero video to the rest of the app so the topbar audio
    // toggle can mute/unmute it without prop drilling. Cleanup clears it.
    window.__adminHeroVideo = heroRef.current;

    // Apply initial visibility based on which page we started on
    if (mainRef.current) mainRef.current.style.opacity = mainVisible(isHero, !!heroRef.current) ? "1" : "0";
    if (heroRef.current) heroRef.current.style.opacity = isHero ? "1" : "0";

    return () => {
      if (fadeRef.current) cancelAnimationFrame(fadeRef.current);
      [mainRef.current, heroRef.current].forEach((v) => v && v.remove());
      if (window.__adminHeroVideo === heroRef.current) window.__adminHeroVideo = null;
    };
  }, [url, heroUrl]);

  // Volume + visual fade — runs whenever isHero changes.
  // SINGLE RULE: target volume = 1 if isHero AND NOT user-muted, else 0.
  useEffect(() => {
    const main = mainRef.current;
    const hero = heroRef.current;
    if (!hero) {
      if (main) main.style.opacity = mainVisible(isHero, false) ? "1" : "0";
      return;
    }

    // Visual cross-fade (fast)
    if (main) main.style.opacity = mainVisible(isHero, true) ? "1" : "0";
    hero.style.opacity = isHero ? "1" : "0";

    // Respect the user-mute flag. The audio-toggle button sets/clears
    // window.__adminUserMuted; we read it here so isHero changes don't
    // accidentally re-enable audio the user chose to silence.
    const userMuted = !!window.__adminUserMuted;
    const wantsAudio = isHero && window.__adminAudioUnlocked && !userMuted;

    // If we want audio, ensure unmuted + playing.
    if (wantsAudio && hero.muted) {
      hero.muted = false;
      hero.play().catch(() => {});
    }

    // Cancel any in-flight fade, start a fresh one
    if (fadeRef.current) cancelAnimationFrame(fadeRef.current);
    const startVol = hero.volume;
    const targetVol = wantsAudio ? 1 : 0;
    if (startVol === targetVol) return;

    // If we're fading TO silence (leaving home, or user muted), iOS requires
    // setting `muted=true` to actually silence — its `volume` property is
    // read-only on mobile.
    const startTime = performance.now();
    const step = (t) => {
      const p = Math.min(1, (t - startTime) / AUDIO_FADE_MS);
      // Clamp — floating-point lerp can drift microscopically below 0 or
      // above 1, which throws IndexSizeError and kills the animation.
      const v = startVol + (targetVol - startVol) * p;
      hero.volume = Math.max(0, Math.min(1, v));
      if (p < 1) {
        fadeRef.current = requestAnimationFrame(step);
      } else if (targetVol === 0) {
        // Fade complete — silence properly for iOS
        hero.muted = true;
      }
    };
    fadeRef.current = requestAnimationFrame(step);
  }, [isHero]);

  // Watch for the audio-unlock event in case the user reaches home BEFORE
  // unlocking (shouldn't happen with our login flow, but safe to handle).
  useEffect(() => {
    if (!heroRef.current || !isHero) return;
    if (!heroRef.current.muted) return;  // already unlocked
    // Poll the global flag every 250ms; once unlocked, unmute + fade up.
    let id;
    const check = () => {
      const h = heroRef.current;
      if (!h) return;
      if (window.__adminAudioUnlocked && h.muted) {
        h.muted = false;
        h.play().catch(() => {});
        // Trigger a fade-up by restarting our volume animation
        if (fadeRef.current) cancelAnimationFrame(fadeRef.current);
        const startTime = performance.now();
        const step = (t) => {
          const p = Math.min(1, (t - startTime) / AUDIO_FADE_MS);
          h.volume = Math.max(0, Math.min(1, p));
          if (p < 1) fadeRef.current = requestAnimationFrame(step);
        };
        fadeRef.current = requestAnimationFrame(step);
        return;
      }
      id = setTimeout(check, 250);
    };
    id = setTimeout(check, 250);
    return () => clearTimeout(id);
  }, [isHero]);

  return null;
}

/* ═══════════════ APP ═══════════════ */
function App() {
  const [authed, setAuthed] = useState(!!getAdminKey());
  const [active, setActive] = useState("home");
  const [settingsOpen, setSettingsOpen] = useState(false);
  // Sidebar starts closed so the cinematic hero takes the full screen on entry.
  // User can open it via the menu button.
  // Desktop shows the sidebar by default (as in the design); on phones it
  // stays a drawer you open with the hamburger.
  const [sidebarOpen, setSidebarOpen] = useState(() => {
    try { return window.matchMedia("(min-width: 881px)").matches; } catch (e) { return true; }
  });
  const [data, setData] = useState(null);
  const [loadError, setLoadError] = useState("");

  // Restore audio-unlock flag across reloads while still authed.
  // If they unlocked earlier this session, audio should auto-resume.
  useEffect(() => {
    try {
      if (sessionStorage.getItem("admin_audio_unlocked") === "1") {
        window.__adminAudioUnlocked = true;
      }
    } catch {}
  }, []);

  const reload = useCallback(async () => {
    try { const d = await apiGet(); setData(d); setLoadError(""); }
    catch (e) { setLoadError(e.message); }
  }, []);
  // Expose reload so apiUpdate can refresh to the latest after a 409 conflict.
  useEffect(() => { window.__adminReload = reload; return () => { delete window.__adminReload; }; }, [reload]);

  useEffect(() => { if (authed) reload(); }, [authed, reload]);
  // Apply admin theme whenever fresh data lands — first load, post-save reload, etc.
  useEffect(() => { if (data) applyAdminTheme(readAdminTheme(data)); }, [data]);
  // Toggle a body class for the home page so CSS can dim the bg overlay less
  useEffect(() => {
    document.body.classList.toggle("on-home", active === "home");
    return () => document.body.classList.remove("on-home");
  }, [active]);

  // Auto-close sidebar on mobile when navigating to a new section
  const navigate = (id) => {
    setActive(id);
    if (window.innerWidth < 880) setSidebarOpen(false);
  };

  const logout = () => { clearAdminKey(); setAuthed(false); setSettingsOpen(false); setData(null); };

  if (!authed) return <Login onSuccess={() => setAuthed(true)} />;
  if (!data) {
    return (
      <div className="login-screen">
        <div style={{ color: "var(--ink-2)", fontFamily: "'JetBrains Mono', monospace", fontSize: 12, letterSpacing: ".16em", textTransform: "uppercase", textAlign: "center" }}>
          {loadError ? (
            <>
              <div style={{ color: "var(--danger)", marginBottom: 14 }}>error: {loadError}</div>
              <button className="btn" onClick={reload}>retry</button>
              <button className="btn" onClick={logout} style={{ marginLeft: 8 }}>lock</button>
            </>
          ) : "loading content…"}
        </div>
      </div>
    );
  }

  // Cinematic section transition: the keyed .section-view div re-mounts on
  // section change, replaying the CSS camera-push + light-sweep + child stagger.
  // (Pure CSS — no Framer Motion needed for this, and it can't drop frames
  // building heavy section DOM the way a JS-driven tween can.)
  const renderPage = () => {
    const key = active;
    let content;
    if (active === "home") content = <CinematicHome data={data} />;
    else if (active === "analytics") content = <Overview data={data} />;
    else if (active === "content") content = <ContentEditor data={data} reload={reload} />;
    else if (active === "ui") content = <UIEditor data={data} reload={reload} />;
    else if (active === "presets") content = <Presets data={data} reload={reload} />;
    else if (active === "badges") content = <DiscordBadges data={data} reload={reload} />;
    else if (active === "enter") content = <EnterScreen data={data} reload={reload} />;

    return <div key={key} className={"section-view section-view--" + key}>{content}</div>;
  };

  return (
    <>
      <SiteVideoBackground url={data.videoBg?.adminUrl || ""} heroUrl={data.videoBg?.heroUrl || ""} isHero={active === "home"} />
      <div className={"shell " + (sidebarOpen ? "" : "sidebar-closed")}>
        <Sidebar active={active} setActive={navigate} open={sidebarOpen} close={() => setSidebarOpen(false)} onLock={logout} />
        <div className={"scrim " + (sidebarOpen ? "show" : "")} onClick={() => setSidebarOpen(false)} />
        <main className="main">
          <Topbar
            active={active}
            openSettings={() => setSettingsOpen(true)}
            settingsOpen={settingsOpen}
            openMenu={() => setSidebarOpen(!sidebarOpen)}
          />
          <div className={"content " + (active === "home" ? "content-home" : "")}>
            {renderPage()}
          </div>
        </main>
        <SettingsPanel open={settingsOpen} onClose={() => setSettingsOpen(false)} data={data} logout={logout} reload={reload} />
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
