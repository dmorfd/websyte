# Static site + Netlify Functions. No framework, no build step beyond
# installing the one function dependency (@netlify/blobs).

[build]
  command   = "npm install"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler          = "esbuild"
  external_node_modules = ["@netlify/blobs"]

# The shared gallery page answers at /gallery as well as /gallery.html.
[[redirects]]
  from   = "/gallery"
  to     = "/gallery.html"
  status = 200

[[redirects]]
  from   = "/gallery/"
  to     = "/gallery.html"
  status = 200

# Posts new comments on this site's gallery photos to its own Discord webhook
# (Admin → Gallery → Comment notifications).
[functions."gallery-comment-notify"]
  schedule = "* * * * *"
