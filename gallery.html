<script>
// ════ THE SHARED GALLERY ════
// The photos, comments and likes live on arandomperson.dev, which owns the
// data. Visitors' browsers call it directly (cross-origin, no key): its rate
// limits count per visitor, so routing these through this site would put
// every visitor in one shared bucket. Only get-content stays on this site.
const GALLERY_API = 'https://arandomperson.dev/.netlify/functions';

// This site's own name, from wherever it's being served.
const SITE_HOST = location.hostname.replace(/^www\./, '');
(function initSiteName(){
  // Separate pieces in the flex bar, spaced like "name . tld / gallery".
  const dot = SITE_HOST.indexOf('.');
  const top = document.getElementById('gTop');
  if (dot > 0) {
    const b = document.createElement('b'); b.textContent = '.';
    top.prepend(SITE_HOST.slice(0, dot), b, SITE_HOST.slice(dot + 1));
  } else {
    top.prepend(SITE_HOST);
  }
  document.getElementById('navSideTitle').textContent = SITE_HOST;
  document.getElementById('gFoot').textContent = '© ' + new Date().getFullYear() + ' ' + SITE_HOST;
})();
</script>
<script>
// ════ SETTINGS → CSS ════
// Every colour on this page is a variable written here from the Gallery
// Editor's saved settings. The server has already collapsed a theme preset
// over the individual colours, so there is one set of values to read and no
// branching on "which mode is the owner in".
(function initSettings(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };

  window.__applyGallerySettings = function (cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const cache = {};
    const el = document.documentElement;
    const set = (k, v) => { el.style.setProperty(k, v); cache[k] = v; };

    const p = cfg.palette || {};
    set('--g-bg1', (cfg.bg && cfg.bg.c1) || '#1a0f12');
    set('--g-bg2', (cfg.bg && cfg.bg.c2) || '#0b090a');
    if (p.accent1) set('--g-accent1', p.accent1); else set('--g-accent1', (cfg.accents && cfg.accents.title.c1) || '#d7263d');
    if (p.accent2) set('--g-accent2', p.accent2); else set('--g-accent2', (cfg.accents && cfg.accents.title.c2) || '#e3b04b');
    if (p.text) set('--g-text', p.text);
    if (p.muted) set('--g-muted', p.muted);
    if (p.panel) set('--g-panel', p.panel);

    const t = cfg.title || {};
    // A font file the owner hosts, loaded with @font-face. The family name is
    // theirs or derived from the filename; the format hint comes from the
    // extension, because a browser that cannot guess the format silently
    // refuses the face and you get the fallback with no error anywhere.
    const FALLBACK = "'Noto Serif JP',serif";
    if (t.fontUrl) {
      const fam = (t.fontName || (t.fontUrl.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, '')).replace(/[^A-Za-z0-9 _-]/g, '') || 'GalleryTitle';
      const ext = (t.fontUrl.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById('galFontFace');
      if (!tag) { tag = document.createElement('style'); tag.id = 'galFontFace'; document.head.appendChild(tag); }
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + t.fontUrl.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set('--g-title-font', '"' + fam + '",' + FALLBACK);
      // Cached alongside the colours so the NEXT visit can inject this face
      // before first paint, instead of the loading screen wearing the fallback
      // until a fetch returns. Not a CSS variable, hence the __ prefix.
      cache.__fontFamily = fam;
      cache.__fontUrl = t.fontUrl;
      // The face is only fetched once something asks for it, and the loading
      // screen's five seconds are long enough to cover that — but only if we
      // actually wait. window.__galleryFontReady is what the loader awaits.
      try {
        window.__galleryFontReady = document.fonts && document.fonts.load
          ? document.fonts.load('900 36px "' + fam + '"').catch(() => {})
          : Promise.resolve();
      } catch (e) { window.__galleryFontReady = Promise.resolve(); }
    } else {
      const tag = document.getElementById('galFontFace');
      if (tag) tag.textContent = '';
      set('--g-title-font', FALLBACK);
      delete cache.__fontFamily; delete cache.__fontUrl;
      window.__galleryFontReady = Promise.resolve();
    }

    // ── THE OTHER TWO HOSTED FACES ──
    // One for the titles ON the photographs (the caption under each tile and
    // the heading in the expanded view), one for the song title in the player.
    //
    // Each family name carries a SUFFIX. All three faces are named after their
    // filenames, so two files called the same thing would declare one family
    // twice — the later @font-face silently winning, and the heading quietly
    // wearing somebody else's font. The suffix makes that impossible, and the
    // panel's previews ask for the same suffixed name.
    //
    // Deliberately NOT replayed from the boot cache the way the title's face
    // is: nothing either of them styles is on screen until the loading screen
    // lifts, by which time the real settings have long since arrived.
    const hostFont = (opt) => {
      const f = opt.font || {};
      if (!f.url) {
        const old = document.getElementById(opt.tagId);
        if (old) old.textContent = '';
        // REMOVED, not set to a default: the rules that read it carry their own
        // fallbacks, and a var() fallback only applies when the property is not
        // declared at all.
        el.style.removeProperty(opt.varName);
        delete cache[opt.varName];
        return Promise.resolve();
      }
      const fam = ((f.name || (f.url.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, ''))
        .replace(/[^A-Za-z0-9 _-]/g, '') || opt.fallbackName) + ' ' + opt.suffix;
      const ext = (f.url.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById(opt.tagId);
      if (!tag) { tag = document.createElement('style'); tag.id = opt.tagId; document.head.appendChild(tag); }
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + f.url.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set(opt.varName, '"' + fam + '",' + FALLBACK);
      try {
        return (document.fonts && document.fonts.load)
          ? document.fonts.load(opt.probe.replace('%s', fam)).catch(() => {})
          : Promise.resolve();
      } catch (e) { return Promise.resolve(); }
    };

    const imgReady = hostFont({
      font: cfg.imageFont, tagId: 'galImgFontFace', varName: '--g-img-font',
      suffix: 'Img', fallbackName: 'GalleryImage', probe: '600 15px "%s"',
    });
    // The player keeps its font under fontUrl/fontName rather than url/name,
    // because `music` is a settings group of its own and `url` there would
    // read as the player's URL. Adapted here rather than renamed in the
    // config, where it would be the odd one out.
    const mFont = cfg.music || {};
    const trkReady = hostFont({
      font: { url: mFont.fontUrl, name: mFont.fontName },
      tagId: 'galTrkFontFace', varName: '--gp-font',
      suffix: 'Trk', fallbackName: 'GalleryTrack', probe: '800 24px "%s"',
    });
    // The loading screen waits on ALL THREE faces, so the first sight of the
    // page is not text changing typeface under the visitor.
    const titleReady = window.__galleryFontReady || Promise.resolve();
    window.__galleryFontReady = Promise.all([titleReady, imgReady, trkReady]).catch(() => {});

    set('--g-title-c1', t.c1 || '#d7263d');
    set('--g-title-c2', t.c2 || '#e3b04b');
    set('--g-title-angle', (typeof t.angle === 'number' ? t.angle : 135) + 'deg');
    // The plate behind the heading. Its wash is full by a third of the way
    // along the slider, so a small value reads as a touch of blur rather than
    // as a slab dropped behind the title.
    const plate = (px) => (px > 0 ? Math.min(1, px / 12).toFixed(3) : '0');
    const tBlur = (typeof t.blur === 'number' ? Math.max(0, Math.min(40, t.blur)) : 0);
    set('--g-title-blur', tBlur + 'px');
    set('--g-title-plate', plate(tBlur));
    // A multiplier on the responsive size, never a replacement for it.
    set('--g-title-scale', ((typeof t.size === 'number' ? Math.max(50, Math.min(160, t.size)) : 100) / 100).toFixed(3));

    const dBlur = (typeof cfg.descBlur === 'number' ? Math.max(0, Math.min(40, cfg.descBlur)) : 0);
    set('--g-desc-blur', dBlur + 'px');
    set('--g-desc-plate', plate(dBlur));
    // Blank follows the page's muted colour, which is what the description has
    // always been — restored to the variable rather than to its current value.
    set('--g-desc-color', (typeof cfg.descColor === 'string' && cfg.descColor) ? cfg.descColor : 'var(--g-muted)');
    // Blank means "follow the title accent", which is not the same as any
    // particular colour — so it is restored to the variable, not to a literal.
    set('--g-tile-glow', (typeof cfg.tileGlow === 'string' && cfg.tileGlow) ? cfg.tileGlow : 'var(--g-accent1)');
    // The sound player's own pair, on the same terms: blank is restored to the
    // variable it follows, not to the colour that variable happens to hold.
    const mus = cfg.music || {};
    const pick = (v, follows) => ((typeof v === 'string' && v) ? v : follows);
    set('--gp-c1', pick(mus.c1, 'var(--acc-title-1)'));
    set('--gp-c2', pick(mus.c2, 'var(--acc-title-2)'));
    // The trim across the top follows the player's pair, which follows the
    // gallery's — each restored to the variable above it, never to a literal,
    // so changing one end still carries the rest with it.
    set('--gp-acc1', pick(mus.accentFrom, 'var(--gp-c1)'));
    set('--gp-acc2', pick(mus.accentTo, 'var(--gp-c2)'));
    // The song title's colour. One colour rather than a pair, and blank is
    // restored to the variable the title follows, not to the colour that
    // variable is currently holding.
    set('--gp-title', pick(mus.titleColor, 'var(--gp-c1)'));
    // The glass. A colour here replaces the page's panel colour for this one
    // element; the strength is how opaque that glass is over whatever is behind.
    set('--gp-tint', mus.tint ? (hexRgb(mus.tint) || 'var(--g-panel)') : 'var(--g-panel)');
    // ── HOW MUCH GLASS ──
    // This is the main site's "Sound player glass" slider, not a second system
    // that happens to resemble it: the same 0-40 range, the same GLASS_FULL of
    // 20, the same ramp and the same two alphas as applyUiVisuals() in
    // index.html. Copied here rather than imported because gallery.html is a
    // standalone document — but copied exactly, and the server holds the same
    // three lines again in gallery-config.js so the editor's live preview
    // cannot drift from the page.
    //
    // The ramp is a ramp and not a clamp in its upper half on purpose: a clamp
    // is what made the top half of the main site's slider do nothing at all
    // for months. And 0 is 0 — no fill, no blur, no border, no shadow, no
    // corner marks and no top line.
    const GLASS_FULL = 20;
    const ramp = (std, max, g) => (g <= 1 ? std * g : std + (max - std) * Math.min(1, g - 1));
    // tintStrength is still read as a fallback, for a cached config written
    // before the slider changed; the server converts it the same way.
    const slider = (typeof mus.glass === 'number' && isFinite(mus.glass))
      ? Math.max(0, Math.min(40, mus.glass))
      : (typeof mus.tintStrength === 'number' && isFinite(mus.tintStrength))
        ? Math.max(0, Math.min(40, (() => {
            const al = Math.max(0, Math.min(100, mus.tintStrength)) / 100;
            return (al <= 0.82 ? al / 0.82 : 1 + (al - 0.82) / 0.15) * GLASS_FULL;
          })()))
        : 20;
    const gl = Math.min(2, slider / GLASS_FULL);
    set('--gp-tint-a', ramp(0.82, 0.97, gl).toFixed(3));
    set('--gp-edge-a', ramp(0.10, 0.28, gl).toFixed(3));
    // Everything that is not a fill — the shadow, the brackets, the trim —
    // rides this one number, so they all arrive and all leave together.
    set('--gp-panel', Math.min(1, gl).toFixed(3));
    // A whole value, never blur(calc(0px)): an identity backdrop-filter is not
    // the same as no backdrop-filter. See the note on .g-player.
    set('--gp-glass', slider > 0 ? 'blur(' + slider + 'px) saturate(1.25)' : 'none');

    const a = cfg.accents || {};
    if (a.title) { set('--acc-title-1', a.title.c1); set('--acc-title-2', a.title.c2); }
    if (a.date) { set('--acc-date-1', a.date.c1); set('--acc-date-2', a.date.c2); }
    if (a.comment) { set('--acc-cmt-1', a.comment.c1); set('--acc-cmt-2', a.comment.c2); }
    // ── THE RULE BESIDE EACH SECTION'S NAME ──
    // The whole gradient, not two colours in a fixed shape: blank is a flat
    // white hairline fading out, which is what every gallery has drawn since
    // there were sections, and a pair turns it into a gradient that fades at
    // the end like the rule under the heading. Blank REMOVES the property
    // rather than writing the white back, so the stylesheet's own default is
    // the one thing describing what "unset" looks like.
    const sec = (a.section && typeof a.section === 'object') ? a.section : {};
    if (sec.c1 || sec.c2) {
      set('--g-sec-line-img', 'linear-gradient(90deg, ' + (sec.c1 || sec.c2)
        + ', ' + (sec.c2 || sec.c1) + ' 60%, transparent)');
    } else {
      el.style.removeProperty('--g-sec-line-img');
      delete cache['--g-sec-line-img'];
    }
    set('--g-sec-line-a',
      (Math.max(0, Math.min(100, typeof cfg.sectionLine === 'number' ? cfg.sectionLine : 100)) / 100).toFixed(3));

    set('--g-tile-min', cfg.density === 'compact' ? '210px' : '290px');
    set('--g-glass', cfg.tileGlass === false ? '1' : '.55');
    el.setAttribute('data-gglass', cfg.tileGlass === false ? 'off' : 'on');

    // ── the video background ──
    // Mobile gets its own file when one is set, because a desktop-sized video
    // on a phone is mostly wasted bytes; blank means share the desktop one.
    const vid = document.getElementById('gVideo');
    const tint = document.getElementById('gTint');
    const v = cfg.video || {};
    const small = window.matchMedia('(max-width: 768px)').matches;
    const src = v.enabled ? ((small && v.mobileUrl) ? v.mobileUrl : v.desktopUrl) : '';
    if (src) {
      if (vid.dataset.src !== src) { vid.dataset.src = src; vid.src = src; try { vid.load(); } catch (e) {} }
      vid.play().catch(() => {});
      vid.classList.add('on');
      el.setAttribute('data-gvideo', '1');       // the title gets its blur plate
      // The SAME wash the main site lays over its background video: three
      // stops, heavier top and bottom, lightest around 45% down, with the
      // strength slider scaling all three. A flat two-stop ramp was close but
      // visibly not the same thing when you walk between the two pages.
      const rgb = hexRgb(v.tint) || '0,0,0';
      const strength = Math.max(0, Math.min(100, typeof v.tintStrength === 'number' ? v.tintStrength : 45)) / 100;
      const a = (base) => Math.min(0.96, base * strength).toFixed(3);
      tint.style.background =
        'linear-gradient(180deg,' +
        ' rgba(' + rgb + ',' + a(0.62) + ') 0%,' +
        ' rgba(' + rgb + ',' + a(0.30) + ') 45%,' +
        ' rgba(' + rgb + ',' + a(0.76) + ') 100%)';
      tint.classList.add('on');
    } else {
      vid.classList.remove('on');
      vid.removeAttribute('src'); delete vid.dataset.src;
      try { vid.load(); } catch (e) {}
      el.removeAttribute('data-gvideo');
      // No video, no wash: tinting a gradient the owner already chose the
      // colour of would just be muddying their own setting.
      tint.classList.remove('on');
    }

    try { localStorage.setItem('galleryThemeCache', JSON.stringify(cache)); } catch (e) {}
    el.classList.add('theme-ready');
  };
  window.__galleryThemeReady = function(){ document.documentElement.classList.add('theme-ready'); };
})();

// ════ THE DRAWER'S OWN COLOURS ════
// These come from the MAIN SITE's theme, not the gallery's, so walking between
// the two pages doesn't change the colour of the navigation under you.
(function initNavTheme(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };
  window.__applyNavTheme = function (theme) {
    if (!theme) return;
    const el = document.documentElement;
    // This site's sidebar settings (UI Editor → Sidebar); blank follows its
    // site accent and page background.
    const bg = hexRgb(theme.sidebarColor) || hexRgb(theme.bgColor2);
    const acc = hexRgb(theme.sidebarAccent) || hexRgb(theme.siteAccent);
    if (bg) el.style.setProperty('--nav-bg', bg); else el.style.removeProperty('--nav-bg');
    if (acc) { el.style.setProperty('--nav-accent', acc); el.style.setProperty('--nav-accent2', acc); }
    else { el.style.removeProperty('--nav-accent'); el.style.removeProperty('--nav-accent2'); }
    const alpha = Math.max(0, Math.min(100, typeof theme.sidebarOpacity === 'number' ? theme.sidebarOpacity : 90)) / 100;
    el.style.setProperty('--nav-alpha', alpha.toFixed(3));
  };
})();

// ════ NAV DRAWER ════
(function initNav(){
  const burger = document.getElementById('navBurger');
  const side   = document.getElementById('navSide');
  const scrim  = document.getElementById('navScrim');
  if (!burger || !side || !scrim) return;

  try {
    const cached = localStorage.getItem('avatarUrlCache');
    const mark = document.getElementById('navSideAvatar');
    if (mark && cached && /^https?:\/\//.test(cached)) {
      mark.addEventListener('error', () => { mark.src = '/favicon.png?v=3'; }, { once: true });
      mark.style.visibility = ''; mark.src = cached;
    }
  } catch (e) {}

  const open = () => {
    side.classList.add('open'); scrim.classList.add('open');
    side.setAttribute('aria-hidden', 'false');
    burger.setAttribute('aria-expanded', 'true');
    document.body.classList.add('nav-open');
  };
  const close = () => {
    side.classList.remove('open'); scrim.classList.remove('open');
    side.setAttribute('aria-hidden', 'true');
    burger.setAttribute('aria-expanded', 'false');
    document.body.classList.remove('nav-open');
  };
  burger.addEventListener('click', () => { side.classList.contains('open') ? close() : open(); });
  scrim.addEventListener('click', close);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && side.classList.contains('open')) close();
  });

  document.getElementById('navOptHome').addEventListener('click', () => { window.location.href = '/'; });
  document.getElementById('navOptGallery').addEventListener('click', close);
})();

// ════ OVERLAY EFFECTS ════
// Snow, petals or rain drifting over the page. One canvas, three behaviours,
// and nothing at all running when the setting is off or motion is reduced —
// an idle requestAnimationFrame loop is a battery cost for no picture.
(function initOverlay(){
  const cv = document.getElementById('gFx');
  const ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  if (!ctx) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // `mode` starts as null rather than 'none' so the FIRST call always applies.
  // Starting it at 'none' made "turn the overlay off" a no-op on load, which
  // left an empty canvas sitting over the page doing nothing visible but
  // reporting itself as shown.
  let raf = 0, parts = [], mode = null, w = 0, h = 0, dpr = 1;

  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  function seed(){
    // Fewer on a phone: the same count that reads as weather on a desktop
    // reads as static on a 390px screen, and costs more per pixel.
    const base = w < 700 ? 34 : 70;
    const n = mode === 'rain' ? Math.round(base * 1.3) : base;
    parts = [];
    for (let i = 0; i < n; i++) {
      parts.push({
        x: rnd(0, w), y: rnd(-h, h),
        r: mode === 'rain' ? rnd(6, 16) : rnd(1.6, 4.2),
        s: mode === 'rain' ? rnd(7, 13) : rnd(.5, 1.7),
        d: rnd(-.5, .5), a: rnd(.25, .75),
        rot: rnd(0, Math.PI * 2), spin: rnd(-.03, .03),
      });
    }
  }

  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (mode === 'rain') {
        ctx.strokeStyle = 'rgba(190,210,235,' + (p.a * .5).toFixed(2) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.d * 2, p.y + p.r); ctx.stroke();
        p.y += p.s * 2.2; p.x += p.d;
      } else if (mode === 'petals') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(255,183,197,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.5, p.r * .8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        p.y += p.s; p.x += Math.sin(p.y / 40) * .8 + p.d; p.rot += p.spin;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        p.y += p.s; p.x += Math.sin(p.y / 55) * .5 + p.d;
      }
      if (p.y > h + 24) { p.y = -20; p.x = rnd(0, w); }
      if (p.x < -30) p.x = w + 20; else if (p.x > w + 30) p.x = -20;
    }
    raf = requestAnimationFrame(frame);
  }

  window.__setGalleryOverlay = function (next){
    const want = ['snow', 'petals', 'rain'].indexOf(next) !== -1 ? next : 'none';
    if (want === mode) return;
    mode = want;
    cancelAnimationFrame(raf); raf = 0;
    ctx.clearRect(0, 0, w, h);
    if (mode === 'none' || reduce) { cv.style.display = 'none'; return; }
    // 'block', not '': the stylesheet hides this by default so an unconfigured
    // page never shows an empty canvas, and clearing the inline value would

      if (!audio.duration || !isFinite(audio.duration)) return;
      const r = bar.getBoundingClientRect();
      const f = r.width ? Math.max(0, Math.min(1, (clientX - r.left) / r.width)) : 0;
      audio.currentTime = f * audio.duration;
      progress(f);
      curN.textContent = fmt(audio.currentTime);
    };
    bar.addEventListener('pointerdown', (e) => {
      userActed = true;
      dragging = true;
      // Capture, so a drag that wanders off the rail keeps scrubbing and the
      // release is still heard here rather than by whatever is underneath.
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      seekTo(e.clientX);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seekTo(e.clientX); });
    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false;
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    bar.addEventListener('pointerup', endDrag);
    bar.addEventListener('pointercancel', endDrag);

    audio.addEventListener('timeupdate', () => {
      curN.textContent = fmt(audio.currentTime);
      if (dragging) return;
      if (!audio.duration || !isFinite(audio.duration)) return;
      progress(audio.currentTime / audio.duration);
    });

    // Called once the settings arrive. Idempotent, so a later settings change
    // re-points it rather than stacking a second player.
    window.__applyGalleryMusic = function (m) {
      // Only rows with a link are tracks. The settings keep a row the moment it
      // has anything in it — that is what lets a title be typed before the URL
      // in the panel — so the half-written ones are filtered out HERE rather
      // than being stored differently.
      const playable = (m && Array.isArray(m.tracks) ? m.tracks : []).filter((t) => t && t.url);
      const on = m && m.enabled === true && playable.length > 0;
      if (!on) {
        try { audio.pause(); } catch (e) {}
        // The class outlives the element being hidden, so it is cleared here
        // too — otherwise a player switched off mid-track comes back glowing.
        root.classList.remove('is-playing');
        root.hidden = true; tracks = []; return;
      }
      tracks = playable.slice(0, 4);
      // Stay where we are if the track in the element is still in the list: a
      // settings refresh should not jump the visitor back to the first song,
      // nor re-fetch what is already loaded.
      const here = audio.src ? tracks.findIndex((t) => abs(t.url) === audio.src) : -1;
      at = here >= 0 ? here : 0;
      audio.volume = Math.max(0, Math.min(100, typeof m.volume === 'number' ? m.volume : 60)) / 100;
      coverOn = m.showCover !== false;
      fallbackCover = m.coverUrl || '';
      cover.onerror = () => { art.hidden = true; };
      root.hidden = false;
      // Cueing the first track is what fetches its headers, and therefore what
      // puts a real length on the right-hand clock before anyone presses play.
      if (here >= 0) paint(); else load(at, false);
      // Asked for once there is something to play AND the loading screen has
      // gone — see the curtain's all-clear above. armAutoplay is idempotent,
      // so a later settings refresh re-pointing the player does not try a
      // second time, and a refresh that arrives after the reveal fires
      // immediately rather than waiting for a signal already given.
      if (m.autoplay !== false) whenRevealed(armAutoplay);
    };
  })();

  const LOAD_STEPS = 10;
  const MIN_LOAD_MS = 5000;
  const MAX_LOAD_MS = 20000;

  function setProgress(fraction){
    const f = Math.max(0, Math.min(1, fraction));
    const step = Math.round(f * LOAD_STEPS);
    loadFill.style.width = (f * 100).toFixed(1) + '%';
    loadN.textContent = pad(step);
    loadT.textContent = pad(LOAD_STEPS);
    loadPct.textContent = Math.round(f * 100) + '%';
  }

  // Resolves once BOTH are true: every image is in the cache, and the minimum
  // time has passed. The bar tracks whichever of the two is further behind, so
  // it never races ahead of the slower one and then sits still.
  function preload(urls){
    return new Promise((resolve) => {
      const started = Date.now();
      let loaded = 0;
      const total = urls.length;
      let settled = false;

      const finish = () => { if (settled) return; settled = true; cancelAnimationFrame(tickRaf); setProgress(1); resolve(); };

      // The title's own font counts as something to load. Without this the
      // screen could finish before the face arrived and the heading would wear
      // the fallback for the one moment it is the largest thing on the page —
      // which is exactly when a custom face is worth having.
      // The promise does not exist yet: settings arrive from a fetch, and this
      // loop starts before that. Reading it once at the top meant it was always
      // undefined, so the loader resolved immediately and never waited — which
      // is why the heading still wore the fallback face.
      // So it is picked up WHEN it appears, inside the tick below.
      let fontDone = false;
      let fontHooked = false;
      const hookFont = () => {
        if (fontHooked || !window.__galleryFontReady) return;
        fontHooked = true;
        Promise.resolve(window.__galleryFontReady).then(() => { fontDone = true; }, () => { fontDone = true; });
      };
      // Never let a font that never resolves hold the page; it is decoration.
      setTimeout(() => { fontDone = true; }, Math.min(MIN_LOAD_MS, 4000));

      urls.forEach((u) => {
        const im = new Image();
        im.onload = im.onerror = () => { loaded++; };
        im.src = u;
      });

      let tickRaf = 0;
      const tick = () => {
        hookFont();
        const elapsed = Date.now() - started;
        const byTime = Math.min(1, elapsed / MIN_LOAD_MS);
        const byImages = total ? loaded / total : 1;
        setProgress(Math.min(byTime, byImages));
        if ((byImages >= 1 && fontDone && elapsed >= MIN_LOAD_MS) || elapsed >= MAX_LOAD_MS) { finish(); return; }
        tickRaf = requestAnimationFrame(tick);
      };
      tickRaf = requestAnimationFrame(tick);
    });
  }

  // The bar reaching 100% is a beat of its own. Lifting on the same frame is a
  // jump cut: the count never gets to BE ten out of ten for long enough to
  // read, and the work the screen was covering looks like it never happened.
  // So the finished screen is held, and only then does the curtain move.
  const REVEAL_HOLD_MS = 1500;

  function finishLoading(){
    // Paint the grid underneath BEFORE the curtain starts to move, so the
    // fade reveals a finished page rather than one still assembling.
    requestAnimationFrame(() => {
      setTimeout(() => {
        loader.classList.add('done');
        loader.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
          loader.style.display = 'none';
          // Not when the curtain STARTS to move — when it has gone. Everything
          // waiting on the reveal is waiting to be seen, and for 900ms of fade
          // the page is still behind a veil.
          announceReveal();
        }, 900);
      }, REVEAL_HOLD_MS);
    });
  }

  async function load(){
    let d = null;
    try {
      const res = await fetch(GALLERY_API + '/get-gallery', { cache: 'no-store' });
      if (res.ok) d = await res.json();
    } catch (e) {}

    if (!d) {
      stateEl.querySelector('.msg').textContent = "Couldn't load the gallery";
      showEmpty();
      setProgress(1);
      finishLoading();
      return;
    }

    catalogue = {
      title: typeof d.title === 'string' ? d.title : '',
      intro: typeof d.intro === 'string' ? d.intro : '',
      sections: Array.isArray(d.sections) ? d.sections : [],
      images: Array.isArray(d.images) ? d.images : [],
      config: d.config || null,
    };

    if (catalogue.config) {
      likesOn = catalogue.config.likes !== false;
      if (window.__applyGallerySettings) window.__applyGallerySettings(catalogue.config);
      if (window.__applyGalleryMusic) window.__applyGalleryMusic(catalogue.config && catalogue.config.music);
      if (window.__setGalleryOverlay) window.__setGalleryOverlay(catalogue.config.overlay);
    } else if (window.__galleryThemeReady) {
      window.__galleryThemeReady();
    }

    const heading = (catalogue.config && catalogue.config.title && catalogue.config.title.text) || catalogue.title || 'Gallery';
    titleEl.textContent = heading;
    // The plate behind the heading is sized off the heading's own box now, so
    // nothing here has to be kept in step with the wording.
    loaderTitle.textContent = heading;
    document.title = heading + ' · ' + SITE_HOST;
    descEl.textContent = (catalogue.config && catalogue.config.description) || catalogue.intro || '';

    const urls = catalogue.images.map((im) => im.url).filter(Boolean);
    setProgress(0);
    await preload(urls);
    render();
    finishLoading();
  }

  // ── the expanded view ──
  function setStatus(msg, kind){
    lbStatus.textContent = msg || '';
    lbStatus.className = 'lb-status' + (kind ? ' ' + kind : '');
  }

  function renderComments(list){
    lbList.textContent = '';
    if (!list || !list.length) {
      const e = document.createElement('span'); e.className = 'lb-cmt-empty';
      e.textContent = 'No comments yet - be the first.';
      lbList.appendChild(e);
      lbCmtsH.textContent = 'Comments';
      return;
    }
    lbCmtsH.textContent = 'Comments · ' + list.length;
    const frag = document.createDocumentFragment();
    list.forEach((c) => {
      const row = document.createElement('div'); row.className = 'lb-cmt';
      const rail = document.createElement('div'); rail.className = 'lb-cmt-rail';
      const body = document.createElement('div'); body.className = 'lb-cmt-body';
      const head = document.createElement('div'); head.className = 'lb-cmt-head';
      const nm = document.createElement('span'); nm.className = 'lb-cmt-name'; nm.textContent = c.username || 'anonymous';
      const wh = document.createElement('span'); wh.className = 'lb-cmt-when'; wh.textContent = relTime(c.t);
      head.appendChild(nm); head.appendChild(wh);
      const tx = document.createElement('span'); tx.className = 'lb-cmt-text'; tx.textContent = c.comment || '';
      body.appendChild(head); body.appendChild(tx);
      row.appendChild(rail); row.appendChild(body);
      frag.appendChild(row);
    });
    lbList.appendChild(frag);
  }

  async function loadComments(imageId){
    lbList.textContent = '';
    const l = document.createElement('span'); l.className = 'lb-cmt-empty'; l.textContent = 'loading…';
    lbList.appendChild(l);
    try {
      const res = await fetch(GALLERY_API + '/get-gallery?image=' + encodeURIComponent(imageId), { cache: 'no-store' });
      const d = res.ok ? await res.json() : { comments: [] };
      const list = Array.isArray(d.comments) ? d.comments : [];
      const entry = flat.find((f) => f.img.id === imageId);
      if (entry) { entry.img.comments = list.length; refreshTileCounts(entry); }
      if (openIndex >= 0 && flat[openIndex] && flat[openIndex].img.id === imageId) {
        renderComments(list);
        lbCmtCount.textContent = String(list.length);
      }
    } catch (e) {
      if (openIndex >= 0 && flat[openIndex] && flat[openIndex].img.id === imageId) renderComments([]);
    }
  }

  function paintLike(entry){
    const liked = likedSet().has(entry.img.id);
    lbLike.classList.toggle('on', liked);
    lbLike.setAttribute('aria-pressed', liked ? 'true' : 'false');
    lbLikeCount.textContent = String(entry.img.likes || 0);
    lbLike.style.display = likesOn ? '' : 'none';
  }

  function paint(index){
    const entry = flat[index];
    if (!entry) return;
    openIndex = index;
    const img = entry.img;

    lbImg.alt = img.title || '';
    lbImg.src = img.url;
    lbGame.textContent = entry.sectionName || '';
    lbTitle.textContent = img.title || 'Untitled';
    lbDate.textContent = fmtDate(img.date);

    // Who took it. Two photographers share this gallery, so a visitor looking
    // at one photo should be able to tell whose it is without comparing tiles.
    const owner = img.owner;
    if (owner && owner.name) {
      lbByName.textContent = owner.name;
      lbBy.hidden = false;
    } else {
      lbBy.hidden = true;
    }

    lbDesc.textContent = img.description || '';
    lbPos.textContent = pad(index + 1);
    lbTotal.textContent = pad(flat.length);
    lbCmtCount.textContent = String(img.comments || 0);
    document.getElementById('lb').setAttribute('aria-label', img.title || 'Photo');

    lbPrev.disabled = index <= 0;
    lbNext.disabled = index >= flat.length - 1;
    paintLike(entry);
    setStatus('');
    loadComments(img.id);
  }

  function openLightbox(index){
    lastFocus = document.activeElement;
    lbScrim.classList.add('open');
    lbScrim.setAttribute('aria-hidden', 'false');
    document.body.classList.add('overlay-lock');
    try { lbName.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    paint(index);
    lbClose.focus();
  }
  // Closing is the X button's job and nothing else's: a stray click on the
  // backdrop while reading, or a reflexive Escape, should not throw away the
  // comment someone is halfway through typing.
  function closeLightbox(){
    // Full screen sits above this one, so it would otherwise be left floating
    // over a page with nothing behind it.
    closeFull();
    lbScrim.classList.remove('open');
    lbScrim.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('overlay-lock');
    lbImg.removeAttribute('src');
    openIndex = -1;
    if (lastFocus && typeof lastFocus.focus === 'function') { try { lastFocus.focus(); } catch (e) {} }
  }
  const step = (d) => { const n = openIndex + d; if (n >= 0 && n < flat.length) paint(n); };

  // ── FULL SCREEN ──
  // The photograph on its own, at nine tenths of the screen. A layer above the
  // expanded view rather than a class on the frame: the frame lives in a
  // scrolling column with its own rounding and shadow, and growing it in place
  // would have fought all three.
  const lbFull      = document.getElementById('lbFull');
  const lbFullImg   = document.getElementById('lbFullImg');
  const lbFullClose = document.getElementById('lbFullClose');
  const lbExpand    = document.getElementById('lbExpand');
  let fullTimer = 0;

  const openFull = () => {
    if (!lbFull || !lbImg.getAttribute('src')) return;
    clearTimeout(fullTimer);
    lbFull.classList.remove('closing');
    lbFullImg.src = lbImg.src;
    lbFullImg.alt = lbImg.alt || '';
    lbFull.classList.add('open');
    lbFull.setAttribute('aria-hidden', 'false');
    lbFullClose.focus();
  };
  const closeFull = () => {
    if (!lbFull || !lbFull.classList.contains('open')) return;
    // Run the grow backwards rather than cutting. The src is only dropped once
    // the animation is done, so the picture is still there to shrink.
    lbFull.classList.add('closing');
    lbFull.setAttribute('aria-hidden', 'true');
    clearTimeout(fullTimer);
    fullTimer = setTimeout(() => {
      lbFull.classList.remove('open', 'closing');
      lbFullImg.removeAttribute('src');
    }, 210);
    if (lbExpand && typeof lbExpand.focus === 'function') { try { lbExpand.focus(); } catch (e) {} }
  };

  if (lbExpand) lbExpand.addEventListener('click', openFull);
  if (lbFullClose) lbFullClose.addEventListener('click', closeFull);
  // Anywhere on the backdrop closes it. Unlike the expanded view there is
  // nothing here to lose — no half-typed comment, just a picture.
  if (lbFull) lbFull.addEventListener('click', (e) => { if (e.target !== lbFullClose) closeFull(); });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', () => step(-1));
  lbNext.addEventListener('click', () => step(1));
  document.addEventListener('keydown', (e) => {
    if (!lbScrim.classList.contains('open')) return;
    // Full screen takes the keys while it is up: Escape leaves it rather than
    // the expanded view behind it, and the arrows would otherwise change the
    // photo underneath without the one on screen following.
    if (lbFull && lbFull.classList.contains('open')) {
      if (e.key === 'Escape') { e.preventDefault(); closeFull(); }
      return;
    }
    const typing = document.activeElement === lbName || document.activeElement === lbBody;
    if (typing) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
  document.getElementById('lb').addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = [...document.getElementById('lb').querySelectorAll('button:not([disabled]),input,textarea')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // ── liking ──
  lbLike.addEventListener('click', async () => {
    const entry = flat[openIndex];
    if (!entry || !likesOn) return;
    const set = likedSet();
    const liked = !set.has(entry.img.id);
    // Move the UI first; a like that waits on the network feels broken.
    if (liked) set.add(entry.img.id); else set.delete(entry.img.id);
    saveLiked(set);
    entry.img.likes = Math.max(0, (entry.img.likes || 0) + (liked ? 1 : -1));
    paintLike(entry); refreshTileCounts(entry);
    try {
      const res = await fetch(GALLERY_API + '/like-image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageId: entry.img.id, liked }),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && typeof d.likes === 'number') {
        entry.img.likes = d.likes; paintLike(entry); refreshTileCounts(entry);
      } else if (!res.ok) {
        // Put it back the way it was rather than showing a number the server
        // disagrees with.
        if (liked) set.delete(entry.img.id); else set.add(entry.img.id);
        saveLiked(set);
        entry.img.likes = Math.max(0, (entry.img.likes || 0) + (liked ? -1 : 1));
        paintLike(entry); refreshTileCounts(entry);
      }
    } catch (e) {}
  });

  // ── commenting ──
  lbForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const entry = flat[openIndex];
    if (!entry) return;
    const username = lbName.value.trim();
    const comment = lbBody.value.trim();
    if (!username) { setStatus('add a discord username', 'err'); lbName.focus(); return; }
    if (comment.length < 2) { setStatus('write a little more', 'err'); lbBody.focus(); return; }

    try {
      const last = parseInt(localStorage.getItem(COOLDOWN_KEY) || '0', 10) || 0;
      const left = COOLDOWN_MS - (Date.now() - last);
      if (left > 0) { setStatus('wait ' + Math.ceil(left / 1000) + 's', 'err'); return; }
    } catch (e2) {}

    lbSend.disabled = true;
    setStatus('posting…');
    try {
      const res = await fetch(GALLERY_API + '/send-gallery-comment', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageId: entry.img.id, username, comment }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus(d.error || 'could not post that', 'err'); lbSend.disabled = false; return; }
      setStatus('posted ✓', 'ok');
      // Tell THIS site to look for it now, so the photo's owner here gets it
      // in Discord straight away (same-origin, no data, rate-limited).
      fetch('/.netlify/functions/gallery-comment-check', { method: 'POST' }).catch(() => {});
      lbBody.value = '';
      try {
        localStorage.setItem(NAME_KEY, username);
        localStorage.setItem(COOLDOWN_KEY, String(Date.now()));
      } catch (e3) {}
      entry.img.comments = (entry.img.comments || 0) + 1;
      refreshTileCounts(entry);
      await loadComments(entry.img.id);
    } catch (e4) {
      setStatus('connection error', 'err');
    }
    lbSend.disabled = false;
  });

  // ── the photos are not yours to take ──
  // Casual-only, and honestly so: the browser has to receive the bytes to show
  // them, so anyone determined still can. This stops the reflex — right-click,
  // save image — and nothing more.
  document.addEventListener('contextmenu', (e) => {
    if (e.target && e.target.tagName === 'IMG' && e.target.closest('.g-shot, .lb-frame')) e.preventDefault();
  });
  document.addEventListener('dragstart', (e) => {
    if (e.target && e.target.tagName === 'IMG' && e.target.closest('.g-shot, .lb-frame')) e.preventDefault();
  });

  // ── boot ──
  // The drawer's colours come from the main site's theme; everything else on
  // this page comes from the gallery's own settings, which arrive with the
  // catalogue.
  // get-content is THIS site's, same-origin: it also brings this site's
  // favicon and whose Discord avatar marks the drawer.
  fetch('/.netlify/functions/get-content')
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d) return;
      if (d.theme && window.__applyNavTheme) window.__applyNavTheme(d.theme);
      // Same rule as the main page: the admin's favicon, else /favicon.png.
      const fav = d.features && typeof d.features.faviconUrl === 'string' ? d.features.faviconUrl.trim() : '';
      const setIcon = (href) => {
        document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((l) => {
          if (l.getAttribute('href') === href) return;
          const n = document.createElement('link'); n.rel = l.rel; n.href = href; l.replaceWith(n);
        });
        try { if (href !== '/favicon.png?v=3') localStorage.setItem('faviconCache', href); else localStorage.removeItem('faviconCache'); } catch (e) {}
      };
      // A custom favicon only if it really loads as an image.
      if (fav) { const probe = new Image(); probe.onload = () => setIcon(fav); probe.onerror = () => setIcon('/favicon.png?v=3'); probe.src = fav; }
      else setIcon('/favicon.png?v=3');
      if (typeof d.discordUserId === 'string' && /^\d{15,25}$/.test(d.discordUserId)) syncNavAvatar(d.discordUserId);
    })
    .catch(() => {});
  // The drawer's mark is this site owner's Discord avatar, live from Lanyard —
  // the same ?size=256 URL the main page builds and caches.
  function syncNavAvatar(id){
    fetch('https://api.lanyard.rest/v1/users/' + id)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        const u = j && j.success && j.data && j.data.discord_user;
        if (!u || !u.avatar) return;
        const url = 'https://cdn.discordapp.com/avatars/' + id + '/' + u.avatar + '.' + (u.avatar.startsWith('a_') ? 'gif' : 'png') + '?size=256';
        const mark = document.getElementById('navSideAvatar');
        if (mark && mark.src !== url) { mark.style.visibility = ''; mark.src = url; }
        try { localStorage.setItem('avatarUrlCache', url); } catch (e) {}
      })
      .catch(() => {});
  }
  load();
})();
</script>

</body>
</html>
