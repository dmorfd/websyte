<!DOCTYPE html>
<!-- The background is set HERE, as an attribute, and not only in the
     stylesheet below. The Google Fonts <link> further down is a render-blocking
     external stylesheet, and the inline <style> after it is blocked with it —
     so until that request returns the browser paints its own default canvas,
     which is white. An attribute on <html> applies before any of that. -->
<html lang="en" style="background:#000">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery</title>
  <link rel="icon" type="image/png" href="/favicon.png?v=3"/>
  <link rel="apple-touch-icon" href="/favicon.png?v=3"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <!-- The shared gallery lives on arandomperson.dev: its API and its photos. -->
  <link rel="preconnect" href="https://arandomperson.dev" crossorigin/>
  <link rel="preconnect" href="https://pub-3713ba218b584c05bc9be30b5f262c25.r2.dev"/>
  <!-- Runs before the stylesheet so the colours this device saw last time are
       already in place before anything is drawn. -->
  <script>
    try {
      // This site's favicon (Admin → Settings), as cached by the main page.
      var __fav = localStorage.getItem('faviconCache');
      if (__fav && __fav !== '/favicon.png') document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(function (l) { l.removeAttribute('type'); l.href = __fav; });

      // Replay the last-seen theme as inline styles on <html>. Inline styles
      // outrank the stylesheet whatever the document order, so no ordering
      // tricks are needed — and without this the page paints stock colours and
      // then snaps to the real ones, which reads as a flash.
      var __gt = JSON.parse(localStorage.getItem('galleryThemeCache') || 'null');
      if (__gt && typeof __gt === 'object') {
        for (var __k in __gt) {
          if (__k.charAt(0) === '-' && typeof __gt[__k] === 'string') {
            document.documentElement.style.setProperty(__k, __gt[__k]);
          }
        }
        document.documentElement.classList.add('theme-ready');
        // The attribute above is the cold default; this is the colour THIS
        // device actually saw last time.
        // Deliberately NOT replayed onto <html>: the first thing drawn is the
        // loading screen, which is black. Painting the gallery's background
        // colour here showed through as grey until the loader covered it.
        // And the title's font face, so the loading screen is already wearing
        // it on first paint instead of swapping a second later. Injected from
        // cache because the real settings do not arrive until a fetch returns,
        // by which time the loading screen has been on display for a while.
        if (typeof __gt.__fontUrl === 'string' && __gt.__fontUrl && typeof __gt.__fontFamily === 'string' && __gt.__fontFamily) {
          var __ext = (__gt.__fontUrl.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
          var __fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[__ext];
          var __st = document.createElement('style');
          __st.id = 'galFontFace';
          __st.textContent = '@font-face{font-family:"' + __gt.__fontFamily + '";'
            + 'src:url("' + __gt.__fontUrl.replace(/"/g, '%22') + '")' + (__fmt ? ' format("' + __fmt + '")' : '') + ';'
            + 'font-display:swap;font-weight:100 900;}';
          document.head.appendChild(__st);
          var __pre = document.createElement('link');
          __pre.rel = 'preload'; __pre.as = 'font'; __pre.type = 'font/' + (__ext || 'woff2');
          __pre.crossOrigin = 'anonymous'; __pre.href = __gt.__fontUrl;
          document.head.appendChild(__pre);
        }
      }
    } catch (e) {}
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Noto+Serif+JP:wght@400;600;900&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}

    /* Every colour is a variable written at runtime from the Gallery Editor.
       The values here are only what a cold, offline first paint falls back to. */
    :root{
      --g-bg1:#1a0f12; --g-bg2:#0b090a;
      --g-accent1:#d7263d; --g-accent2:#e3b04b;
      --g-text:#f3ece4; --g-muted:#a89a90; --g-panel:30,20,23;
      --g-glass:.55;
      --g-tile-min:290px;
      --g-title-font:'Noto Serif JP',serif;
      --g-title-c1:#d7263d; --g-title-c2:#e3b04b; --g-title-angle:135deg;
      /* The plate behind the heading, and the one behind the description:
         a radius and how far up the wash has come. Both 0 means neither
         exists, which is the default a gallery has always had. */
      --g-title-blur:0px; --g-title-plate:0;
      --g-desc-blur:0px;  --g-desc-plate:0; --g-desc-color:var(--g-muted);
      --g-title-scale:1;
      /* The glow under a photo. Falls back to the first title accent, which is
         what it was before it became adjustable. */
      --g-tile-glow:var(--g-accent1);
      /* The sound player's own pair. Declared here rather than on .g-player so
         the Gallery Editor can override it the same way it overrides every
         other colour — a value set on the element itself would always win. */
      --gp-c1:var(--acc-title-1); --gp-c2:var(--acc-title-2);
      /* And its trim, its glass and its song-title face. Each falls through to
         the next rather than to a literal, so pinning one does not strand the
         others: the trim follows the player, the player follows the gallery. */
      --gp-acc1:var(--gp-c1); --gp-acc2:var(--gp-c2);
      --gp-tint:var(--g-panel); --gp-tint-a:.72; --gp-panel:1;
      --gp-glass:blur(18px) saturate(1.25);
      --acc-title-1:#d7263d; --acc-title-2:#e3b04b;
      --acc-date-1:#d7263d;  --acc-date-2:#e3b04b;
      --acc-cmt-1:#d7263d;   --acc-cmt-2:#e3b04b;
      --nav-bg:13,4,8; --nav-accent:220,100,120; --nav-accent2:212,168,75; --nav-alpha:.9;
    }

    html{scroll-behavior:smooth;}
    body{
      min-height:100vh;color:var(--g-text);
      font-family:'DM Sans',system-ui,sans-serif;
      /* DELIBERATELY TRANSPARENT, and this is load-bearing.
         body's background is normally lifted onto the canvas, where it paints
         beneath everything — but ONLY while the root element has none. <html>
         carries style="background:#000" (see the note at the top of the file),
         so that lift no longer happens and a background here would paint as an
         ordinary block box: above every negative z-index layer, which is all
         three of .g-bg, .g-video and .g-tint. That is what buried the video
         background under a flat grey wash. The colour behind the page is the
         root's, and the gradient is .g-bg's job. */
      background:transparent;
      overflow-x:clip;
      -webkit-font-smoothing:antialiased;
    }
    body.overlay-lock{overflow:hidden;}
    @media (max-width:640px){ body.nav-open{overflow:hidden;} }
    img{max-width:100%;}
    button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;}
    ::selection{background:var(--g-accent1);color:#fff;}
    input::placeholder,textarea::placeholder{color:rgba(243,236,228,.35);}

    @keyframes gFade{from{opacity:0}to{opacity:1}}
    @keyframes gPop{0%{opacity:0;transform:translateY(-14px) scale(.92)}60%{opacity:1;transform:translateY(2px) scale(1.015)}100%{opacity:1;transform:none}}
    @keyframes gRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
    @keyframes lbIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
    @keyframes gPulse{0%,100%{opacity:.45}50%{opacity:1}}

    /* ── BACKGROUND ── */
    .g-bg{
      position:fixed;inset:0;z-index:-3;
      background:
        radial-gradient(1100px 620px at 8% -8%, color-mix(in oklch, var(--g-accent1) 24%, transparent), transparent 62%),
        radial-gradient(900px 520px at 105% 18%, color-mix(in oklch, var(--g-accent2) 12%, transparent), transparent 60%),
        radial-gradient(1200px 700px at 50% 120%, color-mix(in oklch, var(--g-accent1) 10%, transparent), transparent 60%),
        linear-gradient(180deg, var(--g-bg1), var(--g-bg2) 55%);
      opacity:0;transition:opacity .5s ease;
    }
    html.theme-ready .g-bg{opacity:1;}
    .g-video{position:fixed;inset:0;z-index:-2;width:100%;height:100%;object-fit:cover;pointer-events:none;opacity:0;transition:opacity 1s ease;display:none;}
    .g-video.on{display:block;opacity:1;}
    /* The wash over the video. Only drawn while a video is actually playing —
       tinting a gradient that is already the owner's chosen colour is noise. */
    .g-tint{position:fixed;inset:0;z-index:-1;pointer-events:none;display:none;}
    .g-tint.on{display:block;}
    /* Particles sit above the background and below everything readable. */
    /* width/height are NOT redundant with inset:0 here. A <canvas> is a
       replaced element with an intrinsic 300x150, and for replaced elements
       inset:0 with auto width resolves to the intrinsic size rather than to
       the containing block — which is why the particles were piling up in the
       top-left corner. A <div> would have stretched; this will not. */
    .g-fx{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;display:none;}

    /* ── TOP BAR ── */
    .g-top{
      /* Tall enough to contain the 42px burger with room either side, so the
         button sits INSIDE the bar instead of hanging below its edge. */
      position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
      min-height:68px;
      padding:14px clamp(16px,4vw,48px) 14px 80px;
      background:linear-gradient(180deg, rgba(11,9,10,.85), rgba(11,9,10,.55));
      backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
      border-bottom:1px solid rgba(255,255,255,.05);
      font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.08em;color:var(--g-muted);white-space:nowrap;
    }
    .g-top b{color:var(--g-accent1);font-weight:400;}
    .g-top i{color:rgba(255,255,255,.2);font-style:normal;}
    .g-top em{color:var(--g-text);font-style:normal;}

    /* ── HERO ── */
    .g-hero{position:relative;z-index:1;padding:clamp(48px,8vw,104px) clamp(16px,4vw,48px) clamp(36px,6vw,64px);max-width:1440px;margin:0 auto;}
    .g-eyebrow{font-family:'Noto Serif JP',serif;font-weight:600;font-size:clamp(17px,2vw,22px);letter-spacing:.3em;color:var(--g-accent1);margin-bottom:14px;}
    .g-title{
      margin:0;font-family:var(--g-title-font);font-weight:900;
      /* Smaller on a phone. 8.5vw on a 390px screen gave 46px — the clamp floor —
         for a word that then filled the width edge to edge.
         The owner's size setting MULTIPLIES this rather than replacing it: an
         absolute px chosen on a desktop would overflow a phone, which is the
         exact problem the clamp was added to solve. */
      font-size:calc(clamp(34px,8.5vw,116px) * var(--g-title-scale));
      line-height:.95;letter-spacing:-.02em;text-wrap:balance;
      background:linear-gradient(var(--g-title-angle), var(--g-title-c1), var(--g-title-c2));
      -webkit-background-clip:text;background-clip:text;
      -webkit-text-fill-color:transparent;color:transparent;
      position:relative;
    }
    /* THE PLATE BEHIND THE HEADING.
       The slider is its blur radius, and the dark wash rises with it — because
       a backdrop blur on its own is invisible over a smooth gradient: there is
       nothing in a gradient for a blur to move. Over a video it is the blur
       that does the work and the wash that keeps it from going muddy. At 0
       there is no plate at all, whatever is behind the page. */
    .g-titlewrap{position:relative;display:inline-block;}
    .g-titlewrap::before{
      content:'';position:absolute;inset:-16% -9%;z-index:-1;pointer-events:none;
      border-radius:34px;
      opacity:var(--g-title-plate);
      backdrop-filter:blur(var(--g-title-blur));-webkit-backdrop-filter:blur(var(--g-title-blur));
      background:radial-gradient(62% 74% at 42% 50%, rgba(0,0,0,.46), transparent 78%);
      transition:opacity .45s ease;
    }
    /* ── THE PLAYER ──
       Centred under the accent rule. A console rather than a widget: a hairline
       of trim across the top, bracketed corners, a monospace header row, and a
       ring around the play button that IS the progress. Four colour settings
       feed it and each falls through to the next rather than to a literal, so a
       gallery that pins none of them still looks like itself:

         --gp-acc1/2  the top hairline   →  --gp-c1/2  →  --acc-title-1/2
         --gp-tint    the glass itself   →  --g-panel
         --gp-font    the song title     →  the page's display serif

       --gp-panel is a 1-or-0 switch, not a fade: it is 0 only when the panel's
       opacity is set to 0, and it zeroes EVERY part of the panel rather than
       the fill alone. A fill at zero with the border, the shadow, the blur and
       the corner brackets still drawn is not invisible, it is an empty frame —
       which is what "0 and still there" looked like. It multiplies the panel's
       pieces instead of gating them in a separate rule so that at any other
       value every one of them is exactly what it was.

       Three rows: the header, the artwork/title/transport, and the scrubber. */
    .g-player{
      position:relative;box-sizing:border-box;
      /* Below the rule, centred in the hero. The bottom margin is the player's
         own, so with it switched off (display:none) the rule's spacing to the
         description below is exactly what it always was. */
      margin:0 auto 28px;max-width:780px;width:100%;
      padding:22px 28px;
      /* Glass, in whatever colour it has been given. Two stops rather than one
         so the panel has a direction to it — the lower edge sits heavier. The
         lower stop's extra is multiplied too, or a panel at 0 would still be
         carrying a tenth of a wash along its bottom edge. */
      background:linear-gradient(180deg,
        rgba(var(--gp-tint), var(--gp-tint-a)),
        rgba(var(--gp-tint), calc(var(--gp-tint-a) + .1 * var(--gp-panel))));
      /* A whole value rather than blur(calc(0px)): an identity backdrop-filter
         is not the same as no backdrop-filter. It still forces the backdrop
         through a compositing pass, and that pass came back a couple of levels
         off across the entire area — invisible to the eye, but the page behind
         a panel that is supposed to be gone was measurably not the page. */
      backdrop-filter:var(--gp-glass);-webkit-backdrop-filter:var(--gp-glass);
      border:1px solid color-mix(in oklch, var(--gp-c1) calc(16% * var(--gp-panel)), transparent);
      border-radius:6px;
      box-shadow:0 30px 80px -20px rgba(0,0,0,calc(.7 * var(--gp-panel))),
                 inset 0 1px 0 rgba(255,255,255,calc(.04 * var(--gp-panel)));
      font-family:'Share Tech Mono',monospace;
      color:var(--g-text);
    }
    /* The trim. Inset from the corners so it reads as a highlight catching the
       top edge rather than as a second border. */
    .g-player::before{
      content:'';position:absolute;top:-1px;left:28px;right:28px;height:1px;pointer-events:none;
      opacity:var(--gp-panel);
      background:linear-gradient(90deg, transparent, var(--gp-acc1) 30%, var(--gp-acc2) 70%, transparent);
    }
    /* The glow it sits in. Behind everything, opacity-only so the breathing
       while a track plays costs a composite and nothing else. */
    .g-player::after{
      content:'';position:absolute;inset:-1px;z-index:-1;border-radius:inherit;pointer-events:none;
      background:radial-gradient(130% 150% at 12% 0%, color-mix(in oklch, var(--gp-c1) calc(26% * var(--gp-panel)), transparent), transparent 64%);
      opacity:0;transition:opacity .6s ease;
    }
    .g-player.is-playing::after{opacity:1;animation:gpBreathe 5.4s ease-in-out infinite;}
    @keyframes gpBreathe{0%,100%{opacity:.55;}50%{opacity:1;}}
    /* With the page's glass switched off the panel is solid — but "solid" has
       to mean solid at the chosen opacity, not regardless of it, or turning the
       panel off here would quietly turn it back on. */
    html[data-gglass="off"] .g-player{
      backdrop-filter:none;-webkit-backdrop-filter:none;
      background:rgba(var(--gp-tint), var(--gp-panel));
    }
    .g-player[hidden]{display:none;}

    /* The bracketed corners. Four of them, drawn as elements rather than
       pseudo-elements because ::before and ::after are already spoken for. */
    .g-pc{position:absolute;width:10px;height:10px;pointer-events:none;
      border-color:color-mix(in oklch, var(--gp-c1) calc(50% * var(--gp-panel)), transparent);border-style:solid;border-width:0;}
    .g-pc.tl{top:10px;left:10px;border-top-width:1px;border-left-width:1px;}
    .g-pc.tr{top:10px;right:10px;border-top-width:1px;border-right-width:1px;}
    .g-pc.bl{bottom:10px;left:10px;border-bottom-width:1px;border-left-width:1px;}
    .g-pc.br{bottom:10px;right:10px;border-bottom-width:1px;border-right-width:1px;}

    /* ── header row ── */
    .g-player-head{
      display:flex;align-items:center;gap:12px;
      font-size:10px;letter-spacing:.32em;text-transform:uppercase;color:var(--g-muted);
    }
    .g-player-state{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .g-player-hr{flex:1;min-width:12px;height:1px;
      background:linear-gradient(90deg, color-mix(in oklch, var(--gp-c1) 35%, transparent), transparent);}
    .g-player-count{flex:none;color:color-mix(in oklch, var(--g-muted) 70%, transparent);font-variant-numeric:tabular-nums;}

    /* ── what is playing, and the transport ── */
    .g-player-top{display:flex;align-items:center;gap:20px;margin-top:18px;flex-wrap:wrap;}
    .g-player-art{position:relative;width:72px;height:72px;flex:none;border-radius:3px;overflow:hidden;
      box-shadow:0 0 0 1px rgba(255,255,255,.08), 0 10px 30px -6px color-mix(in oklch, var(--gp-c1) 55%, transparent);}
    .g-player-art[hidden]{display:none;}
    .g-player-cover{width:100%;height:100%;object-fit:cover;display:block;background:rgba(255,255,255,.04);}
    .g-player-mid{flex:1;min-width:180px;display:flex;flex-direction:column;gap:6px;}
    .g-player-title{
      font-family:var(--gp-font, 'Noto Serif JP',serif);
      font-weight:800;font-size:24px;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      background:linear-gradient(95deg, var(--gp-c1), var(--gp-c2));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;
    }
    .g-player-byline{display:flex;align-items:center;gap:10px;min-width:0;}
    .g-player-dash{flex:none;width:8px;height:1px;background:var(--gp-c2);}
    .g-player-artist{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--g-muted);
      overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

    .g-player-btns{display:flex;align-items:center;gap:6px;flex:none;}
    .g-player-btn{
      width:40px;height:40px;display:grid;place-items:center;
      background:none;border:none;border-radius:50%;color:var(--g-muted);cursor:pointer;
      transition:color .2s, background .2s, transform .16s cubic-bezier(.2,.8,.25,1);
    }
    .g-player-btn.skip{color:color-mix(in oklch, var(--g-text) 78%, transparent);}
    .g-player-btn:active{transform:scale(.9);}
    @media (hover:hover){
      .g-player-btn:hover{color:var(--g-text);background:rgba(255,255,255,.05);}
    }

    /* The ring IS the progress bar's twin — same number, drawn twice, so the
       eye can read it from the button it is about to press. */
    .g-player-ringwrap{position:relative;width:64px;height:64px;margin:0 6px;flex:none;}
    .g-player-ringglow{
      position:absolute;inset:-10px;border-radius:50%;pointer-events:none;opacity:.35;
      background:radial-gradient(circle, color-mix(in oklch, var(--gp-c1) 55%, transparent), transparent 70%);
    }
    .g-player.is-playing .g-player-ringglow{animation:gpPulse 2.4s ease-in-out infinite;}
    @keyframes gpPulse{0%,100%{opacity:.35;transform:scale(1);}50%{opacity:.7;transform:scale(1.12);}}
    .g-player-ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none;}
    .g-player-ring .trk{fill:none;stroke:rgba(255,255,255,.1);stroke-width:1.5;}
    .g-player-ring .bar{fill:none;stroke:url(#galPlayerRingGrad);stroke-width:2;stroke-linecap:round;
      stroke-dasharray:188.5;stroke-dashoffset:188.5;transition:stroke-dashoffset .18s linear;}
    #galPlayerRingA{stop-color:var(--gp-c1);}
    #galPlayerRingB{stop-color:var(--gp-c2);}
    .g-player-play{
      position:absolute;top:8px;left:8px;width:48px;height:48px;padding:0;margin:0;
      border:none;border-radius:50%;display:flex;align-items:center;justify-content:center;
      cursor:pointer;color:#16111f;background:#f3eeff;
      box-shadow:0 6px 24px -4px color-mix(in oklch, var(--gp-c1) 70%, transparent),
                 inset 0 -2px 6px rgba(0,0,0,.18);
      transition:transform .15s cubic-bezier(.2,.8,.25,1), box-shadow .22s, filter .22s;
    }
    .g-player-play svg{display:block;transform:translateX(1px);}  /* optically centre the triangle */
    .g-player-play[data-playing] svg{transform:none;}             /* the pause bars are symmetric */
    .g-player-play:active{transform:scale(.95);}
    @media (hover:hover){
      .g-player-play:hover{transform:scale(1.06);filter:brightness(1.04);
        box-shadow:0 10px 30px -4px color-mix(in oklch, var(--gp-c1) 85%, transparent),
                   inset 0 -2px 6px rgba(0,0,0,.18);}
    }

    /* ── the scrubber ── */
    .g-player-foot{display:flex;align-items:center;gap:16px;margin-top:20px;}
    .g-player-time{
      flex:none;min-width:42px;font-size:12px;color:var(--g-text);
      font-variant-numeric:tabular-nums;user-select:none;
    }
    .g-player-time.right{text-align:right;color:var(--g-muted);}
    /* A tall, thin hit area: the rail is 2px but an 18px band is what a thumb
       can actually catch. */
    .g-player-bar{
      position:relative;flex:1;min-width:0;height:18px;
      display:flex;align-items:center;cursor:pointer;touch-action:none;
    }
    .g-player-track{position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.09);}
    /* Film-strip ticks. Decoration, but the thing that makes the rail read as
       a length rather than as a slider. */
    .g-player-ticks{position:absolute;left:0;right:0;top:3px;height:12px;opacity:.6;pointer-events:none;
      background:repeating-linear-gradient(90deg, rgba(255,255,255,.12) 0 1px, transparent 1px 10%);}
    .g-player-fill{position:absolute;left:0;height:2px;width:0%;
      background:linear-gradient(90deg, var(--gp-c1), var(--gp-c2));
      box-shadow:0 0 12px color-mix(in oklch, var(--gp-c2) 70%, transparent);}
    .g-player-thumb{
      position:absolute;left:0%;width:12px;height:12px;margin-left:-6px;border-radius:50%;
      background:#fff;pointer-events:none;
      box-shadow:0 0 0 3px color-mix(in oklch, var(--gp-c1) 35%, transparent),
                 0 0 14px color-mix(in oklch, var(--gp-c2) 70%, transparent);
    }

    /* The breathing glow and the pulsing ring are decoration; the colours and
       the layout are not, so only the motion goes. */
    @media (prefers-reduced-motion: reduce){
      .g-player.is-playing::after,
      .g-player.is-playing .g-player-ringglow{animation:none;}
      .g-player-play, .g-player-btn{transition:none;}
      .g-player-ring .bar{transition:none;}
    }
    @media (max-width:720px){
      .g-player{padding:16px 16px 18px;}
      .g-player::before{left:16px;right:16px;}
      .g-player-top{gap:14px;margin-top:14px;}
      .g-player-art{width:56px;height:56px;}
      .g-player-mid{min-width:120px;}
      .g-player-title{font-size:19px;}
      /* The ±10s pair is the first thing to go: on a phone the five buttons
         crowd the title off its own line, and skipping tracks matters more
         than scrubbing by ten seconds when a rail is right there. */
      .g-player-btn.skip{display:none;}
      .g-player-foot{gap:10px;margin-top:16px;}
      .g-player-time{min-width:38px;font-size:11px;}
    }
    @media (max-width:420px){
      .g-player-btns{width:100%;justify-content:center;}
    }


    .g-rule{height:2px;margin:26px 0;max-width:520px;border-radius:2px;
      background:linear-gradient(90deg, var(--acc-title-1), var(--acc-title-2) 60%, transparent);}
    .g-herofoot{display:flex;flex-wrap:wrap;gap:22px 48px;align-items:flex-end;justify-content:space-between;}
    .g-desc{position:relative;margin:0;max-width:520px;font-size:17px;line-height:1.65;color:var(--g-desc-color);text-wrap:pretty;}
    /* The same plate, behind the description. A pseudo-element rather than a
       backdrop-filter on the <p> itself, so the blur can bleed past the text
       block instead of stopping on a hard rectangle at the edge of the line box. */
    .g-desc::before{
      content:'';position:absolute;inset:-14px -20px;z-index:-1;pointer-events:none;
      border-radius:20px;
      opacity:var(--g-desc-plate);
      backdrop-filter:blur(var(--g-desc-blur));-webkit-backdrop-filter:blur(var(--g-desc-blur));
      background:radial-gradient(72% 92% at 32% 50%, rgba(0,0,0,.42), transparent 82%);
      transition:opacity .45s ease;
    }
    .g-stat{display:flex;flex-direction:column;gap:4px;}
    .g-stat b{font-family:'Noto Serif JP',serif;font-size:40px;font-weight:600;line-height:1;color:var(--g-text);}
    .g-stat span{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.18em;color:var(--g-muted);text-transform:uppercase;}

    /* ── SECTIONS ── */
    .g-main{position:relative;z-index:1;max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,48px) 110px;display:flex;flex-direction:column;gap:clamp(56px,8vw,96px);}
    .g-sec-head{display:flex;align-items:flex-end;gap:20px;margin-bottom:26px;flex-wrap:wrap;}
    .g-sec-num{font-family:'Share Tech Mono',monospace;font-size:14px;color:var(--g-accent2);padding-bottom:8px;}
    .g-sec-names{display:flex;flex-direction:column;gap:6px;min-width:0;}
    .g-sec-jp{font-family:'Noto Serif JP',serif;font-size:13px;color:var(--g-accent1);letter-spacing:.12em;}
    .g-sec-jp:empty{display:none;}
    .g-sec-name{margin:0;font-family:'Noto Serif JP',serif;font-weight:600;font-size:clamp(26px,3.4vw,40px);line-height:1.1;text-wrap:balance;}
    .g-sec-line{flex:1 1 80px;height:1px;margin-bottom:14px;background:linear-gradient(90deg, rgba(255,255,255,.14), transparent);}
    .g-sec-count{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.16em;color:var(--g-muted);padding-bottom:8px;text-transform:uppercase;}

    .g-grid{display:grid;grid-template-columns:repeat(auto-fill, minmax(min(100%, var(--g-tile-min)), 1fr));gap:clamp(14px,1.6vw,22px);}
    .g-tile{
      position:relative;display:flex;flex-direction:column;width:100%;text-align:left;
      border-radius:16px;overflow:hidden;cursor:pointer;
      background:rgba(var(--g-panel), var(--g-glass));
      backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      border:1px solid rgba(255,255,255,.07);
      box-shadow:0 1px 0 rgba(255,255,255,.04) inset;
      transition:transform .45s cubic-bezier(.2,.7,.2,1), border-color .3s, box-shadow .45s;
    }
    /* The glass can be switched off entirely, which makes the strip beneath a
       photo a solid panel rather than a pane you can see the page through. */
    html[data-gglass="off"] .g-tile{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgb(var(--g-panel));}
    .g-tile:hover,.g-tile:focus-visible{
      transform:translateY(-6px);outline:none;
      border-color:color-mix(in oklch, var(--g-tile-glow) 55%, transparent);
      box-shadow:0 28px 50px -24px color-mix(in oklch, var(--g-tile-glow) 60%, transparent), 0 1px 0 rgba(255,255,255,.06) inset;
    }
    .g-shot{position:relative;aspect-ratio:4/3;overflow:hidden;background:rgba(255,255,255,.035);}
    .g-shot img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .5s cubic-bezier(.2,.8,.2,1);
      -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;}
    .g-tile:hover .g-shot img{transform:scale(1.045);}
    .g-shot::after{content:'';position:absolute;inset:auto 0 0 0;height:40%;background:linear-gradient(0deg, rgba(0,0,0,.5), transparent);pointer-events:none;}
    .g-shot.broken::before{
      content:'image unavailable';position:absolute;inset:0;z-index:1;
      display:flex;align-items:center;justify-content:center;
      font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:rgba(255,255,255,.3);
    }
    .g-cap{display:flex;flex-direction:column;gap:8px;padding:14px 16px 16px;}
    /* THE TITLE ON A PHOTOGRAPH, here and in the expanded view below.
       --g-img-font is only DECLARED when a face has actually been configured,
       so each of the two rules keeps its own fallback: the caption inherits
       the page's sans, the expanded heading stays on the serif it was
       designed in. That is why these use var() with a fallback rather than a
       variable that always holds something. */
    .g-cap-title{font-family:var(--g-img-font, inherit);font-size:15px;font-weight:600;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .g-cap-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--g-muted);}
    /* WHO TOOK IT. Deliberately its own element and NOT inside .g-cap-meta:
       a test reads the tile's date as that row's first span, so a credit put in
       front of the date there would leave the assertion passing while quietly
       checking the wrong thing. Outside the row, neither can be mistaken for
       the other. */
    .g-cap-by{display:flex;align-items:center;gap:7px;min-width:0;}
    .g-cap-by img{width:18px;height:18px;border-radius:50%;flex:0 0 18px;object-fit:cover;}
    .g-cap-by span{font-size:11.5px;letter-spacing:.02em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
      background-image:linear-gradient(90deg,var(--acc-cmt-1),var(--acc-cmt-2));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    /* The expanded view has room for a face and a full name. */
    .lb-by{display:flex;align-items:center;gap:9px;margin-top:2px;}
    .lb-by-name{font-size:13px;font-weight:600;
      background-image:linear-gradient(90deg,var(--acc-cmt-1),var(--acc-cmt-2));
      -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;}
    .lb-by-label{font-family:'Share Tech Mono',monospace;font-size:10.5px;letter-spacing:.14em;
      text-transform:uppercase;color:var(--g-muted);}
    .g-counts{display:flex;align-items:center;gap:12px;}
    .g-count{display:flex;align-items:center;gap:5px;}

    .g-state{text-align:center;padding:clamp(64px,10vw,110px) 24px;display:flex;flex-direction:column;align-items:center;gap:14px;}
    .g-state .bar{width:48px;height:2px;border-radius:2px;background:var(--g-accent1);}
    .g-state .msg{font-family:'Noto Serif JP',serif;font-size:clamp(24px,3vw,32px);font-weight:600;text-wrap:balance;}

    .g-foot{position:relative;z-index:1;border-top:1px solid rgba(255,255,255,.05);padding:26px clamp(16px,4vw,48px);
      font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--g-muted);}

    /* ── REVEAL ──
       Nothing is shown until every photo has been fetched, then they cascade
       in from the top. --d is the per-tile delay, set in JS from position. */
    #galSections.staging{opacity:0;pointer-events:none;}
    #galSections.revealed .g-section{animation:gRise .6s cubic-bezier(.22,1,.36,1) both;animation-delay:var(--d,0ms);}
    #galSections.revealed .g-tile{animation:gPop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms);}

    /* ── LOADER ── */
    .g-loader{
      /* Deliberately NOT var(--g-bg2). The gallery's own background is a dark
         colour rather than black, and full-screen behind nothing else it reads
         as a grey wash. The loading screen is its own moment and is black. */
      position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;
      background:#000;
      transition:opacity .85s cubic-bezier(.4,0,.2,1), visibility 0s linear .85s;
    }
    .g-loader.done{opacity:0;visibility:hidden;}
    /* The inner block drifts up slightly as it goes, so the hand-off reads as
       a curtain lifting rather than a layer being switched off. */
    .g-loader.done .g-loader-in{transform:translateY(-12px);opacity:0;transition:transform .85s cubic-bezier(.4,0,.2,1), opacity .5s ease;}
    .g-loader-in{transition:transform .85s cubic-bezier(.4,0,.2,1), opacity .5s ease;}
    .g-loader-in{display:flex;flex-direction:column;align-items:center;gap:14px;width:min(280px,80vw);}
    .g-loader-jp{font-family:'Noto Serif JP',serif;font-weight:600;font-size:20px;letter-spacing:.3em;color:var(--g-accent1);}
    /* The same face and the same tracking as .g-title, deliberately: the
       loading screen is the first sight of the gallery's name, and a different
       typeface there makes the reveal read as two different pages. The face
       itself is replayed from cache in the boot script, so it is already on
       before the first paint rather than swapping in a second later. */
    .g-loader-t{font-family:var(--g-title-font);font-weight:900;font-size:36px;line-height:1;letter-spacing:-.02em;color:var(--g-text);text-align:center;}
    .g-loader-track{width:100%;height:2px;margin-top:16px;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden;}
    .g-loader-fill{height:100%;width:0%;background:var(--g-accent1);transition:width .25s cubic-bezier(.4,0,.2,1);}
    .g-loader-nums{width:100%;display:flex;justify-content:space-between;font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.14em;color:var(--g-muted);text-transform:uppercase;}

    /* ══════════ NAV DRAWER ══════════ */
    .nav-burger{
      /* 13px centres it in the 68px bar. */
      position:fixed;top:13px;left:1.25rem;z-index:300;
      width:42px;height:42px;border-radius:8px;
      background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);
      backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
      cursor:pointer;transition:border-color .25s,box-shadow .25s,background .25s;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-burger span{display:block;width:18px;height:1.5px;border-radius:2px;background:rgba(255,255,255,.88);
      box-shadow:0 0 6px rgba(255,255,255,.25);
      transition:transform .3s cubic-bezier(.22,.9,.32,1),opacity .2s,width .25s;}
    .nav-burger:hover{border-color:rgba(255,255,255,.45);box-shadow:0 0 18px rgba(255,255,255,.18);background:rgba(255,255,255,.12);}
    .nav-burger:hover span{width:22px;}
    body.nav-open .nav-burger span:nth-child(1){transform:translateY(6.5px) rotate(45deg);width:20px;}
    body.nav-open .nav-burger span:nth-child(2){opacity:0;transform:scaleX(.2);}
    body.nav-open .nav-burger span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);width:20px;}

    /* The drawer and its scrim are composited, not laid out: transform and
       opacity only, no blur animating, nothing that forces a repaint of the
       page behind it. That is what the old version got wrong. */
    .nav-scrim{
      position:fixed;inset:0;z-index:275;background:rgba(8,2,5,.55);
      opacity:0;visibility:hidden;
      transition:opacity .34s cubic-bezier(.4,0,.2,1), visibility 0s linear .34s;
      will-change:opacity;
    }
    .nav-scrim.open{opacity:1;visibility:visible;transition:opacity .34s cubic-bezier(.4,0,.2,1), visibility 0s;}
    .nav-side{
      position:fixed;top:0;left:0;bottom:0;z-index:280;
      width:min(274px,80vw);display:flex;flex-direction:column;padding:4.5rem 0 1rem;
      background:rgba(var(--nav-bg,13,4,8),var(--nav-alpha,.9));
      border-right:1px solid rgba(var(--nav-accent,220,100,120),.18);
      box-shadow:22px 0 60px rgba(0,0,0,.45);
      backdrop-filter:blur(16px) saturate(1.25);-webkit-backdrop-filter:blur(16px) saturate(1.25);
      transform:translate3d(-100%,0,0);visibility:hidden;
      transition:transform .34s cubic-bezier(.4,0,.2,1), visibility 0s linear .34s;
      will-change:transform;
      overflow-y:auto;overscroll-behavior:contain;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-side.open{transform:translate3d(0,0,0);visibility:visible;transition:transform .34s cubic-bezier(.4,0,.2,1), visibility 0s;}
    .nav-side-brand{display:flex;align-items:center;gap:.6rem;padding:0 1rem 1rem;border-bottom:1px solid rgba(var(--nav-accent,220,100,120),.14);}
    .nav-side-mark{width:34px;height:34px;flex:0 0 34px;border-radius:9px;overflow:hidden;
      border:1px solid rgba(var(--nav-accent,220,100,120),.28);
      background:linear-gradient(135deg,rgba(var(--nav-accent,192,57,43),.5),rgba(var(--nav-accent2,212,168,75),.35));
      display:flex;align-items:center;justify-content:center;}
    .nav-side-mark img{width:100%;height:100%;object-fit:cover;display:block;}
    .nav-side-brandtext{display:flex;flex-direction:column;gap:.1rem;min-width:0;}
    .nav-side-title{font-family:'Noto Serif JP',serif;font-size:.82rem;font-weight:600;color:rgba(255,235,235,.92);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-side-sub{font-family:'Share Tech Mono',monospace;font-size:.48rem;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,200,210,.34);}
    .nav-options{display:flex;flex-direction:column;gap:.28rem;padding:.9rem .6rem;}
    .nav-option{
      position:relative;display:flex;align-items:center;gap:.55rem;width:100%;
      border:1px solid transparent;border-radius:8px;padding:.56rem .62rem;text-align:left;
      color:rgba(255,235,235,.62);
      transition:background .18s,transform .18s,color .18s,border-color .18s;
      -webkit-tap-highlight-color:transparent;
    }
    .nav-option:hover,.nav-option:focus-visible{color:#fff;background:rgba(255,255,255,.055);border-color:rgba(var(--nav-accent,220,100,120),.22);transform:translateX(3px);}
    .nav-option:focus-visible{outline:none;box-shadow:0 0 0 1px rgba(var(--nav-accent2,212,168,75),.35);}
    .nav-option.is-here{color:#fff;background:rgba(var(--nav-accent,192,57,43),.13);border-color:rgba(var(--nav-accent2,212,168,75),.26);transform:none;}
    .nav-option.is-here .nav-option-num{color:rgba(var(--nav-accent2,240,201,106),.95);}
    .nav-option-num{font-family:'Share Tech Mono',monospace;font-size:.55rem;letter-spacing:.16em;color:rgba(var(--nav-accent2,212,168,75),.5);width:17px;flex:0 0 17px;}
    .nav-option-label{font-family:'Noto Serif JP',serif;font-weight:600;font-size:.9rem;letter-spacing:.03em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .nav-option-sub{margin-left:auto;padding-left:.5rem;font-family:'Share Tech Mono',monospace;font-size:.47rem;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,200,210,.3);white-space:nowrap;}
    .nav-options-divider{height:1px;margin:.38rem .3rem;background:linear-gradient(90deg,transparent,rgba(var(--nav-accent2,212,168,75),.3),transparent);}

    /* ══════════ EXPANDED VIEW ══════════ */
    .lb-scrim{position:fixed;inset:0;z-index:400;display:none;background:rgba(6,4,5,.86);
      backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);overflow-y:auto;}
    .lb-scrim.open{display:block;animation:gFade .3s ease both;}
    .lb{display:flex;flex-wrap:wrap;min-height:100%;animation:lbIn .45s cubic-bezier(.2,.8,.2,1) both;}
    .lb-stage{position:relative;flex:999 1 560px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
      padding:clamp(48px,7vw,80px) clamp(16px,5vw,88px) 32px;}
    .lb-frame{position:relative;width:min(100%, calc((100vh - 190px) * 4 / 3));aspect-ratio:4/3;border-radius:14px;overflow:hidden;
      background:rgba(255,255,255,.03);box-shadow:0 40px 90px -30px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.06);}
    .lb-frame img{width:100%;height:100%;object-fit:contain;display:block;background:#000;
      -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;}
    /* The corner button that takes the photograph to the whole screen. Sits ON
       the image rather than beside it, so the thing it acts on is obvious, and
       fades in on hover where there is a pointer to hover with. */
    .lb-expand{
      position:absolute;top:12px;right:12px;z-index:2;
      width:38px;height:38px;border-radius:11px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      border:1px solid rgba(255,255,255,.16);color:#fff;
      background:rgba(10,8,9,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
      transition:opacity .25s ease, border-color .25s, background .25s, transform .16s cubic-bezier(.2,.8,.25,1);
    }
    .lb-expand:active{transform:scale(.92);}
    @media (hover:hover){
      /* Out of the way until wanted. On a touch screen there is no hover, so
         it stays visible there — a control you cannot reveal is no control. */
      .lb-expand{opacity:0;}
      .lb-frame:hover .lb-expand,
      .lb-expand:focus-visible{opacity:1;}
      .lb-expand:hover{border-color:var(--g-accent1);background:color-mix(in oklch, var(--g-accent1) 40%, rgba(10,8,9,.6));}
    }

    /* ── FULL SCREEN ──
       Its own layer above the expanded view rather than a class on the frame:
       the frame is inside a scrolling column with its own rounding and shadow,
       and growing it in place would have fought all three. */
    .lb-full{
      position:fixed;inset:0;z-index:500;display:none;
      align-items:center;justify-content:center;
      background:rgba(4,3,4,.94);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
    }
    .lb-full.open{display:flex;}
    .lb-full img{
      max-width:90vw;max-height:90vh;width:auto;height:auto;display:block;
      border-radius:10px;box-shadow:0 50px 120px -40px rgba(0,0,0,.95);
      -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
    }
    /* The grow. Starts from where the thumbnail was — the scrim fades while the
       picture scales up out of it, so it reads as the same photograph getting
       bigger rather than a second one appearing. */
    .lb-full.open{animation:gFade .22s ease both;}
    .lb-full.open img{animation:lbFullIn .34s cubic-bezier(.2,.9,.25,1) both;}
    @keyframes lbFullIn{from{opacity:0;transform:scale(.86);}to{opacity:1;transform:none;}}
    .lb-full.closing{animation:gFade .2s ease both reverse;}
    .lb-full.closing img{animation:lbFullIn .2s cubic-bezier(.4,0,.6,1) both reverse;}
    .lb-full-close{
      position:fixed;top:clamp(14px,2.5vw,26px);right:clamp(14px,2.5vw,26px);z-index:2;
      width:46px;height:46px;border-radius:13px;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      font-size:24px;line-height:1;color:var(--g-text);
      border:1px solid rgba(255,255,255,.14);background:rgba(var(--g-panel),.7);
      backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
      transition:border-color .25s, background .25s, transform .16s cubic-bezier(.2,.8,.25,1);
    }
    .lb-full-close:hover{border-color:var(--g-accent1);background:color-mix(in oklch, var(--g-accent1) 22%, rgba(0,0,0,.6));}
    .lb-full-close:active{transform:scale(.92);}
    .lb-full-hint{
      position:fixed;left:0;right:0;bottom:clamp(14px,3vw,30px);text-align:center;
      font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.16em;
      text-transform:uppercase;color:rgba(243,236,228,.38);pointer-events:none;
    }
    @media (prefers-reduced-motion: reduce){
      .lb-full.open, .lb-full.open img, .lb-full.closing, .lb-full.closing img{animation:none;}
      .lb-expand{transition:none;}
    }
    .lb-nav{display:flex;align-items:center;gap:16px;}
    .lb-arrow{width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.12);
      background:rgba(var(--g-panel),var(--g-glass));color:var(--g-text);
      display:flex;align-items:center;justify-content:center;transition:border-color .25s,background .25s,opacity .25s;}
    .lb-arrow:hover:not([disabled]){border-color:var(--g-accent1);background:color-mix(in oklch, var(--g-accent1) 25%, transparent);}
    .lb-arrow[disabled]{opacity:.3;cursor:default;}
    .lb-pos{font-family:'Share Tech Mono',monospace;font-size:13px;letter-spacing:.12em;color:var(--g-muted);min-width:72px;text-align:center;}

    .lb-hint{font-family:'Share Tech Mono',monospace;font-size:11px;letter-spacing:.14em;color:rgba(243,236,228,.4);}

    .lb-side{flex:1 1 380px;min-width:0;display:flex;flex-direction:column;gap:22px;

    .lb-close{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid rgba(255,255,255,.1);

    .lb-rule{height:1px;background:linear-gradient(90deg, var(--acc-date-1), var(--acc-date-2) 50%, transparent);}
    .lb-desc{margin:0;font-size:15px;line-height:1.7;color:rgba(243,236,228,.82);text-wrap:pretty;white-space:pre-wrap;}

    .lb-react{display:flex;align-items:center;gap:10px;}
    .lb-like{display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:999px;

    .lb-like.on{border-color:var(--g-accent1);color:var(--g-accent1);background:color-mix(in oklch, var(--g-accent1) 14%, transparent);}

    .lb-cmtcount{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.08em;color:var(--g-muted);display:flex;align-items:center;gap:7px;}

    .lb-cmts{display:flex;flex-direction:column;gap:14px;}
    .lb-cmts-h{font-family:'Share Tech Mono',monospace;font-size:12px;letter-spacing:.18em;color:var(--g-muted);text-transform:uppercase;}
    /* The list needed room between entries — stacked blocks with no gap read
       as one wall of text, which is what the screenshot showed. */
    #lbCmtList{display:flex;flex-direction:column;gap:18px;}
    .lb-cmt{display:flex;gap:14px;animation:gFade .4s ease both;}
    .lb-cmt-rail{flex:none;width:2px;border-radius:2px;background:linear-gradient(180deg, var(--acc-cmt-1), var(--acc-cmt-2));}

    .lb-cmt-when{font-family:'Share Tech Mono',monospace;font-size:11px;color:var(--g-muted);}
    .lb-cmt-text{font-size:14px;line-height:1.6;color:rgba(243,236,228,.8);white-space:pre-wrap;word-break:break-word;}
    .lb-cmt-empty{font-size:14px;color:var(--g-muted);}

    .lb-form{display:flex;flex-direction:column;gap:10px;margin-top:auto;padding-top:18px;border-top:1px solid rgba(255,255,255,.07);}
    .lb-input,.lb-textarea{width:100%;padding:0 14px;height:44px;border-radius:10px;border:1px solid rgba(255,255,255,.1);
      background:rgba(0,0,0,.25);color:var(--g-text);font-family:'DM Sans',sans-serif;font-size:14px;outline:none;transition:border-color .2s;}
    .lb-textarea{height:auto;padding:12px 14px;line-height:1.5;resize:vertical;min-height:78px;max-height:200px;}
    .lb-input:focus,.lb-textarea:focus{border-color:var(--g-accent2);}
    .lb-form-row{display:flex;align-items:center;justify-content:flex-end;gap:12px;}
    .lb-status{margin-right:auto;font-family:'Share Tech Mono',monospace;font-size:12px;color:var(--g-muted);}
    .lb-status.err{color:#ff9aa8;} .lb-status.ok{color:#9ae6b4;}
    .lb-send{height:44px;padding:0 22px;border-radius:10px;background:var(--g-accent1);color:#fff;
      font-weight:600;font-size:14px;transition:filter .2s,opacity .2s;}
    .lb-send:hover{filter:brightness(1.12);}
    .lb-send:disabled{opacity:.5;cursor:default;filter:none;}

    @media (max-width:860px){
      .lb-side{border-left:0;border-top:1px solid rgba(255,255,255,.07);max-height:none;}
      .lb-frame{width:100%;}
    }
    @media (max-width:640px){
      .nav-burger{top:13px;left:.85rem;}
      .nav-side{padding-top:4rem;}
      .g-top{padding-left:72px;}
    }
    @media (prefers-reduced-motion: reduce){
      html{scroll-behavior:auto;}
      *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;}
      .nav-side,.nav-scrim{transition:transform .01ms linear, opacity .01ms linear, visibility 0s!important;}
      .g-tile:hover{transform:none;}
      .g-tile:hover .g-shot img{transform:none;}
    }
  </style>
</head>

<script>
// ════ THE SHARED GALLERY ════
// The photos, comments and likes live on arandomperson.dev, which owns the
// data. Visitors' browsers call it directly (cross-origin, no key): its rate
// limits count per visitor, so routing these through this site would put
// every visitor in one shared bucket. Only get-content stays on this site.
const GALLERY_API = 'https://arandomperson.dev/.netlify/functions';

// This site's own name, from wherever it's being served.
const SITE_HOST = location.hostname.replace(/^www\./, '');
(function initSiteName(){
  // Separate pieces in the flex bar, spaced like "name . tld / gallery".
  const dot = SITE_HOST.indexOf('.');
  const top = document.getElementById('gTop');
  if (dot > 0) {
    const b = document.createElement('b'); b.textContent = '.';
    top.prepend(SITE_HOST.slice(0, dot), b, SITE_HOST.slice(dot + 1));
  } else {
    top.prepend(SITE_HOST);
  }
  document.getElementById('navSideTitle').textContent = SITE_HOST;
  document.getElementById('gFoot').textContent = '© ' + new Date().getFullYear() + ' ' + SITE_HOST;
})();
</script>
<script>
// ════ SETTINGS → CSS ════
// Every colour on this page is a variable written here from the Gallery
// Editor's saved settings. The server has already collapsed a theme preset
// over the individual colours, so there is one set of values to read and no
// branching on "which mode is the owner in".
(function initSettings(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };

  window.__applyGallerySettings = function (cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const cache = {};
    const el = document.documentElement;
    const set = (k, v) => { el.style.setProperty(k, v); cache[k] = v; };

    const p = cfg.palette || {};
    set('--g-bg1', (cfg.bg && cfg.bg.c1) || '#1a0f12');
    set('--g-bg2', (cfg.bg && cfg.bg.c2) || '#0b090a');
    if (p.accent1) set('--g-accent1', p.accent1); else set('--g-accent1', (cfg.accents && cfg.accents.title.c1) || '#d7263d');
    if (p.accent2) set('--g-accent2', p.accent2); else set('--g-accent2', (cfg.accents && cfg.accents.title.c2) || '#e3b04b');
    if (p.text) set('--g-text', p.text);
    if (p.muted) set('--g-muted', p.muted);
    if (p.panel) set('--g-panel', p.panel);

    const t = cfg.title || {};
    // A font file the owner hosts, loaded with @font-face. The family name is
    // theirs or derived from the filename; the format hint comes from the
    // extension, because a browser that cannot guess the format silently
    // refuses the face and you get the fallback with no error anywhere.
    const FALLBACK = "'Noto Serif JP',serif";
    if (t.fontUrl) {
      const fam = (t.fontName || (t.fontUrl.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, '')).replace(/[^A-Za-z0-9 _-]/g, '') || 'GalleryTitle';
      const ext = (t.fontUrl.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById('galFontFace');
      if (!tag) { tag = document.createElement('style'); tag.id = 'galFontFace'; document.head.appendChild(tag); }
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + t.fontUrl.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set('--g-title-font', '"' + fam + '",' + FALLBACK);
      // Cached alongside the colours so the NEXT visit can inject this face
      // before first paint, instead of the loading screen wearing the fallback
      // until a fetch returns. Not a CSS variable, hence the __ prefix.
      cache.__fontFamily = fam;
      cache.__fontUrl = t.fontUrl;
      // The face is only fetched once something asks for it, and the loading
      // screen's five seconds are long enough to cover that — but only if we
      // actually wait. window.__galleryFontReady is what the loader awaits.
      try {
        window.__galleryFontReady = document.fonts && document.fonts.load
          ? document.fonts.load('900 36px "' + fam + '"').catch(() => {})
          : Promise.resolve();
      } catch (e) { window.__galleryFontReady = Promise.resolve(); }
    } else {
      const tag = document.getElementById('galFontFace');
      if (tag) tag.textContent = '';
      set('--g-title-font', FALLBACK);
      delete cache.__fontFamily; delete cache.__fontUrl;
      window.__galleryFontReady = Promise.resolve();
    }

    // ── THE OTHER TWO HOSTED FACES ──
    // One for the titles ON the photographs (the caption under each tile and
    // the heading in the expanded view), one for the song title in the player.
    //
    // Each family name carries a SUFFIX. All three faces are named after their
    // filenames, so two files called the same thing would declare one family
    // twice — the later @font-face silently winning, and the heading quietly
    // wearing somebody else's font. The suffix makes that impossible, and the
    // panel's previews ask for the same suffixed name.
    //
    // Deliberately NOT replayed from the boot cache the way the title's face
    // is: nothing either of them styles is on screen until the loading screen
    // lifts, by which time the real settings have long since arrived.
    const hostFont = (opt) => {
      const f = opt.font || {};
      if (!f.url) {
        const old = document.getElementById(opt.tagId);
        if (old) old.textContent = '';
        // REMOVED, not set to a default: the rules that read it carry their own
        // fallbacks, and a var() fallback only applies when the property is not
        // declared at all.
        el.style.removeProperty(opt.varName);
        delete cache[opt.varName];
        return Promise.resolve();
      }
      const fam = ((f.name || (f.url.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, ''))
        .replace(/[^A-Za-z0-9 _-]/g, '') || opt.fallbackName) + ' ' + opt.suffix;
      const ext = (f.url.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById(opt.tagId);
      if (!tag) { tag = document.createElement('style'); tag.id = opt.tagId; document.head.appendChild(tag); }
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + f.url.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set(opt.varName, '"' + fam + '",' + FALLBACK);
      try {
        return (document.fonts && document.fonts.load)
          ? document.fonts.load(opt.probe.replace('%s', fam)).catch(() => {})
          : Promise.resolve();
      } catch (e) { return Promise.resolve(); }
    };

    const imgReady = hostFont({
      font: cfg.imageFont, tagId: 'galImgFontFace', varName: '--g-img-font',
      suffix: 'Img', fallbackName: 'GalleryImage', probe: '600 15px "%s"',
    });
    // The player keeps its font under fontUrl/fontName rather than url/name,
    // because `music` is a settings group of its own and `url` there would
    // read as the player's URL. Adapted here rather than renamed in the
    // config, where it would be the odd one out.
    const mFont = cfg.music || {};
    const trkReady = hostFont({
      font: { url: mFont.fontUrl, name: mFont.fontName },
      tagId: 'galTrkFontFace', varName: '--gp-font',
      suffix: 'Trk', fallbackName: 'GalleryTrack', probe: '800 24px "%s"',

    // page is not text changing typeface under the visitor.

    window.__galleryFontReady = Promise.all([titleReady, imgReady, trkReady]).catch(() => {});

    set('--g-title-c1', t.c1 || '#d7263d');
    set('--g-title-c2', t.c2 || '#e3b04b');
    set('--g-title-angle', (typeof t.angle === 'number' ? t.angle : 135) + 'deg');
    // The plate behind the heading. Its wash is full by a third of the way
    // along the slider, so a small value reads as a touch of blur rather than
    // as a slab dropped behind the title.
    const plate = (px) => (px > 0 ? Math.min(1, px / 12).toFixed(3) : '0');
    const tBlur = (typeof t.blur === 'number' ? Math.max(0, Math.min(40, t.blur)) : 0);
    set('--g-title-blur', tBlur + 'px');
    set('--g-title-plate', plate(tBlur));
    // A multiplier on the responsive size, never a replacement for it.
    set('--g-title-scale', ((typeof t.size === 'number' ? Math.max(50, Math.min(160, t.size)) : 100) / 100).toFixed(3));

    const dBlur = (typeof cfg.descBlur === 'number' ? Math.max(0, Math.min(40, cfg.descBlur)) : 0);
    set('--g-desc-blur', dBlur + 'px');
    set('--g-desc-plate', plate(dBlur));
    // Blank follows the page's muted colour, which is what the description has
    // always been — restored to the variable rather than to its current value.
    set('--g-desc-color', (typeof cfg.descColor === 'string' && cfg.descColor) ? cfg.descColor : 'var(--g-muted)');
    // Blank means "follow the title accent", which is not the same as any
    // particular colour — so it is restored to the variable, not to a literal.
    set('--g-tile-glow', (typeof cfg.tileGlow === 'string' && cfg.tileGlow) ? cfg.tileGlow : 'var(--g-accent1)');
    // The sound player's own pair, on the same terms: blank is restored to the
    // variable it follows, not to the colour that variable happens to hold.
    const mus = cfg.music || {};
    const pick = (v, follows) => ((typeof v === 'string' && v) ? v : follows);
    set('--gp-c1', pick(mus.c1, 'var(--acc-title-1)'));
    set('--gp-c2', pick(mus.c2, 'var(--acc-title-2)'));
    // The trim across the top follows the player's pair, which follows the
    // gallery's — each restored to the variable above it, never to a literal,
    // so changing one end still carries the rest with it.
    set('--gp-acc1', pick(mus.accentFrom, 'var(--gp-c1)'));
    set('--gp-acc2', pick(mus.accentTo, 'var(--gp-c2)'));
    // The glass. A colour here replaces the page's panel colour for this one
    // element; the strength is how opaque that glass is over whatever is behind.
    set('--gp-tint', mus.tint ? (hexRgb(mus.tint) || 'var(--g-panel)') : 'var(--g-panel)');
    const tintA = Math.max(0, Math.min(100, typeof mus.tintStrength === 'number' ? mus.tintStrength : 72)) / 100;
    set('--gp-tint-a', tintA.toFixed(3));
    // At zero the panel goes away ENTIRELY — fill, blur, border, shadow, trim
    // and corner brackets. A fill of zero on its own left an empty frame
    // floating behind the controls, which is not what "no panel" means.
    // The glass is a whole value and not a multiplied one, because an identity
    // backdrop-filter still composites: see the note on .g-player.
    set('--gp-panel', tintA > 0 ? '1' : '0');
    set('--gp-glass', tintA > 0 ? 'blur(18px) saturate(1.25)' : 'none');

    const a = cfg.accents || {};
    if (a.title) { set('--acc-title-1', a.title.c1); set('--acc-title-2', a.title.c2); }
    if (a.date) { set('--acc-date-1', a.date.c1); set('--acc-date-2', a.date.c2); }
    if (a.comment) { set('--acc-cmt-1', a.comment.c1); set('--acc-cmt-2', a.comment.c2); }

    set('--g-tile-min', cfg.density === 'compact' ? '210px' : '290px');
    set('--g-glass', cfg.tileGlass === false ? '1' : '.55');
    el.setAttribute('data-gglass', cfg.tileGlass === false ? 'off' : 'on');

    // ── the video background ──
    // Mobile gets its own file when one is set, because a desktop-sized video
    // on a phone is mostly wasted bytes; blank means share the desktop one.
    const vid = document.getElementById('gVideo');
    const tint = document.getElementById('gTint');
    const v = cfg.video || {};
    const small = window.matchMedia('(max-width: 768px)').matches;
    const src = v.enabled ? ((small && v.mobileUrl) ? v.mobileUrl : v.desktopUrl) : '';
    if (src) {
      if (vid.dataset.src !== src) { vid.dataset.src = src; vid.src = src; try { vid.load(); } catch (e) {} }
      vid.play().catch(() => {});
      vid.classList.add('on');
      el.setAttribute('data-gvideo', '1');       // the title gets its blur plate
      // The SAME wash the main site lays over its background video: three
      // stops, heavier top and bottom, lightest around 45% down, with the
      // strength slider scaling all three. A flat two-stop ramp was close but
      // visibly not the same thing when you walk between the two pages.
      const rgb = hexRgb(v.tint) || '0,0,0';
      const strength = Math.max(0, Math.min(100, typeof v.tintStrength === 'number' ? v.tintStrength : 45)) / 100;
      const a = (base) => Math.min(0.96, base * strength).toFixed(3);
      tint.style.background =
        'linear-gradient(180deg,' +
        ' rgba(' + rgb + ',' + a(0.62) + ') 0%,' +
        ' rgba(' + rgb + ',' + a(0.30) + ') 45%,' +
        ' rgba(' + rgb + ',' + a(0.76) + ') 100%)';
      tint.classList.add('on');
    } else {
      vid.classList.remove('on');
      vid.removeAttribute('src'); delete vid.dataset.src;
      try { vid.load(); } catch (e) {}
      el.removeAttribute('data-gvideo');
      // No video, no wash: tinting a gradient the owner already chose the
      // colour of would just be muddying their own setting.
      tint.classList.remove('on');
    }

    try { localStorage.setItem('galleryThemeCache', JSON.stringify(cache)); } catch (e) {}
    el.classList.add('theme-ready');
  };
  window.__galleryThemeReady = function(){ document.documentElement.classList.add('theme-ready'); };
})();

// These come from the MAIN SITE's theme, not the gallery's, so walking between
// the two pages doesn't change the colour of the navigation under you.
(function initNavTheme(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };
  window.__applyNavTheme = function (theme) {
    if (!theme) return;
    const el = document.documentElement;
    // This site's sidebar settings (UI Editor → Sidebar); blank follows its
    // site accent and page background.
    const bg = hexRgb(theme.sidebarColor) || hexRgb(theme.bgColor2);
    const acc = hexRgb(theme.sidebarAccent) || hexRgb(theme.siteAccent);
    if (bg) el.style.setProperty('--nav-bg', bg); else el.style.removeProperty('--nav-bg');
    if (acc) { el.style.setProperty('--nav-accent', acc); el.style.setProperty('--nav-accent2', acc); }
    else { el.style.removeProperty('--nav-accent'); el.style.removeProperty('--nav-accent2'); }
    const alpha = Math.max(0, Math.min(100, typeof theme.sidebarOpacity === 'number' ? theme.sidebarOpacity : 90)) / 100;
    el.style.setProperty('--nav-alpha', alpha.toFixed(3));
  };
})();

// ════ OVERLAY EFFECTS ════
// Snow, petals or rain drifting over the page. One canvas, three behaviours,
// and nothing at all running when the setting is off or motion is reduced —
// an idle requestAnimationFrame loop is a battery cost for no picture.
(function initOverlay(){
  const cv = document.getElementById('gFx');
  const ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  if (!ctx) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // `mode` starts as null rather than 'none' so the FIRST call always applies.
  // Starting it at 'none' made "turn the overlay off" a no-op on load, which
  // left an empty canvas sitting over the page doing nothing visible but
  // reporting itself as shown.
  let raf = 0, parts = [], mode = null, w = 0, h = 0, dpr = 1;

  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  function seed(){
    // Fewer on a phone: the same count that reads as weather on a desktop
    // reads as static on a 390px screen, and costs more per pixel.
    const base = w < 700 ? 34 : 70;
    const n = mode === 'rain' ? Math.round(base * 1.3) : base;
    parts = [];
    for (let i = 0; i < n; i++) {
      parts.push({
        x: rnd(0, w), y: rnd(-h, h),
        r: mode === 'rain' ? rnd(6, 16) : rnd(1.6, 4.2),
        s: mode === 'rain' ? rnd(7, 13) : rnd(.5, 1.7),
        d: rnd(-.5, .5), a: rnd(.25, .75),
        rot: rnd(0, Math.PI * 2), spin: rnd(-.03, .03),
      });
    }
  }

  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (mode === 'rain') {
        ctx.strokeStyle = 'rgba(190,210,235,' + (p.a * .5).toFixed(2) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.d * 2, p.y + p.r); ctx.stroke();
        p.y += p.s * 2.2; p.x += p.d;
      } else if (mode === 'petals') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(255,183,197,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.5, p.r * .8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        p.y += p.s; p.x += Math.sin(p.y / 40) * .8 + p.d; p.rot += p.spin;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        p.y += p.s; p.x += Math.sin(p.y / 55) * .5 + p.d;
      }
      if (p.y > h + 24) { p.y = -20; p.x = rnd(0, w); }
      if (p.x < -30) p.x = w + 20; else if (p.x > w + 30) p.x = -20;
    }
    raf = requestAnimationFrame(frame);
  }

  window.__setGalleryOverlay = function (next){
    const want = ['snow', 'petals', 'rain'].indexOf(next) !== -1 ? next : 'none';
    if (want === mode) return;
    mode = want;
    cancelAnimationFrame(raf); raf = 0;
    ctx.clearRect(0, 0, w, h);
    if (mode === 'none' || reduce) { cv.style.display = 'none'; return; }
    // 'block', not '': the stylesheet hides this by default so an unconfigured
    // page never shows an empty canvas, and clearing the inline value would
    // just hand it back to that rule.
    cv.style.display = 'block';
    size(); seed(); raf = requestAnimationFrame(frame);
  };
  window.addEventListener('resize', () => { if (mode !== 'none' && !reduce) { size(); seed(); } }, { passive: true });
  // A hidden tab should not be animating weather nobody can see.
  document.addEventListener('visibilitychange', () => {
    if (mode === 'none' || reduce) return;
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(frame);
  });
})();
