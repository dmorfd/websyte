<script>
// ════ THE SHARED GALLERY ════
// The photos, comments and likes live on arandomperson.dev, which owns the
// data. Visitors' browsers call it directly (cross-origin, no key): its rate
// limits count per visitor, so routing these through this site would put
// every visitor in one shared bucket. Only get-content stays on this site.
const GALLERY_API = 'https://arandomperson.dev/.netlify/functions';

// This site's own name, from wherever it's being served.
const SITE_HOST = location.hostname.replace(/^www\./, '');
(function initSiteName(){
  // Separate pieces in the flex bar, spaced like "name . tld / gallery".
  const dot = SITE_HOST.indexOf('.');
  const top = document.getElementById('gTop');
  if (dot > 0) {
    const b = document.createElement('b'); b.textContent = '.';
    top.prepend(SITE_HOST.slice(0, dot), b, SITE_HOST.slice(dot + 1));
  } else {
    top.prepend(SITE_HOST);
  }
  document.getElementById('navSideTitle').textContent = SITE_HOST;
  document.getElementById('gFoot').textContent = '© ' + new Date().getFullYear() + ' ' + SITE_HOST;
})();
</script>
<script>
// ════ SETTINGS → CSS ════
// Every colour on this page is a variable written here from the Gallery
// Editor's saved settings. The server has already collapsed a theme preset
// over the individual colours, so there is one set of values to read and no
// branching on "which mode is the owner in".
(function initSettings(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };

  window.__applyGallerySettings = function (cfg) {
    if (!cfg || typeof cfg !== 'object') return;
    const cache = {};
    const el = document.documentElement;
    const set = (k, v) => { el.style.setProperty(k, v); cache[k] = v; };

    const p = cfg.palette || {};
    set('--g-bg1', (cfg.bg && cfg.bg.c1) || '#1a0f12');
    set('--g-bg2', (cfg.bg && cfg.bg.c2) || '#0b090a');
    if (p.accent1) set('--g-accent1', p.accent1); else set('--g-accent1', (cfg.accents && cfg.accents.title.c1) || '#d7263d');
    if (p.accent2) set('--g-accent2', p.accent2); else set('--g-accent2', (cfg.accents && cfg.accents.title.c2) || '#e3b04b');
    if (p.text) set('--g-text', p.text);
    if (p.muted) set('--g-muted', p.muted);
    if (p.panel) set('--g-panel', p.panel);

    const t = cfg.title || {};
    // A font file the owner hosts, loaded with @font-face. The family name is
    // theirs or derived from the filename; the format hint comes from the
    // extension, because a browser that cannot guess the format silently
    // refuses the face and you get the fallback with no error anywhere.
    const FALLBACK = "'Noto Serif JP',serif";
    // ── ONE ADDRESS FOR A FONT, WHICHEVER SITE IS ASKING ──
    // The config is shared, so both galleries are told to use the same file —
    // but being told is not being able. A font is the one resource a browser
    // refuses cross-origin unless its host says otherwise, and the config also
    // accepts a root-relative path, which each site resolves against its own
    // domain and therefore means a different file on each. Both end the same
    // way: the owner who set it sees their font and the other one sees the
    // fallback.
    // So the face is fetched through the shared API instead, which reads the
    // same config, fetches the bytes server-side where CORS does not apply,
    // and hands them to anyone. `v` is a token off the URL itself, so picking
    // a new font is a new address and the old one can be cached for good.
    const stamp = (s) => { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h * 33) ^ s.charCodeAt(i)) >>> 0; return h.toString(36); };
    const fontSrc = (slot, url) => GALLERY_API + '/gallery-font?k=' + slot + '&v=' + stamp(url);
    if (t.fontUrl) {
      const fam = (t.fontName || (t.fontUrl.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, '')).replace(/[^A-Za-z0-9 _-]/g, '') || 'GalleryTitle';
      const ext = (t.fontUrl.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById('galFontFace');
      if (!tag) { tag = document.createElement('style'); tag.id = 'galFontFace'; document.head.appendChild(tag); }
      const src = fontSrc('title', t.fontUrl);
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + src.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set('--g-title-font', '"' + fam + '",' + FALLBACK);
      // Cached alongside the colours so the NEXT visit can inject this face
      // before first paint, instead of the loading screen wearing the fallback
      // until a fetch returns. Not a CSS variable, hence the __ prefix.
      cache.__fontFamily = fam;
      cache.__fontUrl = src;
      // The format hint travels with it now. It used to be read back off the
      // URL's extension, and the URL no longer has one — it is a query string
      // on a function. A browser that cannot guess a font's format refuses the
      // face silently, so losing this would have meant the replayed face never
      // loading and no error anywhere to say why.
      cache.__fontFmt = fmt || '';
      cache.__fontExt = ext || '';
      // The face is only fetched once something asks for it, and the loading
      // screen's five seconds are long enough to cover that — but only if we
      // actually wait. window.__galleryFontReady is what the loader awaits.
      try {
        window.__galleryFontReady = document.fonts && document.fonts.load
          ? document.fonts.load('900 36px "' + fam + '"').catch(() => {})
          : Promise.resolve();
      } catch (e) { window.__galleryFontReady = Promise.resolve(); }
    } else {
      const tag = document.getElementById('galFontFace');
      if (tag) tag.textContent = '';
      set('--g-title-font', FALLBACK);
      delete cache.__fontFamily; delete cache.__fontUrl;
      delete cache.__fontFmt; delete cache.__fontExt;
      window.__galleryFontReady = Promise.resolve();
    }

    // ── THE OTHER TWO HOSTED FACES ──
    // One for the titles ON the photographs (the caption under each tile and
    // the heading in the expanded view), one for the song title in the player.
    //
    // Each family name carries a SUFFIX. All three faces are named after their
    // filenames, so two files called the same thing would declare one family
    // twice — the later @font-face silently winning, and the heading quietly
    // wearing somebody else's font. The suffix makes that impossible, and the
    // panel's previews ask for the same suffixed name.
    //
    // Deliberately NOT replayed from the boot cache the way the title's face
    // is: nothing either of them styles is on screen until the loading screen
    // lifts, by which time the real settings have long since arrived.
    const hostFont = (opt) => {
      const f = opt.font || {};
      if (!f.url) {
        const old = document.getElementById(opt.tagId);
        if (old) old.textContent = '';
        // REMOVED, not set to a default: the rules that read it carry their own
        // fallbacks, and a var() fallback only applies when the property is not
        // declared at all.
        el.style.removeProperty(opt.varName);
        delete cache[opt.varName];
        return Promise.resolve();
      }
      const fam = ((f.name || (f.url.split('/').pop() || 'Gallery').replace(/\.[a-z0-9]+$/i, ''))
        .replace(/[^A-Za-z0-9 _-]/g, '') || opt.fallbackName) + ' ' + opt.suffix;
      const ext = (f.url.split('.').pop() || '').toLowerCase().split(/[?#]/)[0];
      const fmt = { woff2: 'woff2', woff: 'woff', ttf: 'truetype', otf: 'opentype' }[ext];
      let tag = document.getElementById(opt.tagId);
      if (!tag) { tag = document.createElement('style'); tag.id = opt.tagId; document.head.appendChild(tag); }
      const src = fontSrc(opt.slot, f.url);
      tag.textContent = '@font-face{font-family:"' + fam + '";'
        + 'src:url("' + src.replace(/"/g, '%22') + '")' + (fmt ? ' format("' + fmt + '")' : '') + ';'
        + 'font-display:swap;font-weight:100 900;}';
      set(opt.varName, '"' + fam + '",' + FALLBACK);
      try {
        return (document.fonts && document.fonts.load)
          ? document.fonts.load(opt.probe.replace('%s', fam)).catch(() => {})
          : Promise.resolve();
      } catch (e) { return Promise.resolve(); }
    };

    const imgReady = hostFont({
      font: cfg.imageFont, tagId: 'galImgFontFace', varName: '--g-img-font',
      suffix: 'Img', fallbackName: 'GalleryImage', probe: '600 15px "%s"', slot: 'image',
    });
    // The player keeps its font under fontUrl/fontName rather than url/name,
    // because `music` is a settings group of its own and `url` there would
    // read as the player's URL. Adapted here rather than renamed in the
    // config, where it would be the odd one out.
    const mFont = cfg.music || {};
    const trkReady = hostFont({
      font: { url: mFont.fontUrl, name: mFont.fontName },
      tagId: 'galTrkFontFace', varName: '--gp-font',
      suffix: 'Trk', fallbackName: 'GalleryTrack', probe: '800 24px "%s"', slot: 'track',
    });
    // And the door's. Its own face rather than the heading's — see the note on
    // .g-enter-text. Not replayed from the boot cache either: the gate is
    // raised when the counting finishes, and the settings have arrived long
    // before that on any load where there are settings to arrive. When the
    // fetch fails outright there is no font to know about and the door wears
    // Noto Serif JP, which is the main site's own gate.
    const eFont = (cfg.enter && typeof cfg.enter === 'object') ? cfg.enter : {};
    const entReady = hostFont({
      font: { url: eFont.fontUrl, name: eFont.fontName },
      tagId: 'galEntFontFace', varName: '--g-enter-font',
      suffix: 'Ent', fallbackName: 'GalleryEnter', probe: '400 32px "%s"', slot: 'enter',
    });
    // The loading screen waits on ALL FOUR faces, so the first sight of the
    // page — and of the door in front of it — is not text changing typeface
    // under the visitor.
    const titleReady = window.__galleryFontReady || Promise.resolve();
    window.__galleryFontReady = Promise.all([titleReady, imgReady, trkReady, entReady]).catch(() => {});

    set('--g-title-c1', t.c1 || '#d7263d');
    set('--g-title-c2', t.c2 || '#e3b04b');
    set('--g-title-angle', (typeof t.angle === 'number' ? t.angle : 135) + 'deg');
    // The plate behind the heading. Its wash is full by a third of the way
    // along the slider, so a small value reads as a touch of blur rather than
    // as a slab dropped behind the title.
    const plate = (px) => (px > 0 ? Math.min(1, px / 12).toFixed(3) : '0');
    const tBlur = (typeof t.blur === 'number' ? Math.max(0, Math.min(40, t.blur)) : 0);
    set('--g-title-blur', tBlur + 'px');
    set('--g-title-plate', plate(tBlur));
    // A multiplier on the responsive size, never a replacement for it.
    set('--g-title-scale', ((typeof t.size === 'number' ? Math.max(50, Math.min(160, t.size)) : 100) / 100).toFixed(3));

    const dBlur = (typeof cfg.descBlur === 'number' ? Math.max(0, Math.min(40, cfg.descBlur)) : 0);
    set('--g-desc-blur', dBlur + 'px');
    set('--g-desc-plate', plate(dBlur));
    // Blank follows the page's muted colour, which is what the description has
    // always been — restored to the variable rather than to its current value.
    set('--g-desc-color', (typeof cfg.descColor === 'string' && cfg.descColor) ? cfg.descColor : 'var(--g-muted)');
    // Blank means "follow the title accent", which is not the same as any
    // particular colour — so it is restored to the variable, not to a literal.
    set('--g-tile-glow', (typeof cfg.tileGlow === 'string' && cfg.tileGlow) ? cfg.tileGlow : 'var(--g-accent1)');
    // The sound player's own pair, on the same terms: blank is restored to the
    // variable it follows, not to the colour that variable happens to hold.
    const mus = cfg.music || {};
    const pick = (v, follows) => ((typeof v === 'string' && v) ? v : follows);
    set('--gp-c1', pick(mus.c1, 'var(--acc-title-1)'));
    set('--gp-c2', pick(mus.c2, 'var(--acc-title-2)'));
    // The trim across the top follows the player's pair, which follows the
    // gallery's — each restored to the variable above it, never to a literal,
    // so changing one end still carries the rest with it.
    set('--gp-acc1', pick(mus.accentFrom, 'var(--gp-c1)'));
    set('--gp-acc2', pick(mus.accentTo, 'var(--gp-c2)'));
    // The song title's colour. One colour rather than a pair, and blank is
    // restored to the variable the title follows, not to the colour that
    // variable is currently holding.
    set('--gp-title', pick(mus.titleColor, 'var(--gp-c1)'));
    // The glass. A colour here replaces the page's panel colour for this one
    // element; the strength is how opaque that glass is over whatever is behind.
    set('--gp-tint', mus.tint ? (hexRgb(mus.tint) || 'var(--g-panel)') : 'var(--g-panel)');
    // ── HOW MUCH GLASS ──
    // This is the main site's "Sound player glass" slider, not a second system
    // that happens to resemble it: the same 0-40 range, the same GLASS_FULL of
    // 20, the same ramp and the same two alphas as applyUiVisuals() in
    // index.html. Copied here rather than imported because gallery.html is a
    // standalone document — but copied exactly, and the server holds the same
    // three lines again in gallery-config.js so the editor's live preview
    // cannot drift from the page.
    //
    // The ramp is a ramp and not a clamp in its upper half on purpose: a clamp
    // is what made the top half of the main site's slider do nothing at all
    // for months. And 0 is 0 — no fill, no blur, no border, no shadow, no
    // corner marks and no top line.
    const GLASS_FULL = 20;
    const ramp = (std, max, g) => (g <= 1 ? std * g : std + (max - std) * Math.min(1, g - 1));
    // tintStrength is still read as a fallback, for a cached config written
    // before the slider changed; the server converts it the same way.
    const slider = (typeof mus.glass === 'number' && isFinite(mus.glass))
      ? Math.max(0, Math.min(40, mus.glass))
      : (typeof mus.tintStrength === 'number' && isFinite(mus.tintStrength))
        ? Math.max(0, Math.min(40, (() => {
            const al = Math.max(0, Math.min(100, mus.tintStrength)) / 100;
            return (al <= 0.82 ? al / 0.82 : 1 + (al - 0.82) / 0.15) * GLASS_FULL;
          })()))
        : 20;
    const gl = Math.min(2, slider / GLASS_FULL);
    set('--gp-tint-a', ramp(0.82, 0.97, gl).toFixed(3));
    set('--gp-edge-a', ramp(0.10, 0.28, gl).toFixed(3));
    // Everything that is not a fill — the shadow, the brackets, the trim —
    // rides this one number, so they all arrive and all leave together.
    set('--gp-panel', Math.min(1, gl).toFixed(3));
    // A whole value, never blur(calc(0px)): an identity backdrop-filter is not
    // the same as no backdrop-filter. See the note on .g-player.
    set('--gp-glass', slider > 0 ? 'blur(' + slider + 'px) saturate(1.25)' : 'none');

    const a = cfg.accents || {};
    if (a.title) { set('--acc-title-1', a.title.c1); set('--acc-title-2', a.title.c2); }
    if (a.date) { set('--acc-date-1', a.date.c1); set('--acc-date-2', a.date.c2); }
    if (a.comment) { set('--acc-cmt-1', a.comment.c1); set('--acc-cmt-2', a.comment.c2); }
    // ── THE RULE BESIDE EACH SECTION'S NAME ──
    // The whole gradient, not two colours in a fixed shape: blank is a flat
    // white hairline fading out, which is what every gallery has drawn since
    // there were sections, and a pair turns it into a gradient that fades at
    // the end like the rule under the heading. Blank REMOVES the property
    // rather than writing the white back, so the stylesheet's own default is
    // the one thing describing what "unset" looks like.
    const sec = (a.section && typeof a.section === 'object') ? a.section : {};
    if (sec.c1 || sec.c2) {
      set('--g-sec-line-img', 'linear-gradient(90deg, ' + (sec.c1 || sec.c2)
        + ', ' + (sec.c2 || sec.c1) + ' 60%, transparent)');
    } else {
      el.style.removeProperty('--g-sec-line-img');
      delete cache['--g-sec-line-img'];
    }
    // There is no strength any more. A rule you can fade to nothing is two
    // controls for one decision — the colours already say what it looks like,
    // and "invisible" is what leaving them blank and picking a transparent
    // pair would do anyway.

    set('--g-tile-min', cfg.density === 'compact' ? '210px' : '290px');
    set('--g-glass', cfg.tileGlass === false ? '1' : '.55');
    el.setAttribute('data-gglass', cfg.tileGlass === false ? 'off' : 'on');

    // ── the video background ──
    // Mobile gets its own file when one is set, because a desktop-sized video
    // on a phone is mostly wasted bytes; blank means share the desktop one.
    const vid = document.getElementById('gVideo');
    const tint = document.getElementById('gTint');
    const v = cfg.video || {};
    const small = window.matchMedia('(max-width: 768px)').matches;
    const src = v.enabled ? ((small && v.mobileUrl) ? v.mobileUrl : v.desktopUrl) : '';
    if (src) {
      if (vid.dataset.src !== src) { vid.dataset.src = src; vid.src = src; try { vid.load(); } catch (e) {} }
      vid.play().catch(() => {});
      vid.classList.add('on');
      el.setAttribute('data-gvideo', '1');       // the title gets its blur plate
      // The SAME wash the main site lays over its background video: three
      // stops, heavier top and bottom, lightest around 45% down, with the
      // strength slider scaling all three. A flat two-stop ramp was close but
      // visibly not the same thing when you walk between the two pages.
      const rgb = hexRgb(v.tint) || '0,0,0';
      const strength = Math.max(0, Math.min(100, typeof v.tintStrength === 'number' ? v.tintStrength : 45)) / 100;
      const a = (base) => Math.min(0.96, base * strength).toFixed(3);
      tint.style.background =
        'linear-gradient(180deg,' +
        ' rgba(' + rgb + ',' + a(0.62) + ') 0%,' +
        ' rgba(' + rgb + ',' + a(0.30) + ') 45%,' +
        ' rgba(' + rgb + ',' + a(0.76) + ') 100%)';
      tint.classList.add('on');
    } else {
      vid.classList.remove('on');
      vid.removeAttribute('src'); delete vid.dataset.src;
      try { vid.load(); } catch (e) {}
      el.removeAttribute('data-gvideo');
      // No video, no wash: tinting a gradient the owner already chose the
      // colour of would just be muddying their own setting.
      tint.classList.remove('on');
    }

    // ── THE DOOR ──
    // Its look goes into the cache alongside the colours, and for the same
    // reason: the gate is on screen before any fetch returns, so the wording
    // and the wash this device saw last time are what it should be wearing on
    // the first frame rather than the stock ones swapped out a moment later.
    // Deliberately NOT theme-owned, unlike every colour above. The enter
    // screen is the door in front of the gallery rather than part of it, and
    // the main site treats its own the same way — the owner picks it whatever
    // palette is in force.
    const en = (cfg.enter && typeof cfg.enter === 'object') ? cfg.enter : {};
    const enterOn = en.enabled !== false;
    // THE MAIN SITE'S RECIPE, CHARACTER FOR CHARACTER.
    // `linear-gradient(<a>deg,<c1>b3,<c2>f2)` — the alphas baked on as hex
    // suffixes, b3 being .702 and f2 being .949. Written the same way rather
    // than converted to rgba() with .7 and .95, because "near enough" between
    // two copies of one screen is how they drift apart.
    const eHex = (v, d) => (typeof v === 'string' && /^#[0-9a-fA-F]{6}$/.test(v) ? v : d);
    const eg1 = eHex(en.gradColor1, '#3c0a1e');
    const eg2 = eHex(en.gradColor2, '#000000');
    const eAng = (typeof en.gradAngle === 'number' && en.gradAngle >= 0 && en.gradAngle <= 360) ? en.gradAngle : 135;
    set('--g-enter-grad', 'linear-gradient(' + eAng + 'deg,' + eg1 + 'b3,' + eg2 + 'f2)');
    set('--g-enter-scale', (Math.max(50, Math.min(250, typeof en.textScale === 'number' ? en.textScale : 100)) / 100).toFixed(2));
    cache.__enterOn = enterOn;
    cache.__enterText = (typeof en.text === 'string' && en.text.trim()) ? en.text.trim().slice(0, 100) : 'enter';
    if (window.__setGalleryEnter) window.__setGalleryEnter(enterOn, cache.__enterText);

    try { localStorage.setItem('galleryThemeCache', JSON.stringify(cache)); } catch (e) {}
    el.classList.add('theme-ready');
  };
  window.__galleryThemeReady = function(){ document.documentElement.classList.add('theme-ready'); };
})();

// These come from the MAIN SITE's theme, not the gallery's, so walking between

(function initNavTheme(){
  const hexRgb = (h) => {
    const m = /^#?([0-9a-f]{6})$/i.exec(String(h || ''));
    if (!m) return null;
    const n = parseInt(m[1], 16);
    return ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255);
  };
  window.__applyNavTheme = function (theme) {
    if (!theme) return;
    const el = document.documentElement;
    // This site's sidebar settings (UI Editor → Sidebar); blank follows its
    // site accent and page background.
    const bg = hexRgb(theme.sidebarColor) || hexRgb(theme.bgColor2);
    const acc = hexRgb(theme.sidebarAccent) || hexRgb(theme.siteAccent);
    if (bg) el.style.setProperty('--nav-bg', bg); else el.style.removeProperty('--nav-bg');
    if (acc) { el.style.setProperty('--nav-accent', acc); el.style.setProperty('--nav-accent2', acc); }
    else { el.style.removeProperty('--nav-accent'); el.style.removeProperty('--nav-accent2'); }
    const alpha = Math.max(0, Math.min(100, typeof theme.sidebarOpacity === 'number' ? theme.sidebarOpacity : 90)) / 100;
    el.style.setProperty('--nav-alpha', alpha.toFixed(3));

// ════ OVERLAY EFFECTS ════
// Snow, petals or rain drifting over the page. One canvas, three behaviours,
// and nothing at all running when the setting is off or motion is reduced —
// an idle requestAnimationFrame loop is a battery cost for no picture.
(function initOverlay(){
  const cv = document.getElementById('gFx');
  const ctx = cv && cv.getContext ? cv.getContext('2d') : null;
  if (!ctx) return;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // `mode` starts as null rather than 'none' so the FIRST call always applies.
  // Starting it at 'none' made "turn the overlay off" a no-op on load, which
  // left an empty canvas sitting over the page doing nothing visible but
  // reporting itself as shown.
  let raf = 0, parts = [], mode = null, w = 0, h = 0, dpr = 1;

  function size(){
    dpr = Math.min(2, window.devicePixelRatio || 1);
    w = cv.clientWidth; h = cv.clientHeight;
    cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  const rnd = (a, b) => a + Math.random() * (b - a);

  function seed(){
    // Fewer on a phone: the same count that reads as weather on a desktop
    // reads as static on a 390px screen, and costs more per pixel.
    const base = w < 700 ? 34 : 70;
    const n = mode === 'rain' ? Math.round(base * 1.3) : base;
    parts = [];
    for (let i = 0; i < n; i++) {
      parts.push({
        x: rnd(0, w), y: rnd(-h, h),
        r: mode === 'rain' ? rnd(6, 16) : rnd(1.6, 4.2),
        s: mode === 'rain' ? rnd(7, 13) : rnd(.5, 1.7),
        d: rnd(-.5, .5), a: rnd(.25, .75),
        rot: rnd(0, Math.PI * 2), spin: rnd(-.03, .03),
      });
    }
  }

  function frame(){
    ctx.clearRect(0, 0, w, h);
    for (const p of parts) {
      if (mode === 'rain') {
        ctx.strokeStyle = 'rgba(190,210,235,' + (p.a * .5).toFixed(2) + ')';
        ctx.lineWidth = 1.1;
        ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x + p.d * 2, p.y + p.r); ctx.stroke();
        p.y += p.s * 2.2; p.x += p.d;
      } else if (mode === 'petals') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillStyle = 'rgba(255,183,197,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.5, p.r * .8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        p.y += p.s; p.x += Math.sin(p.y / 40) * .8 + p.d; p.rot += p.spin;
      } else {
        ctx.fillStyle = 'rgba(255,255,255,' + p.a.toFixed(2) + ')';
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
        p.y += p.s; p.x += Math.sin(p.y / 55) * .5 + p.d;
      }
      if (p.y > h + 24) { p.y = -20; p.x = rnd(0, w); }
      if (p.x < -30) p.x = w + 20; else if (p.x > w + 30) p.x = -20;
    }
    raf = requestAnimationFrame(frame);
  }

  window.__setGalleryOverlay = function (next){
    const want = ['snow', 'petals', 'rain'].indexOf(next) !== -1 ? next : 'none';
    if (want === mode) return;
    mode = want;
    cancelAnimationFrame(raf); raf = 0;
    ctx.clearRect(0, 0, w, h);
    if (mode === 'none' || reduce) { cv.style.display = 'none'; return; }
    // 'block', not '': the stylesheet hides this by default so an unconfigured
    // page never shows an empty canvas, and clearing the inline value would
    // just hand it back to that rule.
    cv.style.display = 'block';
    size(); seed(); raf = requestAnimationFrame(frame);
  };
  window.addEventListener('resize', () => { if (mode !== 'none' && !reduce) { size(); seed(); } }, { passive: true });
  // A hidden tab should not be animating weather nobody can see.
  document.addEventListener('visibilitychange', () => {
    if (mode === 'none' || reduce) return;
    if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
    else if (!raf) raf = requestAnimationFrame(frame);
  });
})();

    } else {
      const ring = cols.concat(cols.slice(0, -1).reverse());
      el.style.setProperty('background-image', 'linear-gradient(90deg,' + ring.join(',') + ')');
      el.style.setProperty('background-size', '200% auto');
      el.style.setProperty('animation', 'gNameShimmer 6s linear infinite');
    }
    // 4 is Neon. Anything else just wears its colours.
    if (style.effect === 4) {
      el.style.setProperty('text-shadow', '0 0 8px ' + cols[0] + ', 0 0 16px ' + cols[cols.length - 1]);
    }
  }

  function refreshTileCounts(entry){
    if (!entry || !entry.el) return;
    const like = entry.el.querySelector('.g-count-like span:last-child');
    const cmt = entry.el.querySelector('.g-count-cmt span:last-child');
    if (like) like.textContent = String(entry.img.likes || 0);
    if (cmt) cmt.textContent = String(entry.img.comments || 0);
  }

  function showEmpty(){
    stateEl.style.display = '';
    sectionsEl.classList.remove('staging');
  }

  function render(){
    sectionsEl.textContent = '';
    sectionsEl.classList.remove('revealed');
    sectionsEl.classList.add('staging');
    stateEl.style.display = 'none';
    flat = [];

    let total = 0, n = 0;
    catalogue.sections.forEach((sec, si) => {
      const mine = catalogue.images.filter((im) => im.sectionId === sec.id);
      if (!mine.length) return;
      total += mine.length;

      const wrap = document.createElement('section'); wrap.className = 'g-section';
      const head = document.createElement('div'); head.className = 'g-sec-head';
      // The number, the name and the rule share a row; the count goes beneath
      // the pair of them.
      const top = document.createElement('div'); top.className = 'g-sec-top';

      const num = document.createElement('span'); num.className = 'g-sec-num'; num.textContent = pad(si + 1);
      const names = document.createElement('div'); names.className = 'g-sec-names';
      const jp = document.createElement('span'); jp.className = 'g-sec-jp'; jp.textContent = sec.jp || '';
      const nm = document.createElement('h2'); nm.className = 'g-sec-name'; nm.textContent = sec.name;
      names.appendChild(jp); names.appendChild(nm);
      const line = document.createElement('div'); line.className = 'g-sec-line';
      const cnt = document.createElement('span'); cnt.className = 'g-sec-count';
      cnt.textContent = pad(mine.length) + ' screenshots';

      top.appendChild(num); top.appendChild(names); top.appendChild(line);
      head.appendChild(top); head.appendChild(cnt);
      wrap.appendChild(head);

      const grid = document.createElement('div'); grid.className = 'g-grid';
      mine.forEach((im) => {
        const index = flat.length;
        const entry = { img: im, sectionName: sec.name, el: null };
        flat.push(entry);
        entry.el = tile(entry, index);
        grid.appendChild(entry.el);
        n++;
      });
      wrap.appendChild(grid);
      sectionsEl.appendChild(wrap);
    });

    countEl.textContent = pad(total);
    lbTotal.textContent = pad(flat.length);

    if (!total) { showEmpty(); return; }

    sectionsEl.querySelectorAll('.g-section').forEach((s, i) => s.style.setProperty('--d', (i * 90) + 'ms'));
    sectionsEl.querySelectorAll('.g-tile').forEach((el, i) => el.style.setProperty('--d', (120 + i * 55) + 'ms'));
    sectionsEl.classList.remove('staging');
    sectionsEl.classList.add('revealed');
  }

  // ── preload, then reveal ──
  // The counter runs 00 → 10 regardless of how many photos there are: "0 / 2"
  // told the visitor about an implementation detail, and jumped. Ten steps
  // over a deliberate minimum of five seconds reads as a loading screen rather
  // than a flicker, and the bar is eased so it glides instead of stepping.
  //
  // A photo that fails counts as done — one dead URL must not hold the page —
  // and a hard ceiling applies in case a request simply never answers.

  // ════ THE CURTAIN'S ALL-CLEAR ════
  // The loading screen covers the whole page for at least five seconds, and
  // the settings arrive long before it lifts. Anything that should wait for
  // the visitor to actually SEE the gallery waits here rather than on the
  // settings — the sound player does, because music coming out of a black
  // screen that is still counting to ten is a page making noise before it has
  // shown anybody anything.
  //
  // A list of callbacks rather than a promise, so it is readable in the one
  // place that uses it, and a flag beside it so a late subscriber still fires
  // instead of waiting for a signal that has already gone.
  let revealed = false;
  const revealWaiting = [];
  const whenRevealed = (fn) => { if (revealed) fn(); else revealWaiting.push(fn); };
  const announceReveal = () => {
    if (revealed) return;
    revealed = true;
    // splice(0) so a callback that subscribes again cannot be run twice.
    revealWaiting.splice(0).forEach((fn) => { try { fn(); } catch (e) {} });
  };

  // ════ THE DOOR ════
  // When the gate is on, the all-clear above is not fired by the loading
  // screen any more — it is fired by the visitor's click on this. That is the
  // entire reason the gate exists: iOS will not play audio outside a user
  // gesture, and this turns "try it and hope" into a press.
  //
  // THE ONE THING THAT MUST NOT CHANGE HERE: announceReveal() is called
  // DIRECTLY in the click listener, before the fade, before any timer. The
  // chain from the press to audio.play() has to stay synchronous or the
  // browser stops seeing it as a gesture — and it would still work on a
  // desktop, so the failure would only ever show up on a phone.
  const enterEl = document.getElementById('gEnter');
  const enterBtn = document.getElementById('gEnterText');
  const enterCache = window.__galEnterCache || {};
  let enterOn = enterCache.on !== false;
  if (enterBtn && enterCache.text) enterBtn.textContent = enterCache.text;

  // Settings, when they arrive, overrule the cache.
  window.__setGalleryEnter = function (on, text) {
    enterOn = !!on;
    if (enterBtn && text) enterBtn.textContent = text;
  };

  // The door comes up OVER the loading screen, which stays fully lit behind it
  // until the door is opaque — see finishLoading(). The gate sits at 600 and
  // the loader at 100, so through the whole handover there is always something
  // opaque between the visitor and the gallery.
  //
  // The two-step unhide is load-bearing. `hidden` is display:none, and a
  // transition cannot run from a box that was not being laid out — so the gate
  // is unhidden AT opacity 0, that state is forced to be painted, and only
  // then does the class come off.
  const showEnter = () => {
    if (!enterEl || !enterBtn) { announceReveal(); return; }
    enterEl.classList.add('arriving');
    enterEl.hidden = false;
    enterEl.setAttribute('aria-hidden', 'false');
    void enterEl.offsetWidth;                // flush the opacity:0 to the screen
    enterEl.classList.remove('arriving');
    enterBtn.classList.add('ready');
    try { enterBtn.focus({ preventScroll: true }); } catch (e) { try { enterBtn.focus(); } catch (e2) {} }
  };

  if (enterEl && enterBtn) {
    const pass = () => {
      announceReveal();                       // first, and synchronously
      enterEl.classList.add('done');
      enterEl.setAttribute('aria-hidden', 'true');
      setTimeout(() => { enterEl.hidden = true; }, 600);   // the fade's own length
    };
    enterBtn.addEventListener('click', pass);
    // A visitor using the keyboard has to be able to see where they are, and
    // everybody else should see a door rather than a form control. A real key
    // press is what tells the two apart — script focus does not, see the CSS.
    // Tab is held on the button because the gate is the only thing on screen:
    // behind it is a page the visitor has not been shown yet, and tabbing into
    // one of its links is a worse answer than staying put.
    enterEl.addEventListener('keydown', (e) => {
      enterEl.classList.add('keyed');
      if (e.key === 'Tab') {
        e.preventDefault();
        try { enterBtn.focus({ preventScroll: true }); } catch (err) {}
      }
    });
    // The panel around the button is a target too, the way the main site's is
    // — the button is for keyboards, not a smaller place to aim.
    enterEl.addEventListener('click', (e) => { if (e.target !== enterBtn) pass(); });
    // If the settings never arrive the label would stay invisible for ever,
    // so it is shown anyway. The same guard the main site carries.
    setTimeout(() => { enterBtn.classList.add('ready'); }, 1500);
  }

  // ════ THE PLAYER ════
  // Four tracks at most, looping round. It tries to start on arrival when the
  // owner has asked it to — see armAutoplay below for what "tries" means, and
  // for why a browser refusing is the ordinary path through that code rather
  // than an error in it.
  (function initPlayer(){
    const root   = document.getElementById('galPlayer');
    const cover  = document.getElementById('galPlayerCover');
    const titleN = document.getElementById('galPlayerTitle');
    const artist = document.getElementById('galPlayerArtist');
    const bar    = document.getElementById('galPlayerBar');
    const fill   = document.getElementById('galPlayerFill');
    const playB  = document.getElementById('galPlayerPlay');
    const prevB  = document.getElementById('galPlayerPrev');
    const nextB  = document.getElementById('galPlayerNext');
    const icon   = document.getElementById('galPlayerIcon');
    const thumb  = document.getElementById('galPlayerThumb');
    const curN   = document.getElementById('galPlayerCur');
    const durN   = document.getElementById('galPlayerDur');
    const stateN = document.getElementById('galPlayerState');
    const art    = document.getElementById('galPlayerArt');
    const countN = document.getElementById('galPlayerCount');
    const ring   = document.getElementById('galPlayerRing');
    const backB  = document.getElementById('galPlayerBack');
    const fwdB   = document.getElementById('galPlayerFwd');
    if (!root) return;

    // A triangle looks centred when its CENTRE OF MASS is centred, not when
    // its bounding box is — the mass is all up against the flat edge and the
    // far side is a point. (8.25,4.5) (8.25,19.5) (19.5,12) averages to
    // exactly (12,12), the middle of the 24-unit box, so the glyph needs no
    // help from CSS. The pause bars are symmetric and centre themselves.
    const PLAY = 'M8.25 4.5v15L19.5 12z';
    const PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';
    // 2πr for r=30, which is what the ring's stroke-dasharray is set to. Kept
    // here rather than read back off the element so the two cannot drift.
    const RING = 188.5;

    // mm:ss, both halves padded — the gallery writes 00/10 on its loader and
    // 00 on its shot counter, so a bare 0:00 would be the odd one out. An hour
    // of audio simply reads 60:00 rather than growing an hours field nobody
    // needs for a four-track loop.
    const fmt = (s) => {
      const n = (typeof s === 'number' && isFinite(s) && s > 0) ? Math.floor(s) : 0;
      const pad2 = (v) => (v < 10 ? '0' + v : String(v));
      return pad2(Math.floor(n / 60)) + ':' + pad2(n % 60);
    };

    // audio.src reads back absolute, so comparing it to a configured URL means
    // resolving that the same way first.
    const abs = (u) => { try { return new URL(u, location.href).href; } catch (e) { return ''; } };

    // The fill, the thumb and the announced value all come from one number so
    // they cannot disagree.
    const progress = (f) => {
      const frac = Math.max(0, Math.min(1, f || 0));
      const pct = frac * 100;
      fill.style.width = pct.toFixed(2) + '%';
      thumb.style.left = pct.toFixed(2) + '%';
      // The ring around the play button is the same number drawn a second
      // time, so it is fed from here rather than from its own listener.
      if (ring) ring.style.strokeDashoffset = (RING * (1 - frac)).toFixed(2);
      bar.setAttribute('aria-valuenow', String(Math.round(pct)));
    };

    let tracks = [];
    let at = 0;
    const audio = new Audio();
    // Headers only, for the ONE track that is cued — never the whole file, and
    // never the other three. That is what makes the length on the right real
    // before anybody presses anything; with 'none' the player would sit on
    // 00:00 / 00:00 until the first press, which reads as a broken clock.
    audio.preload = 'metadata';
    // Put it in the DOM rather than leaving it detached. It stays invisible
    // either way, but an element that is actually in the document can be
    // inspected — by devtools, and by a test, which otherwise finds nothing
    // and quietly passes every assertion it makes about playback.
    audio.hidden = true;
    audio.setAttribute('aria-hidden', 'true');
    root.appendChild(audio);

    let coverOn = true;        // the shared switch; a track may still have none
    let fallbackCover = '';

    const pad2 = (v) => (v < 10 ? '0' + v : String(v));

    const paint = () => {
      const t = tracks[at] || {};
      // Artwork follows the track, falling back to the player's shared one.
      // The WRAPPER is hidden, not the <img>: the frame carries the border and
      // the shadow, and hiding only the image would leave an empty square.
      const src = coverOn ? (t.cover || fallbackCover) : '';
      if (src) { if (cover.getAttribute('src') !== src) cover.src = src; art.hidden = false; }
      else { art.hidden = true; }
      titleN.textContent = t.title || 'Untitled';
      artist.textContent = t.artist || '';
      // The whole byline goes, not just the name: the dash in front of it is
      // punctuation for a name that is not there.
      if (artist.parentElement) artist.parentElement.hidden = !t.artist;
      // Which of the four this is. Padded, like every other number the gallery
      // prints — the loader's 00/10 and the shot counter's 00.
      countN.textContent = tracks.length
        ? pad2(at + 1) + ' / ' + pad2(tracks.length)
        : '00 / 00';
      icon.setAttribute('d', audio.paused ? PLAY : PAUSE);
      playB.setAttribute('aria-label', audio.paused ? 'Play' : 'Pause');
      // Drives the glow, the ring's pulse and the pause bars' centring, all of
      // which are CSS — the class is the only switch they need.
      if (audio.paused) { root.classList.remove('is-playing'); playB.removeAttribute('data-playing'); }
      else { root.classList.add('is-playing'); playB.setAttribute('data-playing', ''); }
      // 'ready' rather than 'paused' before anything has been asked to play:
      // nothing has been paused yet, and the player should read as waiting.
      stateN.textContent = !audio.paused ? 'now playing'
        : (audio.src && audio.currentTime > 0) ? 'paused' : 'ready';
    };

    const load = (i, andPlay) => {
      if (!tracks.length) return;
      // Wraps both ways, so Previous on the first track goes to the last.
      at = (i + tracks.length) % tracks.length;
      audio.src = tracks[at].url;
      // The new track's length is unknown until its metadata arrives, so both
      // clocks go back to zero rather than keeping the last track's figures.
      progress(0);
      curN.textContent = fmt(0);
      durN.textContent = fmt(0);
      if (andPlay) start();
      paint();
    };

    // Has anyone actually asked for sound? Only headers are fetched up front,
    // and a cued track whose link has rotted fails on that fetch — long before
    // any press. Walking to the next track then would make a gallery with one
    // dead link start playing on arrival, so the error handler below checks
    // this first.
    let wanted = false;

    // Pressing play can still race the load — the browser rejects a play() it
    // cannot service yet. Swallowing that left the first press doing nothing at
    // all, which reads as a broken button. So a rejection waits for the element
    // to be ready and tries once more.
    const start = () => {
      wanted = true;
      const p = audio.play();
      if (!p || !p.catch) return;
      p.catch(() => {
        const retry = () => { audio.removeEventListener('canplay', retry); audio.play().catch(() => { paint(); }); };
        audio.addEventListener('canplay', retry);
        // If it never becomes ready, the error handler above takes over.
      });
    };

    // ── AUTOPLAY ──
    // Every browser refuses a play() that no gesture asked for, and on a phone
    // it refuses always. So a refusal is the NORMAL path here, not the error
    // path, and the whole design is about taking no for an answer:
    //
    //   · one attempt when the settings arrive, and only if the tab is
    //     actually being looked at — starting music in a tab somebody opened
    //     in the background and has not reached yet is worse than not starting
    //     at all, so that case waits for the tab to come forward;
    //   · if the attempt is refused, ONE more, on the first touch, click or
    //     key the page sees — the gesture the first attempt was missing;
    //   · and then never again. Listeners are once-only and remove each other,
    //     so nothing accumulates and nothing retries in a loop. A player that
    //     tried again on every tap would fight the visitor's own pause button,
    //     which is the failure mode worth more than the autoplay.
    //
    // The moment the visitor touches the player themselves, autoplay is over:
    // whatever they chose outranks what the setting wanted.
    let autoArmed = false;    // the one attempt has been made
    let userActed = false;    // the visitor has used the transport
    const GESTURES = ['pointerdown', 'keydown', 'touchstart'];
    const onGesture = () => {
      GESTURES.forEach((e) => window.removeEventListener(e, onGesture, true));
      if (userActed || !tracks.length || !audio.paused) return;
      if (!audio.src) load(at, true); else start();
    };
    const armAutoplay = () => {
      if (autoArmed || !tracks.length) return;
      autoArmed = true;
      const attempt = () => {
        if (userActed || !audio.paused) return;
        if (!audio.src) load(at, false);
        wanted = true;
        const p = audio.play();
        if (p && p.catch) {
          p.catch(() => {
            if (userActed) return;
            GESTURES.forEach((e) =>
              window.addEventListener(e, onGesture, { capture: true, once: true, passive: true }));
          });
        }
      };
      if (document.visibilityState === 'hidden') {
        const onVisible = () => {
          if (document.visibilityState === 'hidden') return;
          document.removeEventListener('visibilitychange', onVisible);
          attempt();
        };
        document.addEventListener('visibilitychange', onVisible);
      } else {
        attempt();
      }
    };

    playB.addEventListener('click', () => {
      userActed = true;
      if (!tracks.length) return;
      if (audio.paused) {
        if (!audio.src) load(at, true);
        // The cued track already failed — its headers never arrived, which is
        // why nothing was skipped at the time. A press is a request for sound,
        // so walk on to one that works rather than failing silently.
        else if (audio.error) { wanted = true; skips = 0; load(at + 1, true); }
        else start();
      }
      else audio.pause();
      paint();
    });
    // Skipping carries on with whatever is already happening: if it is
    // playing it keeps playing, and if it is paused it stays paused. The
    // earlier rule also started playback whenever anything had ever been
    // loaded, so stepping through tracks while deliberately paused began
    // making noise.
    // The ±10s pair. Nudging the position of whatever is cued, not changing
    // track — and clamped, because setting currentTime past the end fires
    // 'ended' and would silently behave like Next.
    const nudge = (by) => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      audio.currentTime = Math.max(0, Math.min(audio.duration - 0.25, audio.currentTime + by));
      curN.textContent = fmt(audio.currentTime);
      progress(audio.currentTime / audio.duration);
    };
    if (backB) backB.addEventListener('click', () => { userActed = true; nudge(-10); });
    if (fwdB) fwdB.addEventListener('click', () => { userActed = true; nudge(10); });

    // Stepping tracks or grabbing the rail counts as the visitor taking over,
    // the same as pressing play: whatever they do outranks what autoplay was
    // still hoping to do.
    prevB.addEventListener('click', () => { userActed = true; load(at - 1, !audio.paused); });
    nextB.addEventListener('click', () => { userActed = true; load(at + 1, !audio.paused); });

    audio.addEventListener('play', paint);
    audio.addEventListener('pause', paint);
    // The loop: the end of the last track is the start of the first.
    audio.addEventListener('ended', () => load(at + 1, true));
    // A track that will not play must not strand the player on it — but nor
    // must it spin. Skipping on error walks to the next track, and if THAT
    // fails too it walks again, so a gallery whose links have all rotted would
    // cycle forever, hammering the network and flickering the title.
    // So: skip at most once per track, and give up once every one has been
    // tried, leaving the player paused on the last attempt rather than looping.
    let skips = 0;
    const clearSkips = () => { skips = 0; };
    audio.addEventListener('playing', clearSkips);
    audio.addEventListener('loadeddata', clearSkips);
    audio.addEventListener('error', () => {
      // Nobody has pressed anything: this is the cued track's header fetch
      // failing, and the answer is to show it unplayable, not to go hunting.
      if (!wanted) { paint(); return; }
      if (tracks.length < 2 || skips >= tracks.length - 1) { skips = 0; try { audio.pause(); } catch (e) {} paint(); return; }
      skips++;
      load(at + 1, true);
    });
    // The length arrives separately from the audio, and for a stream it may
    // never arrive at all — hence the finiteness check rather than trusting it.
    const showDuration = () => {
      durN.textContent = (audio.duration && isFinite(audio.duration)) ? fmt(audio.duration) : fmt(0);
    };
    audio.addEventListener('loadedmetadata', showDuration);
    audio.addEventListener('durationchange', showDuration);

    // ── scrubbing ──
    // A drag, not just a click: the rail carries a thumb, and a thumb that
    // cannot be dragged is a lie. While dragging, timeupdate is ignored so the
    // bar follows the finger instead of fighting it.
    let dragging = false;
    const seekTo = (clientX) => {
      if (!audio.duration || !isFinite(audio.duration)) return;
      const r = bar.getBoundingClientRect();
      const f = r.width ? Math.max(0, Math.min(1, (clientX - r.left) / r.width)) : 0;
      audio.currentTime = f * audio.duration;
      progress(f);
      curN.textContent = fmt(audio.currentTime);
    };
    bar.addEventListener('pointerdown', (e) => {
      userActed = true;
      dragging = true;
      // Capture, so a drag that wanders off the rail keeps scrubbing and the
      // release is still heard here rather than by whatever is underneath.
      try { bar.setPointerCapture(e.pointerId); } catch (err) {}
      seekTo(e.clientX);
    });
    bar.addEventListener('pointermove', (e) => { if (dragging) seekTo(e.clientX); });
    const endDrag = (e) => {
      if (!dragging) return;
      dragging = false;
      try { bar.releasePointerCapture(e.pointerId); } catch (err) {}
    };
    bar.addEventListener('pointerup', endDrag);
    bar.addEventListener('pointercancel', endDrag);

    audio.addEventListener('timeupdate', () => {
      curN.textContent = fmt(audio.currentTime);
      if (dragging) return;
      if (!audio.duration || !isFinite(audio.duration)) return;
      progress(audio.currentTime / audio.duration);
    });

    // Called once the settings arrive. Idempotent, so a later settings change
    // re-points it rather than stacking a second player.
    window.__applyGalleryMusic = function (m) {
      // Only rows with a link are tracks. The settings keep a row the moment it
      // has anything in it — that is what lets a title be typed before the URL
      // in the panel — so the half-written ones are filtered out HERE rather
      // than being stored differently.
      const playable = (m && Array.isArray(m.tracks) ? m.tracks : []).filter((t) => t && t.url);
      const on = m && m.enabled === true && playable.length > 0;
      if (!on) {
        try { audio.pause(); } catch (e) {}
        // The class outlives the element being hidden, so it is cleared here
        // too — otherwise a player switched off mid-track comes back glowing.
        root.classList.remove('is-playing');
        root.hidden = true; tracks = []; return;
      }
      tracks = playable.slice(0, 4);
      // Stay where we are if the track in the element is still in the list: a
      // settings refresh should not jump the visitor back to the first song,
      // nor re-fetch what is already loaded.
      const here = audio.src ? tracks.findIndex((t) => abs(t.url) === audio.src) : -1;
      at = here >= 0 ? here : 0;
      audio.volume = Math.max(0, Math.min(100, typeof m.volume === 'number' ? m.volume : 60)) / 100;
      coverOn = m.showCover !== false;
      fallbackCover = m.coverUrl || '';
      cover.onerror = () => { art.hidden = true; };
      root.hidden = false;
      // Cueing the first track is what fetches its headers, and therefore what
      // puts a real length on the right-hand clock before anyone presses play.
      if (here >= 0) paint(); else load(at, false);
      // Asked for once there is something to play AND the way in has been
      // opened — see the curtain's all-clear above. With the enter gate on,
      // that all-clear comes from the visitor's click, which is a real user
      // gesture and so is the one thing a phone will accept. With the gate
      // off it comes from the loading screen lifting, and armAutoplay goes
      // back to asking and taking no for an answer.
      //
      // There is no "start on arrival" switch guarding this any more. The
      // gate answered the question the switch was asking.
      whenRevealed(armAutoplay);
    };
  })();

  const LOAD_STEPS = 10;
  const MIN_LOAD_MS = 5000;
  const MAX_LOAD_MS = 20000;

  // ONE NUMBER, READ OUT TWICE. The count used to be Math.round(f * 10) and
  // the percentage Math.round(f * 100), which are two different roundings of
  // the same fraction: the count stepped at 5%, 15%, 25% … so "05 / 10" came
  // up beside "45%" and the two halves of the same line disagreed for the
  // whole run. The percentage is the number now, and the count is its tens
  // digit, so they cannot drift — 05 / 10 appears exactly when the percentage
  // reads 50. Floor, not round, for the same reason: 100% and 10 / 10 should
  // mean finished rather than nearly.
  function setProgress(fraction){
    const f = Math.max(0, Math.min(1, fraction));
    const pct = Math.floor(f * 100 + 1e-9);
    loadFill.style.width = (f * 100).toFixed(1) + '%';
    loadN.textContent = pad(Math.floor(pct / (100 / LOAD_STEPS)));
    loadPct.textContent = pct + '%';
  }
  // The denominator never changes, so it is written once here rather than
  // sixty times a second inside setProgress — and, more to the point, it is
  // written NOW. setProgress only runs after the catalogue fetch comes back,
  // and the markup ships "00 / 00", so until the network answered the screen
  // said "Loading 00 / 00" and the 10 the visitor is counting towards was
  // nowhere on it.
  loadT.textContent = pad(LOAD_STEPS);

  // Resolves once BOTH are true: every image is in the cache, and the minimum
  // time has passed. The bar tracks whichever of the two is further behind, so
  // it never races ahead of the slower one and then sits still.
  function preload(urls){
    return new Promise((resolve) => {
      const started = Date.now();
      let loaded = 0;
      const total = urls.length;
      let settled = false;

      const finish = () => { if (settled) return; settled = true; cancelAnimationFrame(tickRaf); setProgress(1); resolve(); };

      // The title's own font counts as something to load. Without this the
      // screen could finish before the face arrived and the heading would wear
      // the fallback for the one moment it is the largest thing on the page —
      // which is exactly when a custom face is worth having.
      // The promise does not exist yet: settings arrive from a fetch, and this
      // loop starts before that. Reading it once at the top meant it was always
      // undefined, so the loader resolved immediately and never waited — which
      // is why the heading still wore the fallback face.
      // So it is picked up WHEN it appears, inside the tick below.
      let fontDone = false;
      let fontHooked = false;
      const hookFont = () => {
        if (fontHooked || !window.__galleryFontReady) return;
        fontHooked = true;
        Promise.resolve(window.__galleryFontReady).then(() => { fontDone = true; }, () => { fontDone = true; });
      };
      // Never let a font that never resolves hold the page; it is decoration.
      setTimeout(() => { fontDone = true; }, Math.min(MIN_LOAD_MS, 4000));

      urls.forEach((u) => {
        const im = new Image();
        im.onload = im.onerror = () => { loaded++; };
        im.src = u;
      });

      let tickRaf = 0;
      const tick = () => {
        hookFont();
        const elapsed = Date.now() - started;
        const byTime = Math.min(1, elapsed / MIN_LOAD_MS);
        const byImages = total ? loaded / total : 1;
        // byImages is exactly 0 until the FIRST photograph lands, so a plain
        // min() pinned the count at 00 / 10 and 0% for however long that took
        // — the one stretch where a visitor most wants to see something move.
        // The floor is a third of the elapsed time, which still cannot race
        // ahead of byTime and still cannot reach the end on its own: finish()
        // below waits for every image regardless of what the bar is showing.
        setProgress(Math.min(byTime, Math.max(byImages, byTime * 0.34)));
        if ((byImages >= 1 && fontDone && elapsed >= MIN_LOAD_MS) || elapsed >= MAX_LOAD_MS) { finish(); return; }
        tickRaf = requestAnimationFrame(tick);
      };
      tickRaf = requestAnimationFrame(tick);
    });
  }

  // The bar reaching 100% is a beat of its own. Lifting on the same frame is a
  // jump cut: the count never gets to BE ten out of ten for long enough to
  // read, and the work the screen was covering looks like it never happened.
  // So the finished screen is held, and only then does the curtain move.
  //
  // Unless there is a door behind it, in which case the door IS the beat, and
  // holding first would only be making the visitor wait to be allowed to wait.
  const REVEAL_HOLD_MS = 1500;
  // .g-enter's own transition, in milliseconds. The door is opaque after this.
  const ENTER_FADE_MS = 600;

  function finishLoading(){
    const gated = enterOn && enterEl && enterBtn;
    // Paint the grid underneath BEFORE the curtain starts to move, so the
    // fade reveals a finished page rather than one still assembling.
    requestAnimationFrame(() => {
      setTimeout(() => {
        // ── WITH A DOOR, THE GALLERY IS NEVER SHOWN BEHIND IT ──
        //
        // This used to run one way for both cases: the loading screen faded
        // out over 900ms and the gate went up at the end of it. But that fade
        // was the screen clearing off a gallery with nothing in front of it,
        // so the page was revealed for most of a second and then covered
        // again by the door — a flash of the room before being asked to knock.
        //
        // So the door goes up FIRST, over a loading screen that is still
        // fully lit, and the screen is only taken down once the door is
        // opaque. Not a crossfade between the two, deliberately: through two
        // half-faded covers the page shows faintly through both, which is the
        // same flash quieter. One cover is always at full strength, and the
        // swap underneath is invisible because something opaque is on top of
        // it.
        if (gated) {
          showEnter();
          setTimeout(() => {
            loader.classList.add('done');
            loader.setAttribute('aria-hidden', 'true');
            // No fade to wait out — nobody can see this happen.
            loader.style.display = 'none';
          }, ENTER_FADE_MS);
          return;
        }
        loader.classList.add('done');
        loader.setAttribute('aria-hidden', 'true');
        setTimeout(() => {
          loader.style.display = 'none';
          // Not when the curtain STARTS to move — when it has gone. Everything
          // waiting on the reveal is waiting to be seen, and for 900ms of fade
          // the page is still behind a veil.
          announceReveal();
        }, 900);
      }, gated ? 150 : REVEAL_HOLD_MS);
    });
  }

  async function load(){
    let d = null;
    try {
      const res = await fetch(GALLERY_API + '/get-gallery', { cache: 'no-store' });
      if (res.ok) d = await res.json();
    } catch (e) {}

    if (!d) {
      stateEl.querySelector('.msg').textContent = "Couldn't load the gallery";
      showEmpty();
      setProgress(1);
      finishLoading();
      return;
    }

    catalogue = {
      title: typeof d.title === 'string' ? d.title : '',
      intro: typeof d.intro === 'string' ? d.intro : '',
      sections: Array.isArray(d.sections) ? d.sections : [],
      images: Array.isArray(d.images) ? d.images : [],
      config: d.config || null,
    };

    if (catalogue.config) {
      likesOn = catalogue.config.likes !== false;
      if (window.__applyGallerySettings) window.__applyGallerySettings(catalogue.config);
      if (window.__applyGalleryMusic) window.__applyGalleryMusic(catalogue.config && catalogue.config.music);
      if (window.__setGalleryOverlay) window.__setGalleryOverlay(catalogue.config.overlay);
    } else if (window.__galleryThemeReady) {
      window.__galleryThemeReady();
    }

    const heading = (catalogue.config && catalogue.config.title && catalogue.config.title.text) || catalogue.title || 'Gallery';
    titleEl.textContent = heading;
    // The plate behind the heading is sized off the heading's own box now, so
    // nothing here has to be kept in step with the wording.
    loaderTitle.textContent = heading;
    document.title = heading + ' · ' + SITE_HOST;
    descEl.textContent = (catalogue.config && catalogue.config.description) || catalogue.intro || '';

    const urls = catalogue.images.map((im) => im.url).filter(Boolean);
    setProgress(0);
    await preload(urls);
    render();
    finishLoading();
  }

  // ── the expanded view ──
  function setStatus(msg, kind){
    lbStatus.textContent = msg || '';
    lbStatus.className = 'lb-status' + (kind ? ' ' + kind : '');
  }

  function renderComments(list){
    lbList.textContent = '';
    if (!list || !list.length) {
      const e = document.createElement('span'); e.className = 'lb-cmt-empty';
      e.textContent = 'No comments yet - be the first.';
      lbList.appendChild(e);
      lbCmtsH.textContent = 'Comments';
      return;
    }
    lbCmtsH.textContent = 'Comments · ' + list.length;
    const frag = document.createDocumentFragment();
    list.forEach((c) => {
      const row = document.createElement('div'); row.className = 'lb-cmt';
      const rail = document.createElement('div'); rail.className = 'lb-cmt-rail';
      const body = document.createElement('div'); body.className = 'lb-cmt-body';
      const head = document.createElement('div'); head.className = 'lb-cmt-head';
      const nm = document.createElement('span'); nm.className = 'lb-cmt-name'; nm.textContent = c.username || 'anonymous';
      const wh = document.createElement('span'); wh.className = 'lb-cmt-when'; wh.textContent = relTime(c.t);
      head.appendChild(nm); head.appendChild(wh);
      const tx = document.createElement('span'); tx.className = 'lb-cmt-text'; tx.textContent = c.comment || '';
      body.appendChild(head); body.appendChild(tx);
      row.appendChild(rail); row.appendChild(body);
      frag.appendChild(row);
    });
    lbList.appendChild(frag);
  }

  async function loadComments(imageId){
    lbList.textContent = '';
    const l = document.createElement('span'); l.className = 'lb-cmt-empty'; l.textContent = 'loading…';
    lbList.appendChild(l);
    try {
      const res = await fetch(GALLERY_API + '/get-gallery?image=' + encodeURIComponent(imageId), { cache: 'no-store' });
      const d = res.ok ? await res.json() : { comments: [] };
      const list = Array.isArray(d.comments) ? d.comments : [];
      const entry = flat.find((f) => f.img.id === imageId);
      if (entry) { entry.img.comments = list.length; refreshTileCounts(entry); }
      if (openIndex >= 0 && flat[openIndex] && flat[openIndex].img.id === imageId) {
        renderComments(list);
        lbCmtCount.textContent = String(list.length);
      }
    } catch (e) {
      if (openIndex >= 0 && flat[openIndex] && flat[openIndex].img.id === imageId) renderComments([]);
    }
  }

  function paintLike(entry){
    const liked = likedSet().has(entry.img.id);
    lbLike.classList.toggle('on', liked);
    lbLike.setAttribute('aria-pressed', liked ? 'true' : 'false');
    lbLikeCount.textContent = String(entry.img.likes || 0);
    lbLike.style.display = likesOn ? '' : 'none';
  }

  function paint(index){
    const entry = flat[index];
    if (!entry) return;
    openIndex = index;
    const img = entry.img;

    lbImg.alt = img.title || '';
    lbImg.src = img.url;
    lbGame.textContent = entry.sectionName || '';
    lbTitle.textContent = img.title || 'Untitled';
    lbDate.textContent = fmtDate(img.date);

    // Who took it. Two photographers share this gallery, so a visitor looking
    // at one photo should be able to tell whose it is without comparing tiles.
    const owner = img.owner;
    if (owner && owner.name) {
      lbByName.textContent = owner.name;
      // One element, many photographs: the inline style the last name left
      // behind has to go before the next one is painted, or a person with no
      // style of their own inherits the previous person's.
      ['background-image', 'background-size', 'animation', 'text-shadow',
        '-webkit-text-fill-color', 'color'].forEach((p) => lbByName.style.removeProperty(p));
      applyNameStyle(lbByName, owner.nameStyle);
      lbBy.hidden = false;
    } else {
      lbBy.hidden = true;
    }

    lbDesc.textContent = img.description || '';
    lbPos.textContent = pad(index + 1);
    lbTotal.textContent = pad(flat.length);
    lbCmtCount.textContent = String(img.comments || 0);
    document.getElementById('lb').setAttribute('aria-label', img.title || 'Photo');

    lbPrev.disabled = index <= 0;
    lbNext.disabled = index >= flat.length - 1;
    paintLike(entry);
    setStatus('');
    loadComments(img.id);
  }

  function openLightbox(index){
    lastFocus = document.activeElement;
    lbScrim.classList.add('open');
    lbScrim.setAttribute('aria-hidden', 'false');
    document.body.classList.add('overlay-lock');
    try { lbName.value = localStorage.getItem(NAME_KEY) || ''; } catch (e) {}
    paint(index);
    lbClose.focus();
  }
  // Closing is the X button's job and nothing else's: a stray click on the
  // backdrop while reading, or a reflexive Escape, should not throw away the
  // comment someone is halfway through typing.
  function closeLightbox(){
    // Full screen sits above this one, so it would otherwise be left floating
    // over a page with nothing behind it. Cut, do not shrink: the thing it
    // would shrink towards is going at the same moment.
    closeFull(true);
    lbScrim.classList.remove('open');
    lbScrim.setAttribute('aria-hidden', 'true');
    document.body.classList.remove('overlay-lock');
    lbImg.removeAttribute('src');
    openIndex = -1;
    if (lastFocus && typeof lastFocus.focus === 'function') { try { lastFocus.focus(); } catch (e) {} }
  }
  const step = (d) => { const n = openIndex + d; if (n >= 0 && n < flat.length) paint(n); };

  // ── FULL SCREEN ──
  // The photograph on its own, at nine tenths of the screen. A layer above the
  // expanded view rather than a class on the frame: the frame lives in a
  // scrolling column with its own rounding and shadow, and growing it in place
  // would have fought all three.
  const lbFull      = document.getElementById('lbFull');
  const lbFullImg   = document.getElementById('lbFullImg');
  const lbFullClose = document.getElementById('lbFullClose');
  const lbExpand    = document.getElementById('lbExpand');
  let fullTimer = 0;

  const openFull = () => {
    if (!lbFull || !lbImg.getAttribute('src')) return;
    clearTimeout(fullTimer);
    lbFull.classList.remove('closing');
    lbFullImg.src = lbImg.src;
    lbFullImg.alt = lbImg.alt || '';
    lbFull.classList.add('open');
    lbFull.setAttribute('aria-hidden', 'false');
    lbFullClose.focus();
  };
  // `instant` is for the case where the whole expanded view is going too:
  // there is nothing left to shrink against, and a photograph fading out over
  // a page the scrim has already left would read as a ghost.
  // Reduced motion silences the shrink in CSS, but CSS cannot reach a
  // setTimeout — so without this branch the visitor who asked for less motion
  // got the longest close of anyone: a motionless overlay held for the length
  // of an animation that was never going to play.
  const lbReduce = window.matchMedia('(prefers-reduced-motion: reduce)');
  const closeFull = (instant) => {
    if (!lbFull || !lbFull.classList.contains('open')) return;
    clearTimeout(fullTimer);
    if (instant || lbReduce.matches) {
      lbFull.classList.remove('open', 'closing');
      lbFull.setAttribute('aria-hidden', 'true');
      lbFullImg.removeAttribute('src');
      return;
    }
    // A short shrink, and the src is only dropped once it is done, so the
    // picture is still there to shrink. 130 rather than 210: the animation it
    // waits on is 120ms, and every millisecond past that is a press the
    // visitor makes and does not get back.
    lbFull.classList.add('closing');
    lbFull.setAttribute('aria-hidden', 'true');
    fullTimer = setTimeout(() => {
      lbFull.classList.remove('open', 'closing');
      lbFullImg.removeAttribute('src');
    }, 130);
    if (lbExpand && typeof lbExpand.focus === 'function') { try { lbExpand.focus(); } catch (e) {} }
  };

  if (lbExpand) lbExpand.addEventListener('click', openFull);
  // Wrapped, not passed straight in: closeFull's first argument is the
  // "cut it, do not shrink it" flag, and a click event is very truthy.
  if (lbFullClose) lbFullClose.addEventListener('click', () => closeFull());
  // Anywhere on the backdrop closes it. Unlike the expanded view there is
  // nothing here to lose — no half-typed comment, just a picture.
  if (lbFull) lbFull.addEventListener('click', (e) => { if (e.target !== lbFullClose) closeFull(); });

  lbClose.addEventListener('click', closeLightbox);
  lbPrev.addEventListener('click', () => step(-1));
  lbNext.addEventListener('click', () => step(1));
  document.addEventListener('keydown', (e) => {
    if (!lbScrim.classList.contains('open')) return;
    // Full screen takes the keys while it is up: Escape leaves it rather than
    // the expanded view behind it, and the arrows would otherwise change the
    // photo underneath without the one on screen following.
    if (lbFull && lbFull.classList.contains('open')) {
      if (e.key === 'Escape') { e.preventDefault(); closeFull(); }
      return;
    }
    const typing = document.activeElement === lbName || document.activeElement === lbBody;
    if (typing) return;
    if (e.key === 'ArrowLeft') step(-1);
    else if (e.key === 'ArrowRight') step(1);
  });
  document.getElementById('lb').addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    const f = [...document.getElementById('lb').querySelectorAll('button:not([disabled]),input,textarea')];
    if (!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  });

  // ── liking ──
  lbLike.addEventListener('click', async () => {
    const entry = flat[openIndex];
    if (!entry || !likesOn) return;
    const set = likedSet();
    const liked = !set.has(entry.img.id);
    // Move the UI first; a like that waits on the network feels broken.
    if (liked) set.add(entry.img.id); else set.delete(entry.img.id);
    saveLiked(set);
    entry.img.likes = Math.max(0, (entry.img.likes || 0) + (liked ? 1 : -1));
    paintLike(entry); refreshTileCounts(entry);
    try {
      const res = await fetch(GALLERY_API + '/like-image', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageId: entry.img.id, liked }),
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && typeof d.likes === 'number') {
        entry.img.likes = d.likes; paintLike(entry); refreshTileCounts(entry);
      } else if (!res.ok) {
        // Put it back the way it was rather than showing a number the server
        // disagrees with.
        if (liked) set.delete(entry.img.id); else set.add(entry.img.id);
        saveLiked(set);
        entry.img.likes = Math.max(0, (entry.img.likes || 0) + (liked ? -1 : 1));
        paintLike(entry); refreshTileCounts(entry);
      }
    } catch (e) {}
  });

  // ── commenting ──
  lbForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const entry = flat[openIndex];
    if (!entry) return;
    const username = lbName.value.trim();
    const comment = lbBody.value.trim();
    if (!username) { setStatus('add a discord username', 'err'); lbName.focus(); return; }
    if (comment.length < 2) { setStatus('write a little more', 'err'); lbBody.focus(); return; }

    try {
      const last = parseInt(localStorage.getItem(COOLDOWN_KEY) || '0', 10) || 0;
      const left = COOLDOWN_MS - (Date.now() - last);
      if (left > 0) { setStatus('wait ' + Math.ceil(left / 1000) + 's', 'err'); return; }
    } catch (e2) {}

    lbSend.disabled = true;
    setStatus('posting…');
    try {
      const res = await fetch(GALLERY_API + '/send-gallery-comment', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageId: entry.img.id, username, comment }),
      });
      const d = await res.json().catch(() => ({}));
      if (!res.ok) { setStatus(d.error || 'could not post that', 'err'); lbSend.disabled = false; return; }
      setStatus('posted ✓', 'ok');
      // Tell THIS site to look for it now, so the photo's owner here gets it
      // in Discord straight away (same-origin, no data, rate-limited).
      fetch('/.netlify/functions/gallery-comment-check', { method: 'POST' }).catch(() => {});
      lbBody.value = '';
      try {
        localStorage.setItem(NAME_KEY, username);
        localStorage.setItem(COOLDOWN_KEY, String(Date.now()));
      } catch (e3) {}
      entry.img.comments = (entry.img.comments || 0) + 1;
      refreshTileCounts(entry);
      await loadComments(entry.img.id);
    } catch (e4) {
      setStatus('connection error', 'err');
    }
    lbSend.disabled = false;
  });

  // ── the photos are not yours to take ──
  // Casual-only, and honestly so: the browser has to receive the bytes to show
  // them, so anyone determined still can. This stops the reflex — right-click,
  // save image; F12, read the page — and nothing more. The same block runs on
  // index.html; change one, change both.
  //
  // The context menu goes page-wide rather than image-only. It used to test
  // for an IMG inside .g-shot or .lb-frame, which left out the two biggest
  // targets on the page: the full-screen photograph, which is the largest
  // image here, and the player's cover art. Fields keep their own menu, or
  // right-click paste into the comment box would stop working.
  const isField = (el) => el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable);
  document.addEventListener('contextmenu', (e) => { if (!isField(e.target)) e.preventDefault(); });
  document.addEventListener('dragstart', (e) => {
    if (e.target && e.target.tagName === 'IMG' &&
        e.target.closest('.g-shot, .lb-frame, .lb-full, .g-player-art')) e.preventDefault();
  });
  // e.code, not e.key. On a Mac the inspector is Cmd+Option+I, and Option+i
  // is a dead key on a US layout — e.key arrives as a circumflex, not an "i",
  // so a handler written against e.key misses macOS entirely. e.code is the
  // physical key and does not care about the layout or the modifiers.
  document.addEventListener('keydown', (e) => {
    const code = e.code || '';
    const ctrl = e.ctrlKey || e.metaKey;
    const inspect = ctrl && (e.shiftKey || e.altKey) && (code === 'KeyI' || code === 'KeyJ' || code === 'KeyC');
    const source  = ctrl && !e.shiftKey && !e.altKey && (code === 'KeyU' || code === 'KeyS');
    if (code === 'F12' || inspect || source) e.preventDefault();
  });

  // ── boot ──
  // The drawer's colours come from the main site's theme; everything else on
  // this page comes from the gallery's own settings, which arrive with the
  // catalogue.
  // get-content is THIS site's, same-origin: it also brings this site's
  // favicon and whose Discord avatar marks the drawer.
  fetch('/.netlify/functions/get-content')
    .then((r) => (r.ok ? r.json() : null))
    .then((d) => {
      if (!d) return;
      if (d.theme && window.__applyNavTheme) window.__applyNavTheme(d.theme);
      // Same rule as the main page: the admin's favicon, else /favicon.png.
      const fav = d.features && typeof d.features.faviconUrl === 'string' ? d.features.faviconUrl.trim() : '';
      const setIcon = (href) => {
        document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach((l) => {
          if (l.getAttribute('href') === href) return;
          const n = document.createElement('link'); n.rel = l.rel; n.href = href; l.replaceWith(n);
        });
        try { if (href !== '/favicon.png?v=3') localStorage.setItem('faviconCache', href); else localStorage.removeItem('faviconCache'); } catch (e) {}
      };
      // A custom favicon only if it really loads as an image.
      if (fav) { const probe = new Image(); probe.onload = () => setIcon(fav); probe.onerror = () => setIcon('/favicon.png?v=3'); probe.src = fav; }
      else setIcon('/favicon.png?v=3');
      if (typeof d.discordUserId === 'string' && /^\d{15,25}$/.test(d.discordUserId)) syncNavAvatar(d.discordUserId);
    })
    .catch(() => {});
  // The drawer's mark is this site owner's Discord avatar, live from Lanyard —
  // the same ?size=256 URL the main page builds and caches.
  function syncNavAvatar(id){
    fetch('https://api.lanyard.rest/v1/users/' + id)
      .then((r) => (r.ok ? r.json() : null))
      .then((j) => {
        const u = j && j.success && j.data && j.data.discord_user;
        if (!u || !u.avatar) return;
        const url = 'https://cdn.discordapp.com/avatars/' + id + '/' + u.avatar + '.' + (u.avatar.startsWith('a_') ? 'gif' : 'png') + '?size=256';
        const mark = document.getElementById('navSideAvatar');
        if (mark && mark.src !== url) { mark.style.visibility = ''; mark.src = url; }
        try { localStorage.setItem('avatarUrlCache', url); } catch (e) {}
      })
      .catch(() => {});
  }
  load();
})();
</script>

</body>
</html>
